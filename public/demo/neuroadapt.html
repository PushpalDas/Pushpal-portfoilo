      'The bursting unit against the Poisson unit. Unit 1 is bimodal &mdash; intervals inside a burst near 5 ms, intervals between bursts near 1 s. Unit 2 is the broad single mode a Poisson process produces.',
      'units[0].isi_hist, units[1].isi_hist', 'Show the stored arrays',
      'units[0].isi_hist = [' + F.units[0].isi_hist.join(', ') + ']\nunits[1].isi_hist = [' + F.units[1].isi_hist.join(', ') + ']') +
    '</div>';

  h += '<a id="rp-population"></a><h3>04 &middot; Population-level features</h3>' +
    '<div class="tier pop"><div class="tier-label">Tier 2 &mdash; population, computed across units</div>' +
    '<p>Separated from tier 1 deliberately. A new single-unit metric can be added above without disturbing anything here, and nothing here can be read as a statement about one neuron.</p>' +
    figWrap('Cross-correlogram, units 4 and 5', figCcg(p),
      '<b>' + p.coincident_spikes + '</b> of unit 4&rsquo;s ' + F.units[3].n_spikes + ' spikes have a unit 5 spike within 5 ms: a coincidence fraction of <b>' +
      fmt(p.coincidence_fraction, 2) + '</b>. The simulation injected ' + F.dataset.injected_sync_events + ' synchronous events.',
      'population.pairs[k].ccg') +
    figWrap('Where each unit sits in the first two components', figLoadings(),
      'The first two components carry <b>' + fmt(e[0] + e[1], 1) + '%</b> of the population variance, against a pre-agreed bar of 80%. Unit 1 carries the first, units 4 and 5 carry the second together.',
      'population.pca.loadings[0] and [1], population.pca.explained') +
    '</div>';

  h += '<a id="rp-interpretation"></a><h3>05 &middot; Interpretation</h3>' +
    '<p>Written by the model from the values above. It receives the feature store and no spike times, so it can describe a number and cannot produce one.</p>' +
    '<div class="gen' + (gen.passed ? '' : ' withheld') + '"><div class="h"><span class="badge model">gpt-4o-mini</span>' +
    '<span class="t">' + (gen.passed ? 'Interpretation' : 'Explanation withheld') + '</span>' +
    '<span class="spacer" style="margin-left:auto"></span>' +
    '<button class="btn sm" id="doInject" aria-pressed="' + state.inject + '">' +
    (state.inject ? 'Remove the ungrounded number' : 'Inject an ungrounded number') + '</button></div>';
  if (gen.passed) {
    h += '<p>' + gen.html + '</p>';
  } else {
    h += '<p style="opacity:.55">' + gen.html + '</p>' +
      '<div class="note warn" style="margin-top:10px">' + gen.failed.length + ' number' + (gen.failed.length === 1 ? '' : 's') +
      ' in the draft (' + gen.failed.map(function (f) { return esc(f.token); }).join(', ') +
      ') matched no field in the feature store. The draft is withheld and the deterministic summary is used instead.</div>' +
      '<div class="card tight" style="margin-top:12px;background:var(--surface-2)"><div class="badge rule" style="margin-bottom:8px">template summary</div>' +
      '<p style="margin:0;font-family:var(--mono);font-size:12px">' + esc(templateSummary()) + '</p></div>';
  }
  h += '<div class="check"><span class="dot ' + (gen.passed ? 'good' : 'crit') + '"></span>' +
    '<b style="color:var(--ink)">' + (gen.checked.length - gen.failed.length) + ' of ' + gen.checked.length +
    '</b> numbers in the text traced to a field in the feature store. Hover a highlighted number to see which field.' +
    (gen.passed ? '' : ' A single unmatched number withholds the whole paragraph.') +
    '</div></div>';

  h += '<a id="rp-limits"></a><h3>06 &middot; What this does not establish</h3>' +
    '<p>Every figure in this report comes from simulated spike trains with no spike-sorting error. Sorting error is the dominant source of noise in a real recording, and a metric that recovers planted structure perfectly may be quite sensitive to units merged or split upstream. This validates the implementation. It says nothing about the science.</p>' +
    '<p class="ruo" style="margin-top:18px">Research use only. Simulated data. No claim about any real recording.</p>';

  h += '</div>';
  return h;
}
function pageBtn(id, n, label) {
  return '<button class="page-btn" data-at="' + id + '" aria-current="' + (state.at === id) + '">' +
    '<span class="n">' + n + '</span>' + esc(label) + '</button>';
}

/* ------------------------------------------------------------
   11. RETRIEVAL

   Deliberately downstream. It answers from the feature store or
   it refuses; there is no third behaviour, and refusing is the
   common case for the questions people actually bring.
   ------------------------------------------------------------ */
function answers() {
  var p = pairOf('4-5'), e = F.population.pca.explained, u1 = F.units[0];
  return [
    { q: 'Which unit is the most bursty, and by how much?',
      a: 'Unit 1. Its burst index is ' + fmt(u1.burst_index, 2) + ' against ' + fmt(F.units[1].burst_index, 2) +
        ' for the Poisson unit and ' + fmt(F.units[2].burst_index, 2) + ' for the regular unit, and its ISI coefficient of variation is ' +
        fmt(u1.isi_cv, 2) + '. Burst index here is the fraction of intervals below 20 ms; under a 10 ms threshold the same spike train scores ' +
        fmt(burstDefinitions(0)[1].v, 2) + '.',
      c: ['units[0].burst_index', 'units[1].burst_index', 'units[2].burst_index', 'units[0].isi_cv', 'preprocessing.burst_isi_threshold_ms'] },
    { q: 'How synchronous are units 4 and 5?',
      a: p.coincident_spikes + ' of unit 4’s ' + F.units[3].n_spikes + ' spikes have a unit 5 spike within 5 ms, a coincidence fraction of ' +
        fmt(p.coincidence_fraction, 2) + '. On 100 ms binned counts the Pearson correlation is ' + fmt(p.binned_pearson, 2) +
        '. Those are two different measurements and the report carries both, because "synchrony" alone does not identify either.',
      c: ['population.pairs[9].coincident_spikes', 'population.pairs[9].coincidence_fraction', 'population.pairs[9].binned_pearson'] },
    { q: 'Is the population activity low-dimensional?',
      a: 'Two components carry ' + fmt(e[0] + e[1], 1) + '% of the variance: PC1 at ' + fmt(e[0], 1) + '% and PC2 at ' + fmt(e[1], 1) +
        '%. PC1 loads almost entirely on unit 1 and PC2 on units 4 and 5. The simulation planted exactly two coordinated patterns, so this is the pipeline recovering a known answer rather than a finding.',
      c: ['population.pca.explained[0]', 'population.pca.explained[1]', 'population.pca.loadings[0]', 'population.pca.loadings[1]'] },
    { q: 'What bin width was used, and does it matter?',
      a: '100 ms, for both the Fano factor and the PCA. It matters: the Fano factor is variance over mean of counts in those bins, so a 50 ms bin gives a different number for the same spikes under the same name. The value is recorded in the preprocessing block of every report.',
      c: ['preprocessing.bin_width_ms', 'units[i].fano_factor', 'population.pca'] },
    { q: 'Is unit 1 an interneuron?',
      refuse: 'Not in the feature set. NeuroAdapt computes timing features from sorted spike trains: firing rate, ISI coefficient of variation, burst index, Fano factor, pairwise coincidence, binned correlation and principal components. Cell type is not among them, and a high burst index is not a cell type. Waveform features would be the place to start, and this run has none.' },
    { q: 'Did bursting increase after the drug was applied?',
      refuse: 'Not in the feature set. This dataset carries no condition labels and no second epoch — it is one ten-second window with three planted structures. A before-and-after comparison would need two analysis windows and a stated hypothesis, neither of which exists in this run.' },
  ];
}

function viewAsk() {
  var qs = answers();
  var h = head('Stage 06', 'Ask the report',
    'The retrieval layer sits on top of the feature set and is not the contribution. It is useful, and keeping it downstream is what lets the feature set stand alone if the rest is discarded.');

  h += '<div class="asklist">';
  qs.forEach(function (q, i) {
    h += '<button class="askq" data-ask="' + i + '" aria-pressed="' + (state.ask === i) + '">' + esc(q.q) +
      (q.refuse ? ' <span class="badge crit" style="margin-left:6px">refused</span>' : '') + '</button>';
  });
  h += '</div>';

  if (state.ask !== null && qs[state.ask]) {
    var q = qs[state.ask];
    h += '<div class="answer' + (q.refuse ? ' refusal' : '') + '"><div class="q">' + esc(q.q) + '</div>';
    if (q.refuse) {
      h += '<div class="badge crit" style="margin-bottom:10px">no answer available</div><p>' + esc(q.refuse) + '</p>';
    } else {
      h += '<p>' + esc(q.a) + '</p><div class="cites"><b>fields cited:</b> ' + q.c.map(esc).join(' &middot; ') + '</div>';
    }
    h += '</div>';
  } else {
    h += '<div class="note">Pick a question. Two of the six are refused, which is roughly the rate that holds for the questions researchers actually bring &mdash; most of them are about the experiment rather than about the spikes.</div>';
  }

  h += '<div class="card" style="margin-top:16px"><h3>What the layer is allowed to do</h3>' +
    '<div class="prov">' +
    row('Receives', 'the feature store, the preprocessing block, and the report sections') +
    row('Never receives', 'spike times, or any value it could recompute') +
    row('Must cite', 'a field path for every quantitative statement') +
    row('Refuses when', 'the answer is not a field in the store, however reasonable the question') +
    '</div></div>';
  return h;
}

/* ------------------------------------------------------------
   12. EXPORT
   ------------------------------------------------------------ */
function exportNwb() {
  var u = F.units;
  var lines = [
    '<span class="c"># NWB 2.6 - the feature set appended to the file the spikes came from,</span>',
    '<span class="c"># so the definition travels with the data instead of living in a repo.</span>',
    '',
    '<span class="k">/units</span>                                  <span class="c"># existing table, untouched</span>',
    '  spike_times, unit_id, quality',
    '',
    '<span class="k">/processing/neuroadapt_features</span>        <span class="c"># added by this run</span>',
    '  description = <span class="s">"NeuroAdapt spike-v0.1, parameter hash ' + PARAM_HASH + '"</span>',
    '',
    '  <span class="k">unit_features</span>  <span class="c"># DynamicTable, one row per unit</span>',
  ];
  ['firing_rate_hz', 'isi_cv', 'burst_index', 'fano_factor'].forEach(function (id) {
    var d = defOf(id);
    lines.push('    <span class="k">' + id + '</span>');
    lines.push('      description = <span class="s">"' + d.def + '"</span>');
    lines.push('      unit        = <span class="s">"' + (d.unit || '1') + '"</span>');
    lines.push('      values      = [' + u.map(function (x) { return '<span class="n">' + fmt(x[id], 2) + '</span>'; }).join(', ') + ']');
  });
  lines.push('');
  lines.push('  <span class="k">population_features</span>');
  lines.push('    coincident_spikes  description = <span class="s">"' + DEFS.coincident_spikes.def + '"</span>');
  lines.push('                       values = {' + F.population.pairs.map(function (p) {
    return '"' + p.id + '": <span class="n">' + p.coincident_spikes + '</span>';
  }).join(', ') + '}');
  lines.push('    pca_explained_pct  description = <span class="s">"' + DEFS.pc_explained.def + '"</span>');
  lines.push('                       values = [' + F.population.pca.explained.map(function (v) {
    return '<span class="n">' + fmt(v, 2) + '</span>';
  }).join(', ') + ']');
  lines.push('');
  lines.push('<span class="c"># Every column carries its own description. A lab that opens this file</span>');
  lines.push('<span class="c"># six years from now reads the definition out of the file, not out of us.</span>');
  return lines.join('\n');
}
function exportCsv() {
  var head = ['# NeuroAdapt spike-v0.1  parameter_hash=' + PARAM_HASH + '  feature_hash=' + FEATURE_HASH,
    '# firing_rate_hz: ' + DEFS.firing_rate_hz.def,
    '# isi_cv: ' + DEFS.isi_cv.def,
    '# burst_index: ' + DEFS.burst_index.def,
    '# fano_factor: ' + DEFS.fano_factor.def,
    '# analysis_window=0.000-10.000s  bin=100ms  burst_isi=20ms  coincidence=5ms  smoothing=none',
    'unit_id,n_spikes,firing_rate_hz,isi_cv,burst_index,fano_factor'];
  F.units.forEach(function (u) {
    head.push([u.id, u.n_spikes, fmt(u.firing_rate_hz, 3), fmt(u.isi_cv, 3), fmt(u.burst_index, 3), fmt(u.fano_factor, 3)].join(','));
  });
  return head.map(function (l) {
    return l.charAt(0) === '#' ? '<span class="c">' + l + '</span>' : l;
  }).join('\n');
}
function exportJson() {
  var o = {
    profile: 'spike-v0.1',
    parameter_hash: PARAM_HASH,
    feature_hash: FEATURE_HASH,
    preprocessing: F.preprocessing.reduce(function (a, c) { a[c.c] = c.v; return a; }, {}),
    definitions: Object.keys(DEFS).reduce(function (a, k) { a[k] = DEFS[k].def; return a; }, {}),
    units: F.units.map(function (u) {
      return { unit_id: u.id, n_spikes: u.n_spikes, firing_rate_hz: +fmt(u.firing_rate_hz, 3),
        isi_cv: +fmt(u.isi_cv, 3), burst_index: +fmt(u.burst_index, 3), fano_factor: +fmt(u.fano_factor, 3) };
    }),
    population: {
      pairs: F.population.pairs.map(function (p) {
        return { pair: p.id, coincident_spikes: p.coincident_spikes,
          coincidence_fraction: +fmt(p.coincidence_fraction, 3), binned_pearson: +fmt(p.binned_pearson, 3) };
      }),
      pca_explained_pct: F.population.pca.explained.map(function (v) { return +fmt(v, 2); }),
    },
  };
  return esc(JSON.stringify(o, null, 2));
}
function viewExport() {
  var h = head('Stage 07', 'Export',
    'The output goes into an established container, not a better spreadsheet. Writing into NWB is what makes the definition travel with the data &mdash; a bespoke CSV would have reproduced the exact failure the audit found.');
  h += '<div class="tabs">' +
    ['nwb', 'csv', 'json'].map(function (f) {
      return '<button class="tab" data-format="' + f + '" aria-current="' + (state.format === f) + '">' +
        (f === 'nwb' ? 'NWB container' : f.toUpperCase()) + '</button>';
    }).join('') + '</div>';
  h += '<pre class="code">' + (state.format === 'nwb' ? exportNwb() : state.format === 'csv' ? exportCsv() : exportJson()) + '</pre>';
  h += '<div class="note" style="margin-top:14px">All three carry the same parameter hash and the same definitions. The CSV and the JSON exist for convenience; the NWB file is the one that survives the person who made it.</div>';
  return h;
}

/* ------------------------------------------------------------
   13. RENDER AND ROUTING
   ------------------------------------------------------------ */
function renderRail() {
  var h = '<div class="rail-group"><div class="rail-label">Pipeline</div>';
  VIEWS.forEach(function (v, i) {
    if (i === 4) h += '</div><div class="rail-group"><div class="rail-label">Output</div>';
    h += '<button class="rail-item" data-view="' + v.id + '" aria-current="' + (state.view === v.id) + '">' +
      '<span class="n">' + v.n + '</span><span>' + esc(v.t) + '<span class="sub">' + esc(v.s) + '</span></span></button>';
  });
  h += '</div><div class="rail-note"><b>Every number is computed here.</b> The five spike trains are generated in your browser from fixed seeds, and no value on any screen is stored in the page.</div>';
  $('rail').innerHTML = h;
}

function renderFoot() {
  $('foot').innerHTML =
    '<b>What this is.</b> A working re-run of the validation dataset described in the NeuroAdapt whitepaper: five units, ten seconds, three planted structures with known ground truth. ' +
    'The spike times are generated in the browser from the seeds shown on the run screen, and every metric, figure and sentence is computed from them at render time &mdash; nothing on this page is a stored figure. ' +
    'The whitepaper&rsquo;s headline results reproduce here: <b>' + pairOf('4-5').coincident_spikes + '</b> coincident spikes at zero lag, a coincidence fraction of <b>' +
    fmt(pairOf('4-5').coincidence_fraction, 2) + '</b>, and <b>' + fmt(F.population.pca.explained[0] + F.population.pca.explained[1], 1) +
    '%</b> of population variance in the first two components. Per-unit statistics differ from the paper&rsquo;s where the draw differs; the run screen shows the seeds so the difference is checkable rather than mysterious. ' +
    '<br><br><b>What it is not.</b> Simulated data, research use only. No real recording, no unpublished collaborator result, and no claim about neurons. ' +
    'The interpretation paragraph is written by a model that receives the computed features and no spike times, and is withheld if any number in it fails to match a field.';
}

/* The strip under the masthead: the five spike trains compressed
   to a ribbon. Drawn from the same seeded data as everything else,
   so even the ornament on this page is a measurement. */
function renderMotif() {
  var W = 1200, H = 26, s = '';
  for (var i = 0; i < 5; i++) {
    var u = F.units[i], y = 2.5 + i * 4.3;
    for (var k = 0; k < u.times.length; k++) {
      var x = (u.times[k] / T) * W;
      s += '<line x1="' + x.toFixed(1) + '" y1="' + y.toFixed(1) + '" x2="' + x.toFixed(1) +
        '" y2="' + (y + 3.4).toFixed(1) + '" stroke="' + cvar(u.color) + '" stroke-width="1" opacity="0.55"/>';
    }
  }
  $('motif').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true" focusable="false">' + s + '</svg>';
}

function render() {
  renderRail();
  var v = { run: viewRun, units: viewUnits, population: viewPopulation, definitions: viewDefinitions,
    report: viewReport, ask: viewAsk, export: viewExport }[state.view] || viewRun;
  var pane = $('pane');
  pane.innerHTML = v();
  pane.classList.remove('is-in');
  void pane.offsetWidth;
  pane.classList.add('is-in');
  $('chipProfile').innerHTML = '<span class="dot accent"></span>profile <b>spike-v0.1</b>';
  $('chipHash').innerHTML = 'features <b>' + FEATURE_HASH + '</b>';
  $('runTitle').textContent = state.ran ? 'Run NA-2026-000148' : 'Run NA-2026-000148 — not started';
  wire();
  if (state.view === 'report' && state.at) {
    var el = $('rp-' + state.at);
    if (el) setTimeout(function () { el.scrollIntoView({ behavior: MOTION_OK ? 'smooth' : 'auto', block: 'start' }); }, 60);
  }
}

function wire() {
  document.querySelectorAll('[data-view]').forEach(function (b) {
    b.onclick = function () { go(b.dataset.view); };
  });
  document.querySelectorAll('[data-unit]').forEach(function (b) {
    b.onclick = function () {
      var v = b.dataset.unit;
      state.unit = v === '' ? null : parseInt(v, 10) - 1;
      render();
    };
  });
  document.querySelectorAll('[data-pair]').forEach(function (b) {
    b.onclick = function () { state.pair = b.dataset.pair; render(); };
  });
  document.querySelectorAll('[data-metric]').forEach(function (b) {
    b.onclick = function () { state.metric = b.dataset.metric; render(); };
  });
  document.querySelectorAll('[data-format]').forEach(function (b) {
    b.onclick = function () { state.format = b.dataset.format; render(); };
  });
  document.querySelectorAll('[data-ask]').forEach(function (b) {
    b.onclick = function () { state.ask = parseInt(b.dataset.ask, 10); render(); };
  });
  document.querySelectorAll('[data-at]').forEach(function (b) {
    b.onclick = function () { state.at = b.dataset.at; render(); };
  });
  document.querySelectorAll('[data-raw]').forEach(function (b) {
    b.onclick = function () {
      var el = $(b.dataset.raw);
      el.hidden = !el.hidden;
      b.textContent = el.hidden ? 'Show the stored array' : 'Hide';
    };
  });
  var run = $('doRun');
  if (run) run.onclick = function () { state.ran = true; render(); };
  var det = $('doDet');
  if (det) det.onclick = function () {
    var again = featureHash(buildFeatures());
    state.determinism = { same: again === FEATURE_HASH, h: again };
    render();
  };
  var inj = $('doInject');
  if (inj) inj.onclick = function () { state.inject = !state.inject; render(); };
}

/* ------------------------------------------------------------
   14. DEEP LINKS

   The case study links a screenshot to the state it pictures, so
   every screen the page shows is reachable by URL.
   ------------------------------------------------------------ */
(function init() {
  var q = new URLSearchParams(location.search);
  var view = q.get('view');
  if (view && VIEWS.some(function (v) { return v.id === view; })) state.view = view;
  if (q.get('unit')) { var qu = parseInt(q.get('unit'), 10); if (qu >= 1 && qu <= 5) state.unit = qu - 1; }
  if (q.get('pair') && pairOf(q.get('pair'))) state.pair = q.get('pair');
  /* Only two metrics and three formats exist. Anything else is
     treated as the default instead of rendering silent weirdness. */
  if (q.get('metric')) state.metric = q.get('metric') === 'sync' ? 'sync' : 'burst';
  if (q.get('format')) state.format = ['nwb', 'csv', 'json'].indexOf(q.get('format')) >= 0 ? q.get('format') : 'nwb';
  if (q.get('at')) state.at = q.get('at');
  if (q.get('ask')) state.ask = parseInt(q.get('ask'), 10);
  if (q.get('inject') === '1') state.inject = true;
  /* A deep link lands on a finished run unless ?fresh=1 asks for
     the pipeline stopped at the first stage. */
  state.ran = q.get('fresh') !== '1';
  if (q.get('fresh') === '1') state.view = 'run';
  renderMotif();
  renderFoot();
  render();
})();
</script>
