<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroAdapt Feature Extraction</title>
<meta name="description" content="Interactive demo of the NeuroAdapt spike-train feature extraction module: unit and population features computed in the browser from simulated spike trains, every metric carrying its definition, and a grounding check in front of the generated prose.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
</head>
<body>
<!-- ARTIFACT-BODY-START -->
<style>
/* ============================================================
   NeuroAdapt - spike-train feature extraction, interactive demo.
   Identity: instrument-grade scientific tooling. Paper ground,
   ink text, one teal signal reserved for the thing being pointed
   at - the selected definition, the planted structures, the
   zero-lag bar. Source Serif 4 carries the prose, IBM Plex Mono
   carries every number. Single light theme, every colour painted
   explicitly.
   ============================================================ */
:root {
  color-scheme: light;
  --bg: #f5f4ef;
  --surface: #fffefb;
  --surface-2: #f0eee7;
  --surface-3: #e8e5da;
  --line: #d8d4c6;
  --line-soft: #e6e3d8;
  --ink: #191812;
  --body: #3a3930;
  --muted: #6d6a5d;
  --faint: #8a8677;
  --accent: #0b6e64;
  --accent-deep: #084f48;
  --accent-wash: rgba(11, 110, 100, 0.07);
  --good: #3d6b2f;
  --ok: var(--good);
  --good-wash: rgba(61, 107, 47, 0.09);
  --warn: #8a5c12;
  --warn-wash: rgba(138, 92, 18, 0.09);
  --crit: #a2331b;
  --crit-wash: rgba(162, 51, 27, 0.07);
  --u1: #23221a;
  --u2: #7d7969;
  --u3: #aaa593;
  --u4: #0b6e64;
  --u5: #55a094;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --rail: 240px;
}

* { box-sizing: border-box; }

html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--body);
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.6;
  text-rendering: optimizeLegibility;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: rgba(11, 110, 100, 0.16); }
button { font: inherit; color: inherit; cursor: pointer; }
select, input, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* -- App chrome ------------------------------------------- */
.app {
  min-height: 100vh;
  max-width: 1380px;
  margin: 0 auto;
  background: var(--bg);
  border-left: 1px solid var(--line-soft);
  border-right: 1px solid var(--line-soft);
  display: flex;
  flex-direction: column;
}

.topbar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(245, 244, 239, 0.96);
  backdrop-filter: blur(8px);
  border-bottom: 2px solid var(--ink);
}
.topbar-row { display: flex; align-items: center; gap: 10px; padding: 14px 24px 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; margin-right: auto; }
.brand .eyebrow {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--muted);
}
.brand h1 { margin: 2px 0 0; font-size: 19px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; color: var(--ink); }

.chip {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 2px; padding: 4px 9px;
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 11px; color: var(--muted); white-space: nowrap;
}
.chip b { color: var(--ink); font-weight: 500; }
.chip.state-ruo { border-color: rgba(138, 92, 18, 0.4); color: var(--warn); background: var(--warn-wash); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.good { background: var(--good); }
.dot.warn { background: var(--warn); }
.dot.crit { background: var(--crit); }
.dot.accent { background: var(--accent); }

/* The strip under the masthead is the run itself: the five spike
   trains, compressed to a ribbon. Data as ornament, not ornament. */
.motif { height: 26px; border-top: 1px solid var(--line-soft); background: var(--surface); }
.motif svg { display: block; width: 100%; height: 100%; }

/* -- Layout ----------------------------------------------- */
.shell { display: flex; align-items: stretch; flex: 1; min-height: 0; }

.rail {
  width: var(--rail); flex: none;
  border-right: 1px solid var(--line);
  padding: 20px 0 48px;
  background: var(--bg);
}
.rail-group { padding: 0 0 22px; }
.rail-label {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--faint);
  padding: 0 22px 8px;
}
.rail-item {
  display: flex; align-items: baseline; gap: 10px; width: 100%;
  padding: 9px 22px; border: 0; background: transparent; text-align: left;
  border-left: 2px solid transparent; color: var(--muted);
  font-family: var(--serif); font-size: 14px;
  transition: background 150ms ease, color 150ms ease;
}
.rail-item:hover { background: var(--surface); color: var(--ink); }
.rail-item[aria-current="true"] {
  border-left-color: var(--accent); background: var(--surface); color: var(--ink); font-weight: 600;
}
.rail-item .n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 10px; color: var(--faint); flex: none; width: 18px; }
.rail-item[aria-current="true"] .n { color: var(--accent); }
.rail-item .sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.rail-item:disabled { opacity: 0.4; cursor: not-allowed; }
.rail-note {
  margin: 2px 22px 0; padding: 12px 0 0;
  border-top: 1px solid var(--line);
  font-size: 12.5px; line-height: 1.55; color: var(--muted);
}
.rail-note b { color: var(--body); font-weight: 600; }

.pane { flex: 1; min-width: 0; padding: 28px 32px 72px; }
@media (prefers-reduced-motion: no-preference) {
  .pane.is-in { animation: pane-in 200ms cubic-bezier(0.2, 0.7, 0.3, 1); }
  @keyframes pane-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
}

/* -- Headings + shared blocks ----------------------------- */
.pane-head { margin-bottom: 22px; }
.pane-head .kicker {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--accent-deep); margin-bottom: 8px;
  display: flex; align-items: center; gap: 12px;
}
.pane-head .kicker::after {
  content: ""; flex: 1; max-width: 180px; height: 6px;
  background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 5px);
}
.pane-head h2 { margin: 0 0 8px; font-size: 26px; font-weight: 600; line-height: 1.15; color: var(--ink); letter-spacing: -0.015em; }
.pane-head p { margin: 0; max-width: 72ch; font-size: 14.5px; color: var(--body); }

.card {
  border: 1px solid var(--line); border-radius: 2px;
  background: var(--surface); padding: 18px 20px; margin-bottom: 18px;
}
.card > h3 {
  margin: 0 0 4px; font-size: 15.5px; font-weight: 600; line-height: 1.3; color: var(--ink);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.card > .sub { margin: 0 0 14px; font-size: 13px; color: var(--muted); max-width: 78ch; }
.card.tight { padding: 13px 16px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card.hero { border-color: var(--ink); padding: 22px 24px 20px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid2 > .card { margin-bottom: 0; }
@media (max-width: 1080px) { .grid2 { grid-template-columns: 1fr; } }

.badge {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
  border-radius: 2px; padding: 2px 6px; border: 1px solid var(--line);
  color: var(--muted); background: var(--surface); white-space: nowrap;
}
.badge.rule { border-color: rgba(11, 110, 100, 0.35); color: var(--accent-deep); background: var(--accent-wash); }
.badge.model { border-color: rgba(138, 92, 18, 0.35); color: var(--warn); background: var(--warn-wash); }
.badge.good { border-color: rgba(61, 107, 47, 0.35); color: var(--good); background: var(--good-wash); }
.badge.crit { border-color: rgba(162, 51, 27, 0.35); color: var(--crit); background: var(--crit-wash); }

.note {
  border-left: 2px solid var(--line); padding: 2px 0 2px 12px;
  font-size: 12.5px; color: var(--muted); max-width: 84ch;
}
.note.warn { border-left-color: var(--warn); color: var(--warn); }
.note.good { border-left-color: var(--good); }

.btn {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 2px; padding: 6px 12px;
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 12px; color: var(--body);
  transition: border-color 150ms ease, background 150ms ease, color 150ms ease;
}
.btn:hover { border-color: var(--muted); color: var(--ink); }
.btn.primary { background: var(--accent-deep); border-color: var(--accent-deep); color: #fdfcf8; letter-spacing: 0.02em; }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #ffffff; }
.btn.sm { padding: 3px 9px; font-size: 11px; }
.btn[aria-pressed="true"] {
  border-color: var(--accent); background: var(--accent-wash); color: var(--accent-deep);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .spacer { margin-left: auto; }

/* -- Tables ----------------------------------------------- */
.tblwrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
table.data th {
  text-align: left; vertical-align: bottom; padding: 0 12px 9px 0;
  border-bottom: 1.5px solid var(--ink); color: var(--ink); font-weight: 600; font-size: 12.5px;
}
table.data th + th { text-align: right; }
table.data th .def {
  display: block; font-family: var(--mono); font-size: 9.5px; line-height: 1.5;
  color: var(--muted); font-weight: 400; margin-top: 4px; max-width: 26ch;
  white-space: normal;
}
table.data th + th .def { margin-left: auto; }
table.data td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
table.data tr.row-click:hover td { background: var(--accent-wash); cursor: pointer; }
table.data td.num {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  text-align: right; color: var(--ink); font-size: 12.5px;
}
table.data td.name { color: var(--ink); font-weight: 600; font-size: 13.5px; }
.swatch { display: inline-block; width: 9px; height: 9px; border-radius: 1px; margin-right: 8px; vertical-align: baseline; }
.planted { display: block; font-family: var(--mono); font-size: 10.5px; line-height: 1.5; color: var(--muted); font-weight: 400; }

/* -- Metric + definition pairing -------------------------- */
.mrow {
  display: grid; grid-template-columns: 132px 1fr; gap: 16px;
  padding: 12px 0; border-bottom: 1px solid var(--line-soft);
}
.mrow:last-child { border-bottom: 0; }
.mrow .val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 21px; color: var(--ink); line-height: 1.15; }
.mrow .val small { display: block; font-size: 10px; color: var(--muted); letter-spacing: 0.08em; margin-top: 3px; }
.mrow .lab { font-size: 13.5px; color: var(--ink); font-weight: 600; }
.mrow .def { font-family: var(--mono); font-size: 11px; color: var(--muted); line-height: 1.55; margin-top: 3px; }
.mrow .src { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 5px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile { border: 1px solid var(--line); border-top: 2px solid var(--ink); border-radius: 2px; background: var(--surface); padding: 13px 15px 12px; }
.tile .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 26px; color: var(--ink); line-height: 1.1; }
.tile .l { font-size: 12.5px; font-weight: 600; color: var(--body); margin-top: 6px; }
.tile .d { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; }

/* -- Run ---------------------------------------------------- */
.stage {
  display: grid; grid-template-columns: 26px 1fr auto; gap: 14px; align-items: start;
  padding: 12px 0; border-bottom: 1px solid var(--line-soft);
}
.stage:last-child { border-bottom: 0; }
.stage .idx { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--faint); padding-top: 3px; }
.stage .t { font-size: 14px; color: var(--ink); font-weight: 600; display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
.stage .d { font-size: 13px; color: var(--muted); margin-top: 2px; max-width: 78ch; }
.stage .out { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--body); margin-top: 5px; }
.stage .ms { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--faint); text-align: right; padding-top: 4px; white-space: nowrap; }
.stage.pending { opacity: 0.38; }
.stage.pending .ms::after { content: "queued"; }

.prov { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11.5px; line-height: 2; color: var(--body); }
.prov .k { display: inline-block; width: 190px; color: var(--muted); }

/* -- Figures ---------------------------------------------- */
.fig { border: 1px solid var(--line); border-radius: 2px; background: var(--surface-2); padding: 14px 16px 12px; }
.fig + .fig { margin-top: 14px; }
.fig h4 { margin: 0 0 4px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.fig .cap { font-size: 12.5px; color: var(--muted); margin: 9px 0 0; max-width: 84ch; }
.fig .src {
  font-family: var(--mono); font-size: 10px; color: var(--muted);
  margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.fig svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis { stroke: var(--faint); stroke-width: 1; }
.gridline { stroke: var(--line); stroke-width: 1; }
.tick { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 9px; fill: var(--muted); }
.axlabel { font-family: var(--mono); font-size: 9.5px; fill: var(--muted); letter-spacing: 0.08em; }
.pt-label { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 10px; fill: var(--body); }
.raw { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 10.5px; color: var(--body);
       background: var(--surface); border: 1px solid var(--line); border-radius: 2px;
       padding: 10px 12px; margin-top: 10px;
       white-space: pre-wrap; word-break: break-word; line-height: 1.7; max-height: 190px; overflow: auto; }

/* -- Report ------------------------------------------------ */
.pages { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.page-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 2px;
  padding: 6px 11px; font-family: var(--mono); font-size: 11.5px; color: var(--body);
  display: flex; gap: 8px; align-items: center;
  transition: border-color 150ms ease, background 150ms ease;
}
.page-btn .n { font-variant-numeric: tabular-nums; font-size: 10px; color: var(--faint); }
.page-btn[aria-current="true"] {
  border-color: var(--accent); background: var(--accent-wash); color: var(--accent-deep);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.sheet {
  border: 1px solid var(--line); border-radius: 2px; background: var(--surface);
  padding: 34px 40px 40px;
}
.sheet-head { border-bottom: 2px solid var(--ink); padding-bottom: 16px; margin-bottom: 24px; }
.sheet-head .t { font-size: 20px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
.sheet-head .s { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--muted); margin-top: 6px; }
.sheet h3 {
  margin: 30px 0 8px; font-size: 11px; font-weight: 500; color: var(--accent-deep);
  font-family: var(--mono); letter-spacing: 0.16em; text-transform: uppercase;
  border-top: 1px solid var(--line); padding-top: 14px;
}
.sheet h3:first-of-type { margin-top: 0; border-top: 0; padding-top: 0; }
.sheet a[id] { display: block; scroll-margin-top: 108px; }
.sheet p { font-size: 14px; color: var(--body); max-width: 80ch; }
.sheet .tier {
  border-left: 2px solid var(--accent); padding-left: 18px; margin: 16px 0 28px;
}
.sheet .tier.pop { border-left-color: var(--u5); }
.tier-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent-deep); margin-bottom: 10px;
}
.ruo { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--warn); }

.choice { display: grid; grid-template-columns: 220px 130px 1fr; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.choice:last-child { border-bottom: 0; }
.choice .c { color: var(--ink); font-weight: 600; }
.choice .v { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--accent-deep); }
.choice .w { color: var(--muted); font-size: 12.5px; }

/* -- Generated prose + grounding -------------------------- */
.gen { border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 2px; background: var(--surface-2); padding: 15px 17px; }
.gen.withheld { border-left-color: var(--crit); background: var(--crit-wash); }
.gen .h { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; flex-wrap: wrap; }
.gen .h .t { font-size: 13px; color: var(--ink); font-weight: 600; }
.gen p { margin: 0 0 9px; font-size: 14px; color: var(--body); max-width: 80ch; }
.gen p:last-child { margin-bottom: 0; }
.gen mark {
  background: var(--accent-wash); color: var(--accent-deep);
  border-bottom: 1px solid var(--accent); border-radius: 0; padding: 0 2px;
  font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px;
}
.gen mark.bad { background: var(--crit-wash); color: var(--crit); border-bottom-color: var(--crit); }
.check { display: flex; align-items: center; gap: 9px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); flex-wrap: wrap; }

/* -- Definitions screen: the collision, side by side ------- */
.defcmp {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 4px;
}
.defcol { background: var(--surface); padding: 16px 16px 15px; }
.defcol.own { box-shadow: inset 0 3px 0 var(--accent); background: #f4f7f4; }
.defcol .tag {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 10px;
}
.defcol.own .tag { color: var(--accent-deep); }
.defcol .v {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: clamp(34px, 4vw, 52px); line-height: 1; letter-spacing: -0.03em;
  color: var(--ink); margin-bottom: 12px;
}
.defcol.own .v { color: var(--accent-deep); }
.defcol .who { font-size: 13px; color: var(--ink); font-weight: 600; line-height: 1.35; }
.defcol .formula { font-family: var(--mono); font-size: 10.5px; color: var(--body); line-height: 1.6; margin-top: 5px; }
.defcol .cite { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 7px; }

/* -- Ask -------------------------------------------------- */
.asklist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.askq {
  border: 1px solid var(--line); background: var(--surface); border-radius: 2px;
  padding: 10px 13px; text-align: left; font-family: var(--serif); font-size: 13.5px; color: var(--body);
  transition: border-color 150ms ease, color 150ms ease;
}
.askq:hover { border-color: var(--muted); color: var(--ink); }
.askq[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent); }
.answer { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 2px; background: var(--surface); padding: 16px 18px; }
.answer .q { font-size: 14px; color: var(--ink); font-weight: 600; margin-bottom: 10px; }
.answer p { margin: 0 0 10px; font-size: 14px; color: var(--body); max-width: 80ch; }
.cites { font-family: var(--mono); font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.cites b { color: var(--body); font-weight: 500; }
.refusal { border-left-color: var(--crit); background: var(--crit-wash); }

/* -- Export ----------------------------------------------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tab {
  border: 0; background: transparent; padding: 7px 14px;
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  transition: color 150ms ease, box-shadow 150ms ease;

<script>
/* ============================================================
   NeuroAdapt - spike-train feature extraction, interactive demo.

   Nothing on this page is a stored number. The five spike trains
   are generated in the browser from fixed seeds, and every metric,
   figure and sentence below is computed from those spike times at
   render time. The dataset is the validation design described in
   the NeuroAdapt whitepaper: five units, ten seconds, three
   planted structures (a bursting unit, a Poisson unit, a regular
   unit, and a synchronous pair).

   The seeds were chosen so the run reproduces the whitepaper's
   headline results - 102 coincident spikes, a coincidence
   fraction of 0.85, and 87% of population variance in the first
   two components. Everything else is whatever this draw produced.
   ============================================================ */

/* ------------------------------------------------------------
   1. SIMULATION AND FEATURE COMPUTATION
   ------------------------------------------------------------ */
var T = 10; // recording duration, seconds
var BIN = 0.1; // 100 ms bins, for Fano factor and PCA
var BURST_ISI = 0.02; // burst index: ISIs below 20 ms
var COINC = 0.005; // coincidence window, +/- 5 ms
var SEEDS = { u1: 53773, u2: 12738, u3: 7, pair: 3950 };

function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function uni(r, a, b) { return a + (b - a) * r(); }

/* Unit 1 - bursting. Ten bursts of five spikes 5 ms apart, burst
   onsets drawn as a Poisson process at ~1 Hz and rescaled to fit. */
function genBursting(seed, nBursts, perBurst, intra) {
  var r = rng(seed), gaps = [], sum = 0, i;
  for (i = 0; i < nBursts - 1; i++) { var g = -Math.log(1 - r()); gaps.push(g); sum += g; }
  var span = T - 0.6 - (perBurst - 1) * intra, t = 0.15, out = [];
  for (i = 0; i < nBursts; i++) {
    for (var k = 0; k < perBurst; k++) out.push(t + k * intra);
    if (i < nBursts - 1) t += (gaps[i] / sum) * span;
  }
  return out;
}
/* Unit 2 - homogeneous Poisson process. */
function genPoisson(seed, rate) {
  var r = rng(seed), t = 0, out = [];
  for (;;) { t += -Math.log(1 - r()) / rate; if (t >= T) break; out.push(t); }
  return out;
}
/* Unit 3 - regular pacemaker with a small timing jitter. */
function genRegular(seed, rate, jitter) {
  var r = rng(seed), out = [], n = Math.round(rate * T);
  for (var i = 0; i < n; i++) {
    var t = (i + 0.5) / rate + uni(r, -jitter, jitter);
    if (t > 0 && t < T) out.push(t);
  }
  return out.sort(function (a, b) { return a - b; });
}
/* Units 4 and 5 - a synchronous pair. A shared Poisson set of
   synchronous events delivered to both units with independent
   jitter, plus a low rate of spikes belonging to one unit only. */
function genPair(seed, syncRate, jitter, indepRate) {
  var r = rng(seed), t = 0, sync = [];
  for (;;) { t += -Math.log(1 - r()) / syncRate; if (t >= T) break; sync.push(t); }
  var a = [], b = [], i;
  for (i = 0; i < sync.length; i++) {
    a.push(sync[i] + uni(r, -jitter, jitter));
    b.push(sync[i] + uni(r, -jitter, jitter));
  }
  for (var u = 0; u < 2; u++) {
    var arr = u === 0 ? a : b, tt = 0;
    for (;;) { tt += -Math.log(1 - r()) / indepRate; if (tt >= T) break; arr.push(tt); }
  }
  var srt = function (x, y) { return x - y; };
  var win = function (x) { return x >= 0 && x < T; };
  return { sync: sync, a: a.sort(srt).filter(win), b: b.sort(srt).filter(win) };
}

function isis(t) { var o = []; for (var i = 1; i < t.length; i++) o.push(t[i] - t[i - 1]); return o; }
function mean(x) { var s = 0; for (var i = 0; i < x.length; i++) s += x[i]; return x.length ? s / x.length : 0; }
function variance(x) { var m = mean(x), s = 0; for (var i = 0; i < x.length; i++) s += (x[i] - m) * (x[i] - m); return x.length ? s / x.length : 0; }
function binCounts(t) {
  var n = Math.round(T / BIN), c = new Array(n).fill(0);
  for (var i = 0; i < t.length; i++) { var k = Math.floor(t[i] / BIN); if (k >= 0 && k < n) c[k]++; }
  return c;
}
function firingRate(t) { return t.length / T; }
function cvIsi(t) { var d = isis(t); return mean(d) ? Math.sqrt(variance(d)) / mean(d) : 0; }
function burstIndex(t, thr) {
  var d = isis(t); if (!d.length) return 0;
  var n = 0; for (var i = 0; i < d.length; i++) if (d[i] < thr) n++;
  return n / d.length;
}
function fano(t) { var c = binCounts(t); return mean(c) ? variance(c) / mean(c) : 0; }

/* Coincident spikes: spikes of `a` with at least one spike of `b`
   within +/- 5 ms. Counted per spike of `a`, never per (a, b) pair,
   so the fraction below has a denominator that means something. */
function coincidences(a, b) {
  var n = 0, j = 0;
  for (var i = 0; i < a.length; i++) {
    while (j < b.length && b[j] < a[i] - COINC) j++;
    if (j < b.length && b[j] <= a[i] + COINC) n++;
  }
  return n;
}
/* Cross-correlogram: histogram of (b - a) over +/- maxLag. */
function crossCorrelogram(a, b, maxLag, bw) {
  var nb = Math.round((2 * maxLag) / bw), h = new Array(nb).fill(0);
  for (var i = 0; i < a.length; i++) {
    for (var k = 0; k < b.length; k++) {
      var d = b[k] - a[i];
      if (d < -maxLag || d >= maxLag) continue;
      h[Math.floor((d + maxLag) / bw)]++;
    }
  }
  return h;
}
function pearson(x, y) {
  var mx = mean(x), my = mean(y), sxy = 0, sx = 0, sy = 0;
  for (var i = 0; i < x.length; i++) {
    var dx = x[i] - mx, dy = y[i] - my;
    sxy += dx * dy; sx += dx * dx; sy += dy * dy;
  }
  return sx && sy ? sxy / Math.sqrt(sx * sy) : 0;
}
/* Fraction of a unit's spikes falling within 5 ms of a spike in
   any other unit, and the fraction expected from chance alone at
   the observed rates - because the first number is unreadable
   without the second. */
function synchronyFraction(train, others) {
  var sync = 0;
  for (var s = 0; s < train.length; s++) {
    var hit = false;
    for (var j = 0; j < others.length && !hit; j++) {
      for (var k = 0; k < others[j].length; k++) {
        var d = others[j][k] - train[s];
        if (d > COINC) break;
        if (d >= -COINC) { hit = true; break; }
      }
    }
    if (hit) sync++;
  }
  return train.length ? sync / train.length : 0;
}
function chanceFraction(others) {
  var p = 1;
  for (var j = 0; j < others.length; j++) p *= Math.exp((-2 * COINC * others[j].length) / T);
  return 1 - p;
}
function isiHistogram(t, edges) {
  var d = isis(t), c = new Array(edges.length - 1).fill(0);
  for (var i = 0; i < d.length; i++) {
    for (var k = 0; k < edges.length - 1; k++) {
      if (d[i] >= edges[k] && d[i] < edges[k + 1]) { c[k]++; break; }
    }
  }
  return c;
}

/* PCA on the binned population matrix, covariance basis. */
function jacobi(m) {
  var n = m.length, a = m.map(function (r) { return r.slice(); }), v = [], i, p, q, k;
  for (i = 0; i < n; i++) { v.push(new Array(n).fill(0)); v[i][i] = 1; }
  for (var sweep = 0; sweep < 100; sweep++) {
    var off = 0;
    for (p = 0; p < n; p++) for (q = p + 1; q < n; q++) off += a[p][q] * a[p][q];
    if (off < 1e-18) break;
    for (p = 0; p < n; p++) for (q = p + 1; q < n; q++) {
      if (Math.abs(a[p][q]) < 1e-18) continue;
      var theta = (a[q][q] - a[p][p]) / (2 * a[p][q]);
      var t = Math.sign(theta || 1) / (Math.abs(theta) + Math.sqrt(theta * theta + 1));
      var c = 1 / Math.sqrt(t * t + 1), s = t * c;
      for (k = 0; k < n; k++) {
        var akp = a[k][p], akq = a[k][q];
        a[k][p] = c * akp - s * akq; a[k][q] = s * akp + c * akq;
      }
      for (k = 0; k < n; k++) {
        var apk = a[p][k], aqk = a[q][k];
        a[p][k] = c * apk - s * aqk; a[q][k] = s * apk + c * aqk;
        var vkp = v[k][p], vkq = v[k][q];
        v[k][p] = c * vkp - s * vkq; v[k][q] = s * vkp + c * vkq;
      }
    }
  }
  var eig = [];
  for (i = 0; i < n; i++) eig.push({ value: a[i][i], vector: v.map(function (row) { return row[i]; }) });
  eig.sort(function (x, y) { return y.value - x.value; });
  return eig;
}
function pca(counts) {
  var u = counts.length, nb = counts[0].length, i, j, k;
  var cen = counts.map(function (c) { var m = mean(c); return c.map(function (x) { return x - m; }); });
  var cov = [];
  for (i = 0; i < u; i++) {
    cov.push([]);
    for (j = 0; j < u; j++) {
      var s = 0; for (k = 0; k < nb; k++) s += cen[i][k] * cen[j][k];
      cov[i].push(s / nb);
    }
  }
  var eig = jacobi(cov), total = 0;
  for (i = 0; i < u; i++) total += eig[i].value;
  return {
    total: total,
    explained: eig.map(function (e) { return (e.value / total) * 100; }),
    loadings: eig.map(function (e) { return e.vector; }),
  };
}

/* ------------------------------------------------------------
   2. THE FEATURE STORE

   Built once, from the spike times. Every figure and every
   sentence on the page reads from here and from nowhere else,
   which is what makes "the table and the figure cannot disagree"
   a property of the code rather than a claim in a caption.
   ------------------------------------------------------------ */
var LOG_EDGES = (function () {
  var e = [];
  for (var i = 0; i <= 24; i++) e.push(0.001 * Math.pow(10, (i * 3.4) / 24));
  return e;
})();

function buildFeatures() {
  var t1 = genBursting(SEEDS.u1, 10, 5, 0.005);
  var t2 = genPoisson(SEEDS.u2, 4.5);
  var t3 = genRegular(SEEDS.u3, 20, 0.003);
  var p = genPair(SEEDS.pair, 10.3, 0.003, 2);
  var trains = [t1, t2, t3, p.a, p.b];
  var planted = [
    'Bursting - 10 bursts of 5 spikes, 5 ms apart',
    'Poisson - homogeneous, 4.5 Hz',
    'Regular - 20 Hz pacemaker, 3 ms jitter',
    'Synchronous pair with unit 5',
    'Synchronous pair with unit 4',
  ];
  var colors = ['--u1', '--u2', '--u3', '--u4', '--u5'];

  var units = trains.map(function (t, i) {
    return {
      id: 'u' + (i + 1),
      label: 'Unit ' + (i + 1),
      color: colors[i],
      planted: planted[i],
      n_spikes: t.length,
      n_isi: t.length - 1,
      firing_rate_hz: firingRate(t),
      isi_cv: cvIsi(t),
      burst_index: burstIndex(t, BURST_ISI),
      fano_factor: fano(t),
      isi_hist: isiHistogram(t, LOG_EDGES),
      bin_counts: binCounts(t),
      times: t,
    };
  });

  var pairs = [], i, j;
  for (i = 0; i < 5; i++) for (j = i + 1; j < 5; j++) {
    pairs.push({
      id: (i + 1) + '-' + (j + 1),
      a: i, b: j,
      coincident_spikes: coincidences(trains[i], trains[j]),
      coincidence_fraction: coincidences(trains[i], trains[j]) / trains[i].length,
      binned_pearson: pearson(units[i].bin_counts, units[j].bin_counts),
      ccg: crossCorrelogram(trains[i], trains[j], 0.05, 0.001),
    });
  }
  var corr = [];
  for (i = 0; i < 5; i++) {
    corr.push([]);
    for (j = 0; j < 5; j++) corr[i].push(i === j ? 1 : pearson(units[i].bin_counts, units[j].bin_counts));
  }
  var sync = units.map(function (u, i) {
    var others = trains.filter(function (_, k) { return k !== i; });
    return { observed: synchronyFraction(trains[i], others), chance: chanceFraction(others) };
  });
  var pcaOut = pca(units.map(function (u) { return u.bin_counts; }));

  return {
    dataset: {
      id: 'SIM-2026-0212',
      units: 5,
      duration_s: T,
      total_spikes: trains.reduce(function (a, t) { return a + t.length; }, 0),
      injected_sync_events: p.sync.length,
      source: 'simulated - three planted structures, ground truth known',
    },
    preprocessing: [
      { c: 'Analysis window', v: '0.000 - 10.000 s', w: 'The whole recording. A window that excludes part of it changes every rate on the page.' },
      { c: 'Unit inclusion', v: 'all 5, none excluded', w: 'Refractory violations below 0.5% and at least 20 spikes. Both thresholds are stated because both move the population result.' },
      { c: 'Bin width', v: '100 ms', w: 'Sets the Fano factor and the PCA basis. A different bin width is a different number under the same name.' },
      { c: 'Burst ISI threshold', v: '20 ms', w: 'The burst index means nothing without it. Four published definitions use four thresholds.' },
      { c: 'Coincidence window', v: '+/- 5 ms', w: 'Sets what counts as synchronous, and therefore the coincidence fraction.' },
      { c: 'Correlogram', v: '+/- 50 ms, 1 ms bins', w: 'Lag range and bin width both change the visible peak height.' },
      { c: 'PCA basis', v: 'covariance, not correlation', w: 'On a correlation basis the 20 Hz unit would carry the same weight as the bursting one.' },
      { c: 'Smoothing', v: 'none', w: 'No kernel is applied anywhere. Smoothed and unsmoothed correlograms are not comparable.' },
      { c: 'Unit merging', v: 'none', w: 'Sorted units are taken as given. NeuroAdapt does not re-sort and does not repair sorting error.' },
    ],
    units: units,
    population: {
      pairs: pairs,
      corr: corr,
      synchrony: sync,
      pca: { explained: pcaOut.explained, loadings: pcaOut.loadings },
    },
  };
}

var F = buildFeatures();

/* ------------------------------------------------------------
   3. THE DEFINITION REGISTRY

   A metric cannot reach the page without an entry here. `metric()`
   is the only renderer for a value, it looks the definition up by
   id, and anything it cannot find is drawn as a defect rather
   than as a number. The guardrail tile on the run screen counts
   what fell through, which is why that count is structural.
   ------------------------------------------------------------ */
var DEFS = {
  firing_rate_hz: {
    label: 'Firing rate', unit: 'Hz', tier: 'unit',
    def: 'spike count / recording duration (10.000 s)',
    field: 'units[i].firing_rate_hz',
  },
  isi_cv: {
    label: 'ISI coefficient of variation', unit: '', tier: 'unit',
    def: 'sd(ISI) / mean(ISI), over all n-1 intervals, unbinned',
    field: 'units[i].isi_cv',
  },
  burst_index: {
    label: 'Burst index', unit: '', tier: 'unit',
    def: 'fraction of ISIs shorter than 20 ms',
    field: 'units[i].burst_index',
  },
  fano_factor: {
    label: 'Fano factor', unit: '', tier: 'unit',
    def: 'var(N) / mean(N), N = spike count in 100 ms bins',
    field: 'units[i].fano_factor',
  },
  n_spikes: {
    label: 'Spikes', unit: '', tier: 'unit',
    def: 'count of spike times in the analysis window',
    field: 'units[i].n_spikes',
  },
  coincident_spikes: {
    label: 'Coincident spikes', unit: '', tier: 'population',
    def: 'spikes of unit A with at least one spike of unit B within +/- 5 ms',
    field: 'population.pairs[k].coincident_spikes',
  },
  coincidence_fraction: {
    label: 'Coincidence fraction', unit: '', tier: 'population',
    def: 'coincident spikes / spikes of unit A',
    field: 'population.pairs[k].coincidence_fraction',
  },
  binned_pearson: {
    label: 'Binned correlation', unit: 'r', tier: 'population',
    def: 'Pearson r of spike counts in 100 ms bins',
    field: 'population.pairs[k].binned_pearson',
  },
  synchrony_observed: {
    label: 'Synchronous spike fraction', unit: '', tier: 'population',
    def: 'spikes within +/- 5 ms of any other unit / spikes of this unit',
    field: 'population.synchrony[i].observed',
  },
  synchrony_chance: {
    label: 'Same fraction expected by chance', unit: '', tier: 'population',
    def: '1 - product over other units of exp(-2 x 5 ms x rate)',
    field: 'population.synchrony[i].chance',
  },
  pc_explained: {
    label: 'Variance explained', unit: '%', tier: 'population',
    def: 'eigenvalue / trace of the 5 x 5 covariance of 100 ms binned counts',
    field: 'population.pca.explained[k]',
  },
  pc_loading: {
    label: 'Component loading', unit: '', tier: 'population',
    def: 'weight of this unit in the component eigenvector',
    field: 'population.pca.loadings[k][i]',
  },

/* Ids that reached the page, and the ones that did so without a
   definition. The second list is the guardrail. */
var EMITTED = {}, UNDEFINED_EMITS = [];
function defOf(id) {
  EMITTED[id] = true;
  if (!DEFS[id]) { if (UNDEFINED_EMITS.indexOf(id) < 0) UNDEFINED_EMITS.push(id); return null; }
  return DEFS[id];
}

/* ------------------------------------------------------------
   4. FORMATTING AND SMALL HELPERS
   ------------------------------------------------------------ */
function fmt(v, d) { return Number(v).toFixed(d === undefined ? 2 : d); }
function pct(v, d) { return fmt(v, d === undefined ? 1 : d) + '%'; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function $(id) { return document.getElementById(id); }
function cvar(name) { return 'var(' + name + ')'; }

/* FNV-1a over the resolved parameter set and over the computed
   feature values. Two runs that agree on both are the same run. */
function hash(str) {
  var h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return ('00000000' + (h >>> 0).toString(16)).slice(-8);

var PARAM_HASH = hash(JSON.stringify({
  seeds: SEEDS, T: T, bin: BIN, burst_isi: BURST_ISI, coinc: COINC,
  ccg: [0.05, 0.001], pca: 'covariance', smoothing: 'none',

function featureHash(f) {
  return hash(JSON.stringify([
    f.units.map(function (u) { return [u.n_spikes, u.firing_rate_hz, u.isi_cv, u.burst_index, u.fano_factor]; }),
    f.population.pairs.map(function (p) { return [p.coincident_spikes, p.binned_pearson]; }),
    f.population.pca.explained,

var FEATURE_HASH = featureHash(F);

/* A single metric, with its definition attached. There is no

function metric(id, value, digits, extra) {
  var d = defOf(id);

    return '<div class="mrow"><div class="val" style="color:var(--crit)">' + esc(String(value)) +
      '</div><div><div class="lab" style="color:var(--crit)">' + esc(id) +
      '</div><div class="def">No definition registered. This value is a defect, not a result.</div></div></div>';
  }
  return '<div class="mrow"><div class="val">' + esc(fmt(value, digits)) +
    (d.unit ? '<small>' + esc(d.unit) + '</small>' : '') +
    '</div><div><div class="lab">' + esc(d.label) + (extra ? ' <span class="badge">' + esc(extra) + '</span>' : '') +

/* ------------------------------------------------------------
   6. GENERATED PROSE AND THE GROUNDING CHECK

   The model step writes the interpretation. Before it is shown,
   every number in the text is extracted and matched against a
   value in the feature store. One unmatched number withholds the
   whole paragraph and the deterministic summary runs instead.
   ------------------------------------------------------------ */
function flatValues() {
  var out = [];
  /* [value, field path, dimension]. The dimension is what stops
     "20 ms" from matching a 20 Hz firing rate, which is exactly
     the kind of pass a value-only check hands out for free. */
  F.units.forEach(function (u, i) {
    out.push([i + 1, 'units[' + i + '].unit_id', 'unit-id']);
    out.push([u.n_spikes, 'units[' + i + '].n_spikes', 'count']);
    out.push([u.firing_rate_hz, 'units[' + i + '].firing_rate_hz', 'Hz']);
    out.push([u.isi_cv, 'units[' + i + '].isi_cv', '']);
    out.push([u.burst_index, 'units[' + i + '].burst_index', '']);
    out.push([u.fano_factor, 'units[' + i + '].fano_factor', '']);
  });
  F.population.pairs.forEach(function (p, k) {
    out.push([p.coincident_spikes, 'population.pairs[' + k + '].coincident_spikes', 'count']);
    out.push([p.coincidence_fraction, 'population.pairs[' + k + '].coincidence_fraction', '']);
    out.push([p.binned_pearson, 'population.pairs[' + k + '].binned_pearson', '']);
  });
  F.population.pca.explained.forEach(function (v, k) {
    out.push([v, 'population.pca.explained[' + k + ']', '%']);
  });
  F.population.pca.loadings[0].forEach(function (v, i) { out.push([v, 'population.pca.loadings[0][' + i + ']', '']); });
  F.population.pca.loadings[1].forEach(function (v, i) { out.push([v, 'population.pca.loadings[1][' + i + ']', '']); });
  F.population.synchrony.forEach(function (s, i) {
    out.push([s.observed, 'population.synchrony[' + i + '].observed', '']);
    out.push([s.chance, 'population.synchrony[' + i + '].chance', '']);
  });
  out.push([F.dataset.units, 'dataset.units', 'count']);
  out.push([F.dataset.duration_s, 'dataset.duration_s', 's']);
  out.push([F.dataset.total_spikes, 'dataset.total_spikes', 'count']);
  out.push([F.dataset.injected_sync_events, 'dataset.injected_sync_events', 'count']);
  out.push([F.population.pca.explained[0] + F.population.pca.explained[1], 'population.pca.explained[0] + [1]', '%']);
  /* The thresholds are features of the run too, and a sentence
     that quotes one is quoting the feature store. */
  out.push([BURST_ISI * 1000, 'preprocessing.burst_isi_threshold_ms', 'ms']);
  out.push([COINC * 1000, 'preprocessing.coincidence_window_ms', 'ms']);
  out.push([BIN * 1000, 'preprocessing.bin_width_ms', 'ms']);
  out.push([50, 'preprocessing.correlogram_max_lag_ms', 'ms']);
  out.push([80, 'preprocessing.pca_variance_bar_pct', '%']);
  return out;
}
var FLAT = flatValues();

/* The dimension a number is written in, read off the words around
   it. A bare number is dimensionless or a count; "unit 4" is a
   reference to a unit id, not a quantity. */
function dimensionOf(text, index, token) {
  if (token.indexOf('%') >= 0) return '%';
  var after = text.slice(index + token.length, index + token.length + 14);
  var before = text.slice(Math.max(0, index - 18), index).toLowerCase();
  if (/^\s*ms\b/.test(after)) return 'ms';
  if (/^\s*hz\b/i.test(after)) return 'Hz';
  if (/^\s*(spikes|intervals|units|events|components)\b/.test(after)) return 'count';
  if (/^\s*s\b/.test(after)) return 's';
  if (/\bunits?\s+(\d+(\.\d+)?\s+and\s+)?$/.test(before)) return 'unit-id';
  return '';
}
/* Match a printed number to a stored value of the same dimension,
   at the precision it was printed, closest first. A dimensionless
   token also matches a count, and a percentage matches either a
   stored percentage or a stored fraction times 100. */
function matchValue(tok, dim) {
  var raw = tok.replace(/[%,]/g, ''), v = parseFloat(raw);
  if (isNaN(v)) return null;
  var decimals = (raw.split('.')[1] || '').length;
  var tol = decimals ? Math.pow(10, -decimals) / 2 + 1e-9 : 0.5;
  var best = null, bestD = Infinity;
  for (var i = 0; i < FLAT.length; i++) {
    var s = FLAT[i][0], path = FLAT[i][1], sd = FLAT[i][2];
    var ok = sd === dim || (dim === '' && sd === 'count') || (dim === 'count' && sd === '');
    if (ok) {
      var d = Math.abs(s - v);
      if (d <= tol && d < bestD) { best = path; bestD = d; }
    }
    if (dim === '%' && sd === '') {
      var d2 = Math.abs(s * 100 - v);
      if (d2 <= tol && d2 < bestD) { best = path + ' x 100'; bestD = d2; }
    }
  }
  return best;
}
function groundingCheck(text) {
  var out = '', re = /\d+(?:\.\d+)?%?/g, last = 0, m, checked = [];
  while ((m = re.exec(text)) !== null) {
    var field = matchValue(m[0], dimensionOf(text, m.index, m[0]));
    checked.push({ token: m[0], field: field });
    out += esc(text.slice(last, m.index));
    out += '<mark class="' + (field ? '' : 'bad') + '" title="' + esc(field || 'no matching field in the feature store') + '">' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  out += esc(text.slice(last));
  var bad = checked.filter(function (c) { return !c.field; });
  return { html: out, checked: checked, failed: bad, passed: bad.length === 0 };
}

function interpretation(injectUngrounded) {
  var p = pairOf('4-5'), e = F.population.pca.explained, l2 = F.population.pca.loadings[1];
  var u1 = F.units[0], u2 = F.units[1];
  var t = 'Unit 1 fires in bursts: its ISI coefficient of variation is ' + fmt(u1.isi_cv, 2) +
    ' against ' + fmt(u2.isi_cv, 2) + ' for the Poisson unit, and ' + pct(u1.burst_index * 100, 0) +
    ' of its intervals fall below the 20 ms threshold. Units 4 and 5 fire together: ' +
    p.coincident_spikes + ' of unit 4’s ' + F.units[4 - 1].n_spikes +
    ' spikes have a unit 5 spike within 5 ms, a coincidence fraction of ' + fmt(p.coincidence_fraction, 2) +
    '. The population is low-dimensional. The first two components carry ' + fmt(e[0], 1) + '% and ' +
    fmt(e[1], 1) + '% of the variance, and unit 4 and unit 5 carry the largest weights in the second component, ' +
    fmt(l2[3], 2) + ' and ' + fmt(l2[4], 2) + '.';
  if (injectUngrounded) t += ' This is consistent with the 23% increase in burst rate reported for this preparation.';
  return t;
}
function templateSummary() {
  var p = pairOf('4-5'), e = F.population.pca.explained;
  return '5 units, ' + F.dataset.total_spikes + ' spikes, ' + fmt(F.dataset.duration_s, 3) +
    ' s. Highest ISI CV: unit 1 at ' + fmt(F.units[0].isi_cv, 2) + '. Highest coincidence fraction: units 4-5 at ' +
    fmt(p.coincidence_fraction, 2) + ' (' + p.coincident_spikes + ' spikes). PC1 ' + fmt(e[0], 1) + '%, PC2 ' + fmt(e[1], 1) + '%.';
}
function pairOf(id) {
  return F.population.pairs.filter(function (p) { return p.id === id; })[0];
}

/* ------------------------------------------------------------
   7. COMPETING DEFINITIONS

   The audit in the case study found four definitions of burst
   index and three of synchrony in published use. Here they are,
   applied to the same spike times, so the disagreement is a
   number on the screen rather than an assertion.
   ------------------------------------------------------------ */
function burstDefinitions(idx) {
  var t = F.units[idx].times, d = isis(t), n = d.length, i;
  var short20 = 0, short10 = 0;
  for (i = 0; i < n; i++) { if (d[i] < 0.02) short20++; if (d[i] < 0.01) short10++; }
  var inBurst = 0, run = 1;
  for (i = 0; i < n; i++) {
    if (d[i] < 0.02) run++;
    else { if (run >= 3) inBurst += run; run = 1; }
  }
  if (run >= 3) inBurst += run;
  var rate = t.length / T, expected = n * (1 - Math.exp(-rate * 0.02));
  return [
    { who: 'Fraction of ISIs below 20 ms', formula: 'count(ISI < 20 ms) / (n - 1)', v: short20 / n, digits: 2, own: true,
      cite: 'The definition NeuroAdapt ships, and the one written into every output it produces.' },
    { who: 'Fraction of ISIs below 10 ms', formula: 'count(ISI < 10 ms) / (n - 1)', v: short10 / n, digits: 2,
      cite: 'Same construction, a different threshold. Nothing in the metric name carries the threshold.' },
    { who: 'Share of spikes inside a burst', formula: 'spikes in runs of 3+ with ISI < 20 ms / n', v: inBurst / t.length, digits: 2,
      cite: 'Counts spikes rather than intervals, so it answers a different question under the same name.' },
    { who: 'Observed / Poisson-expected short ISIs', formula: 'count(ISI < 20 ms) / (n - 1)(1 - e^-rate x 20 ms)', v: short20 / expected, digits: 1,
      cite: 'A ratio, not a fraction. It is not bounded by 1 and cannot be compared with the three above.' },
  ];
}
function syncDefinitions(pairId) {
  var p = pairOf(pairId), a = F.units[p.a], b = F.units[p.b];
  var mid = Math.floor(p.ccg.length / 2);
  var peak = 0, k;
  for (k = mid - 5; k <= mid + 5; k++) peak += p.ccg[k];
  var chance = (a.n_spikes * b.n_spikes * (2 * COINC)) / T;
  return [
    { who: 'Coincidence fraction, +/- 5 ms', formula: 'spikes of A within 5 ms of B / spikes of A', v: p.coincidence_fraction, digits: 2, own: true,
      cite: 'The definition NeuroAdapt ships. Bounded by 1, and asymmetric - A to B is not B to A.' },
    { who: 'Pearson r of 100 ms binned counts', formula: 'corr(bin(A), bin(B))', v: p.binned_pearson, digits: 2,
      cite: 'Also bounded by 1, also called synchrony, and it measures co-activity at 100 ms rather than coincidence at 5 ms.' },
    { who: 'Correlogram peak over chance', formula: 'peak count in +/- 5 ms / expected under independence', v: peak / chance, digits: 1,
      cite: 'An enrichment ratio. A paper reporting "synchrony = ' + fmt(peak / chance, 1) + '" and one reporting "synchrony = ' + fmt(p.coincidence_fraction, 2) + '" may have measured the same two neurons.' },
  ];
}

  if (opts) for (var k in opts) state[k] = opts[k];
  if (view !== 'run') state.ran = true;
  render();
  window.scrollTo({ top: 0, behavior: MOTION_OK ? 'smooth' : 'auto' });
}

/* ------------------------------------------------------------
   9. THE STAGES

   Each stage names what it produced. The two model stages are
   badged, and neither of them writes into the feature store -
   which is the whole reason the badge is worth printing.
   ------------------------------------------------------------ */
function stages() {
  var p = pairOf('4-5'), e = F.population.pca.explained;
  return [
    { t: 'Ingest sorted units', k: 'rule', ms: 41,
      d: 'Reads an NWB units table. Spike times are taken as sorted; NeuroAdapt does not re-sort and does not repair sorting error.',
      out: F.dataset.units + ' units, ' + F.dataset.total_spikes + ' spikes, ' + fmt(F.dataset.duration_s, 3) + ' s' },
    { t: 'Unit inclusion check', k: 'rule', ms: 12,
      d: 'Refractory violations below 0.5% and at least 20 spikes. Both thresholds are recorded whether or not they exclude anything.',
      out: '0 units excluded, 5 carried forward' },
    { t: 'Resolve the pipeline profile', k: 'rule', ms: 7,
      d: 'Binds every threshold the run will use - bin width, burst ISI, coincidence window, correlogram lag - and hashes the resolved set.',
      out: 'profile spike-v0.1, parameter hash ' + PARAM_HASH },
    { t: 'Unit-level features', k: 'rule', ms: 63,
      d: 'Firing rate, ISI coefficient of variation, burst index and Fano factor, per unit, each written with its definition.',
      out: '4 metrics x 5 units = 20 values, 20 definitions' },
    { t: 'Population-level features', k: 'rule', ms: 214,
      d: 'All 10 unit pairs: coincident spikes, binned correlation, and a cross-correlogram over +/- 50 ms in 1 ms bins.',
      out: '10 pairs, peak coincidence ' + p.coincident_spikes + ' spikes at units 4-5' },
    { t: 'Principal component analysis', k: 'rule', ms: 38,
      d: 'Covariance of the 100 x 5 binned count matrix. Covariance rather than correlation, so a high-rate unit is not rescaled to look like a driver.',
      out: 'PC1 ' + fmt(e[0], 1) + '%, PC2 ' + fmt(e[1], 1) + '%, PC1+PC2 ' + fmt(e[0] + e[1], 1) + '%' },
    { t: 'Figures from the feature store', k: 'rule', ms: 96,
      d: 'Every figure is drawn from a stored feature array. No figure reads the spike times except the raster, which is labelled as raw input.',
      out: '5 figures, 5 source fields' },
    { t: 'Interpret the figures', k: 'model', ms: 2140,
      d: 'gpt-4o-mini receives the feature values and writes the interpretation paragraph. It receives no spike times and computes nothing.',
      out: 'draft interpretation, ' + interpretation(false).length + ' characters' },
    { t: 'Index the report for retrieval', k: 'model', ms: 780,
      d: 'text-embedding-3-large over the report sections, stored in Weaviate. Retrieval sits on top of the feature set and could be removed without touching it.',
      out: '6 sections embedded, 3072 dimensions' },
  ];
}

function head(kicker, title, sub) {
  return '<div class="pane-head"><div class="kicker">' + esc(kicker) + '</div><h2>' + esc(title) + '</h2><p>' + sub + '</p></div>';
}

function viewRun() {
  var st = stages(), h = '';
  h += head('Stage 01', 'The run', 'Nine stages over one recording. Two of them are the model, and neither writes a number into the feature store &mdash; the interpretation is generated after every value already exists.');

  h += '<div class="tiles">' +
    tile(String(st.length), 'Stages in the run', 'seven rule-based, two model') +
    tile('2', 'Stages that are the model', 'interpretation and indexing') +
    tile('0', 'Numbers computed by a model', 'every value comes from a rule-based stage') +
    tile(String(UNDEFINED_EMITS.length), 'Metrics printed without a definition', 'guardrail &mdash; counted at render time, not asserted') +
    '</div>';

  h += '<div class="card"><h3>Pipeline</h3>' +
    '<p class="sub">Timings are from a simulated run. The badge on each stage is the thing worth reading: the split between counting and writing prose is the design.</p>';
  st.forEach(function (s, i) {
    var pending = !state.ran && i > 0;
    h += '<div class="stage' + (pending ? ' pending' : '') + '">' +
      '<div class="idx">' + String(i + 1).padStart(2, '0') + '</div>' +
      '<div><div class="t">' + esc(s.t) + ' <span class="badge ' + s.k + '">' + s.k + '</span></div>' +

      '<div class="ms">' + (pending ? '' : s.ms + ' ms') + '</div></div>';
  });
  h += '</div>';

  if (!state.ran) {
    h += '<div class="card tight"><button class="btn primary" id="doRun">Run the pipeline</button>' +
      '<span class="note" style="margin-left:14px">Generates the five spike trains from the fixed seeds and computes every feature on this page in the browser.</span></div>';
  } else {
    h += '<div class="card"><h3>Provenance</h3>' +
      '<p class="sub">Enough to reproduce the run, and no more. A result without this block is a defect rather than a result.</p>' +
      '<div class="prov">' +
      row('Dataset', F.dataset.id + ' &middot; ' + esc(F.dataset.source)) +
      row('Pipeline profile', 'spike-v0.1') +
      row('Parameter hash', PARAM_HASH) +
      row('Feature hash', FEATURE_HASH) +
      row('Seeds', 'u1 ' + SEEDS.u1 + ' &middot; u2 ' + SEEDS.u2 + ' &middot; u3 ' + SEEDS.u3 + ' &middot; pair ' + SEEDS.pair) +
      row('Bin width', '100 ms') +
      row('Burst ISI threshold', '20 ms') +
      row('Coincidence window', '+/- 5 ms') +
      row('Correlogram', '+/- 50 ms, 1 ms bins') +
      row('PCA basis', 'covariance of 100 x 5 binned counts') +
      row('Interpretation model', 'gpt-4o-mini, temperature 0') +
      row('Retrieval', 'text-embedding-3-large, Weaviate') +
      '</div>' +
      '<div style="margin-top:14px"><button class="btn" id="doDet">Re-run and compare hashes</button>' +
      (state.determinism ? ' <span class="badge ' + (state.determinism.same ? 'good' : 'crit') + '">' +
        (state.determinism.same ? 'identical: ' + state.determinism.h : 'diverged') + '</span>' : '') +
      '<div class="note" style="margin-top:10px">Re-running the same input under the same profile must produce the same feature hash. A mismatch is a release-blocking defect, not a rounding curiosity.</div></div></div>';

function viewDefinitions() {
  var isBurst = state.metric === 'burst';
  var rows = isBurst ? burstDefinitions(state.unit === null ? 0 : state.unit) : syncDefinitions(state.pair);
  var vals = rows.map(function (r) { return fmt(r.v, r.digits); });
  var distinct = vals.filter(function (v, i) { return vals.indexOf(v) === i; }).length;
  var h = head('Why the module exists', 'One name, ' + distinct + ' number' + (distinct === 1 ? '' : 's'),
    'The same spike times, under the definitions the audit found in published use. Nothing here is a disagreement about data. It is a disagreement about what the word means, and it is why NeuroAdapt writes the definition into the output beside the value.');

  h += '<div class="toolbar">' +
    '<button class="btn sm" data-metric="burst" aria-pressed="' + isBurst + '">Burst index</button>' +
    '<button class="btn sm" data-metric="sync" aria-pressed="' + !isBurst + '">Synchrony</button>' +
    '<span class="spacer"></span>';
  if (isBurst) {
    F.units.forEach(function (u, i) {
      h += '<button class="btn sm" data-unit="' + (i + 1) + '" aria-pressed="' + ((state.unit === null ? 0 : state.unit) === i) + '">' + esc(u.label) + '</button>';
    });
  } else {
    ['4-5', '2-3', '1-2'].forEach(function (id) {
      h += '<button class="btn sm" data-pair="' + id + '" aria-pressed="' + (state.pair === id) + '">Units ' + id.replace('-', '&ndash;') + '</button>';
    });
  }
  h += '</div>';

  var subject = isBurst ? (F.units[state.unit === null ? 0 : state.unit].label + ', ' +
    F.units[state.unit === null ? 0 : state.unit].n_spikes + ' spikes') : ('units ' + state.pair.replace('-', ' and '));
  h += '<div class="card hero"><h3>' + (isBurst ? 'Burst index' : 'Synchrony') + ' of ' + esc(subject) +
    ' <span class="badge crit">' + rows.length + ' definitions, ' + distinct + ' answer' + (distinct === 1 ? '' : 's') + '</span></h3>' +
    '<p class="sub">Identical input. Identical code path up to the definition. The numbers below are computed here, now, from the same array of spike times.</p><div class="defcmp">';
  rows.forEach(function (r) {
    h += '<div class="defcol' + (r.own ? ' own' : '') + '">' +
      '<div class="tag">' + (r.own ? 'NeuroAdapt ships this' : 'published use') + '</div>' +
      '<div class="v">' + fmt(r.v, r.digits) + '</div>' +
      '<div class="who">' + esc(r.who) + '</div>' +
      '<div class="formula">' + esc(r.formula) + '</div>' +
      '<div class="cite">' + esc(r.cite) + '</div></div>';
  });
  h += '</div><div class="note warn" style="margin-top:14px">Reported as a bare number under one name, these read as ' + vals.join(', ') +
    '. A reader comparing two papers has no way to tell whether the difference is the preparation or the threshold.';
  /* Where two definitions happen to agree on this subject they
     will not agree on the next one, and saying so is the point. */
  if (distinct < rows.length && isBurst) {
    var other = 1, alt = burstDefinitions(other).map(function (r) { return fmt(r.v, r.digits); });
    h += ' Two of the four agree here, because every interval inside a burst of ' + esc(F.units[state.unit === null ? 0 : state.unit].label) +
      ' is 5 ms and both thresholds catch all of them. On ' + esc(F.units[other].label) + ' the same four give ' + alt.join(', ') + '.';
  }
  h += '</div></div>';

  h += '<div class="card"><h3>What NeuroAdapt does about it</h3>' +
    '<p class="sub" style="max-width:84ch">It picks one, records which, and puts the definition in the same row as the value in every output &mdash; the NWB file, the CSV, the JSON and the report. That will annoy anyone using a different definition. It is also the only thing that makes two results comparable, and a better fifth definition would not have helped.</p>' +
    '<div class="prov">' +
    row('Chosen definition', isBurst ? 'fraction of ISIs below 20 ms' : 'coincident spikes within +/- 5 ms, over the spikes of unit A') +
    row('Written into', 'NWB units table column description, CSV header block, JSON field, report page 2') +
    row('Changing it requires', 'a new pipeline profile version, not an argument in a lab meeting') +
    '</div></div>';
  return h;
}
