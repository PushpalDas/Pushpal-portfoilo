      h += '<tr><td class="k">' + b.n + '</td><td class="num">' + (1 << b.n) + '</td>' +
        '<td class="num">' + (di >= 0 ? DEPLOYED.y[di] + ' ms' : '—') + '</td>' +
        '<td class="num">' + fmt(b.ms, 1) + ' ms</td>' +
        '<td class="num">' + (growth ? '×' + fmt(growth, 2) + '/qubit' : '—') + '</td>' +
        '<td>' + (b.ms <= BUDGET ? '<span class="badge good">inside</span>' : '<span class="badge crit">over</span>') + '</td></tr>';
    });
    h += '</tbody></table>';

    var crossed = null;
    for (var i2 = 0; i2 < state.bench.length; i2++) {
      if (state.bench[i2].ms > BUDGET) { crossed = state.bench[i2].n; break; }
    }
    var atTen = null;
    state.bench.forEach(function (b) { if (b.n === 10) atTen = b.ms; });
    h += '<p class="note ' + (crossed && crossed <= 10 ? 'warn' : '') + '" style="margin-top:13px">' +
      (crossed
        ? 'In this browser the budget is first crossed at <b>' + crossed + ' qubits</b>. On the deployed engine it was crossed at ten, at 244 ms.'
        : 'This browser stayed inside the budget across every point measured, which the deployed engine did not.') +
      (atTen !== null
        ? ' At the ceiling itself this browser took <b>' + fmt(atTen, 0) + ' ms</b> against the deployed engine’s 244 ms — a factor of ' +
          fmt(atTen / 244, 1) + '.'
        : '') +
      '</p>';
    h += '<p class="note">The two curves are not meant to match. This is JavaScript in a browser tab and that was Python and NumPy on a server, ' +
      'and the gap between them is the decision recorded in section 03: the numerics were put on the server precisely because linear algebra ' +
      'in the render loop makes both the maths and the rendering slow. What transfers is the shape — cost roughly doubling with each added qubit — ' +
      'and the conclusion that follows from it, which is that the ceiling had to be set somewhere near ten and could not be left to the user.</p>';
    h += '</div>';
  } else {
    h += '<p class="note">Nothing measured yet. The run takes a few seconds, and most of it is the last point.</p>';
  }

  h += '<div class="card"><h3>What the measurement settled, and what it did not</h3>' +
    '<p class="sub">Section 05 of the case study, checkable against the table above.</p>' +
    '<table class="t"><thead><tr><th>Claim</th><th>Standing</th></tr></thead><tbody>' +
    '<tr><td>The cap was chosen before the curve was measured.</td><td>Ten was a guess. It landed just past the budget line rather than inside it.</td></tr>' +
    '<tr><td>Eleven qubits would have broken the premise.</td><td>610 ms on the deployed engine, three times the budget. The engine refuses eleven, so this demo cannot re-measure it.</td></tr>' +
    '<tr><td>By the letter of the budget, ten fails it.</td><td>Correct. The honest cap was nine at 121 ms. Ten was kept because the overshoot was imperceptible in use — a revision made silently at the time, and stated out loud here.</td></tr>' +
    '</tbody></table></div>';
  return h;
}

/* ------------------------------------------------------------
   12. THE PHYSICS TESTS

   The guardrail from section 05: a faster renderer computing the
   wrong state would have been worse than a slow one, so the suite
   ran on every change to the engine. All thirty-two are here —
   twenty-two against the engine, ten against the API boundary —
   ported assertion for assertion from backend/tests.
   ------------------------------------------------------------ */
function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
function assertRaises(fn, match) {
  try { fn(); } catch (e) {
    if (match && String(e.message).indexOf(match) === -1) throw new Error('raised, but not matching "' + match + '": ' + e.message);
    return;
  }
  throw new Error('expected a ValueError, none raised');
}
function eqProbs(probs, expected) {
  var pk = Object.keys(probs).sort(), ek = Object.keys(expected).sort();
  assert(pk.join(',') === ek.join(','), 'basis states ' + JSON.stringify(probs) + ' != ' + JSON.stringify(expected));
  for (var i = 0; i < pk.length; i++) assert(Math.abs(probs[pk[i]] - expected[pk[i]]) < 1e-9, 'probability ' + pk[i]);
}
function near(a, b) { return Math.abs(a - b) < 1e-6; }

var TESTS = [
  ['TestSingleQubitGates', 'test_x_gate_flips_zero_to_one', function () {
    var s = new Simulator(1); s.applyGate('X', 0); eqProbs(s.getProbabilities(), { '1': 1 });
  }],
  ['TestSingleQubitGates', 'test_x_gate_flips_one_to_zero', function () {
    var s = new Simulator(1); s.applyGate('X', 0); s.applyGate('X', 0); eqProbs(s.getProbabilities(), { '0': 1 });
  }],
  ['TestSingleQubitGates', 'test_hadamard_creates_superposition', function () {
    var s = new Simulator(1); s.applyGate('H', 0); var p = s.getProbabilities();
    assert(near(p['0'] || 0, 0.5) && near(p['1'] || 0, 0.5), 'not an even superposition');
  }],
  ['TestSingleQubitGates', 'test_z_gate_phase_flip', function () {
    var s = new Simulator(1); s.applyGate('H', 0); s.applyGate('Z', 0); s.applyGate('H', 0);
    eqProbs(s.getProbabilities(), { '1': 1 }); /* H·Z·H = X */
  }],
  ['TestSingleQubitGates', 'test_y_gate', function () {
    var s = new Simulator(1); s.applyGate('Y', 0); eqProbs(s.getProbabilities(), { '1': 1 });
  }],
  ['TestSingleQubitGates', 'test_s_gate', function () {
    var s = new Simulator(1); s.applyGate('S', 0); eqProbs(s.getProbabilities(), { '0': 1 });
  }],
  ['TestSingleQubitGates', 'test_t_gate', function () {
    var s = new Simulator(1); s.applyGate('T', 0); eqProbs(s.getProbabilities(), { '0': 1 });
  }],
  ['TestSingleQubitGates', 'test_gate_on_second_qubit', function () {
    var s = new Simulator(2); s.applyGate('X', 1); eqProbs(s.getProbabilities(), { '01': 1 });
  }],

  ['TestMultiQubitGates', 'test_cnot_no_flip_when_control_zero', function () {
    var s = new Simulator(2); s.applyGate('CNOT', 1, 0); eqProbs(s.getProbabilities(), { '00': 1 });
  }],
  ['TestMultiQubitGates', 'test_cnot_flips_when_control_one', function () {
    var s = new Simulator(2); s.applyGate('X', 0); s.applyGate('CNOT', 1, 0); eqProbs(s.getProbabilities(), { '11': 1 });
  }],
  ['TestMultiQubitGates', 'test_bell_state', function () {
    var s = new Simulator(2); s.applyGate('H', 0); s.applyGate('CNOT', 1, 0);
    var p = s.getProbabilities();
    assert(near(p['00'] || 0, 0.5) && near(p['11'] || 0, 0.5), 'not a Bell state');
    assert(!('01' in p) && !('10' in p), 'odd-parity terms present');
  }],
  ['TestMultiQubitGates', 'test_cz_gate', function () {
    var s = new Simulator(2); s.applyGate('X', 0); s.applyGate('X', 1); s.applyGate('CZ', 1, 0);
    eqProbs(s.getProbabilities(), { '11': 1 }); /* phase only, probabilities unchanged */
  }],
  ['TestMultiQubitGates', 'test_swap_gate', function () {
    var s = new Simulator(2); s.applyGate('X', 0); s.applyGate('SWAP', 1, 0); eqProbs(s.getProbabilities(), { '01': 1 });
  }],

  ['TestSimulatorMethods', 'test_reset', function () {
    var s = new Simulator(2); s.applyGate('X', 0); s.reset(); eqProbs(s.getProbabilities(), { '00': 1 });
  }],
  ['TestSimulatorMethods', 'test_measure_returns_valid_counts', function () {
    var s = new Simulator(1); s.applyGate('H', 0);
    var m = s.measure(1000, 7), total = 0;
    Object.keys(m).forEach(function (k) { assert(k === '0' || k === '1', 'unexpected key ' + k); total += m[k]; });
    assert(total === 1000, 'shots summed to ' + total);
  }],
  ['TestSimulatorMethods', 'test_get_state_vector', function () {
    var sv = new Simulator(1).getStateVector();
    assert(sv.length === 1, 'expected one entry');
    assert(sv[0].label === '0' && sv[0].real === 1 && sv[0].imag === 0, 'wrong entry');
  }],
  ['TestSimulatorMethods', 'test_invalid_qubit_count', function () {
    assertRaises(function () { new Simulator(0); });
    assertRaises(function () { new Simulator(11); });
  }],
  ['TestSimulatorMethods', 'test_unknown_gate', function () {
    assertRaises(function () { new Simulator(1).applyGate('FAKE', 0); }, 'Unknown gate');
  }],
  ['TestSimulatorMethods', 'test_target_out_of_range', function () {
    assertRaises(function () { new Simulator(2).applyGate('X', 5); }, 'out of range');
  }],
  ['TestSimulatorMethods', 'test_multi_gate_missing_control', function () {
    assertRaises(function () { new Simulator(2).applyGate('CNOT', 1); }, 'requires a control');
  }],

  ['TestThreeQubitCircuits', 'test_ghz_state', function () {
    var s = new Simulator(3); s.applyGate('H', 0); s.applyGate('CNOT', 1, 0); s.applyGate('CNOT', 2, 0);
    var p = s.getProbabilities();
    assert(near(p['000'] || 0, 0.5) && near(p['111'] || 0, 0.5), 'not a GHZ state');
    assert(Object.keys(p).length === 2, 'expected exactly two terms');
  }],
  ['TestThreeQubitCircuits', 'test_gate_on_non_adjacent_qubits', function () {
    var s = new Simulator(3); s.applyGate('X', 0); s.applyGate('CNOT', 2, 0);
    eqProbs(s.getProbabilities(), { '101': 1 });
  }],

  ['TestSimulateEndpoint', 'test_simple_simulation', function () {
    var r = apiSimulate({ num_qubits: 1, operations: [{ gate: 'X', target: 0 }] });
    assert(r.status === 200, 'status ' + r.status);
    assert(r.json.num_qubits === 1 && r.json.probabilities['1'] === 1, 'wrong body');
  }],
  ['TestSimulateEndpoint', 'test_bell_state_simulation', function () {
    var r = apiSimulate({ num_qubits: 2, operations: [{ gate: 'H', target: 0 }, { gate: 'CNOT', target: 1, control: 0 }] });
    assert(r.status === 200, 'status ' + r.status);
    assert(near(r.json.probabilities['00'] || 0, 0.5) && near(r.json.probabilities['11'] || 0, 0.5), 'not a Bell state');
  }],
  ['TestSimulateEndpoint', 'test_empty_circuit', function () {
    var r = apiSimulate({ num_qubits: 2, operations: [] });
    assert(r.status === 200 && r.json.probabilities['00'] === 1, 'empty circuit is not |00>');
  }],
  ['TestSimulateEndpoint', 'test_invalid_qubit_count', function () {
    assert(apiSimulate({ num_qubits: 0, operations: [] }).status === 422, 'expected 422');
  }],
  ['TestSimulateEndpoint', 'test_too_many_qubits', function () {
    assert(apiSimulate({ num_qubits: 11, operations: [] }).status === 422, 'expected 422');
  }],
  ['TestSimulateEndpoint', 'test_invalid_gate_name', function () {
    assert(apiSimulate({ num_qubits: 1, operations: [{ gate: 'INVALID', target: 0 }] }).status === 400, 'expected 400');
  }],
  ['TestSimulateEndpoint', 'test_custom_shots', function () {
    var r = apiSimulate({ num_qubits: 1, operations: [{ gate: 'H', target: 0 }], shots: 100 });
    var total = 0;
    Object.keys(r.json.measurements).forEach(function (k) { total += r.json.measurements[k]; });
    assert(r.status === 200 && total === 100, 'shots summed to ' + total);
  }],

  ['TestGatesEndpoint', 'test_get_gates', function () {
    var r = apiGates();
    assert(r.status === 200 && r.json.length === 9, 'expected nine gates');
    var names = r.json.map(function (g) { return g.name; }).sort().join(',');
    assert(names === ['X', 'Y', 'Z', 'H', 'S', 'T', 'CNOT', 'CZ', 'SWAP'].sort().join(','), 'wrong gate set');
  }],
  ['TestGatesEndpoint', 'test_gate_structure', function () {
    apiGates().json.forEach(function (g) {
      assert('name' in g && 'num_qubits' in g && 'description' in g, 'missing field on ' + g.name);
    });
  }],
  ['TestRootEndpoint', 'test_root', function () {
    var r = apiRoot();
    assert(r.status === 200 && 'version' in r.json, 'no version on root');
  }]
];

function runTests() {
  var results = [];
  TESTS.forEach(function (t) {
    var t0 = performance.now(), passed = true, err = null;
    try { t[2](); } catch (e) { passed = false; err = e.message; }
    results.push({ group: t[0], name: t[1], pass: passed, err: err, ms: performance.now() - t0 });
  });
  state.tests = results;
}

function viewTests() {
  var h = '<div class="pane-head"><div class="kicker">05 &middot; Physics tests</div>' +
    '<h2>The guardrail, run in this page</h2>' +
    '<p>Correctness was the condition on the whole approach: a faster renderer computing the wrong state would have been worse than a slow one, ' +
    'so this suite ran on every change to the engine. All thirty-two are ported here assertion for assertion — twenty-two against the simulator, ten against the API boundary.</p></div>';

  h += '<div class="toolrow"><button class="btn primary" id="doTests">' +
    (state.tests ? 'Run them again' : 'Run all 32') + '</button>';
  if (state.tests) {
    var passed = state.tests.filter(function (r) { return r.pass; }).length;
    var total = state.tests.reduce(function (a, r) { return a + r.ms; }, 0);
    h += '<span class="chip ' + (passed === state.tests.length ? 'state-ok' : 'state-over') + '">' +
      '<span class="dot ' + (passed === state.tests.length ? 'good' : 'crit') + '"></span>' +
      passed + ' of ' + state.tests.length + ' passing &middot; ' + fmt(total, 0) + ' ms</span>';
  }
  h += '</div>';

  if (!state.tests) {
    h += '<p class="note">Not run yet. The suite takes a few milliseconds; the prototype’s Python run takes 1.34 seconds, most of which is importing NumPy and FastAPI.</p>';
    return h;
  }

  var groups = [];
  state.tests.forEach(function (r) { if (groups.indexOf(r.group) === -1) groups.push(r.group); });
  h += '<div class="card">';
  groups.forEach(function (g) {
    var rows = state.tests.filter(function (r) { return r.group === g; });
    var ok = rows.filter(function (r) { return r.pass; }).length;
    h += '<div class="testgroup"><h4>' + g + ' <span class="badge ' + (ok === rows.length ? 'good' : 'crit') + '">' +
      ok + '/' + rows.length + '</span></h4>';
    rows.forEach(function (r) {
      h += '<div class="trow"><span class="tk ' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? '✓' : '✗') + '</span>' +
        '<span class="tn">' + r.name + (r.pass ? '' : ' — <span style="color:var(--crit)">' + esc(r.err) + '</span>') + '</span>' +
        '<span class="tt">' + fmt(r.ms, 2) + ' ms</span></div>';
    });
    h += '</div>';
  });
  h += '</div>';

  h += '<p class="note good">Passing tests are a statement about the engine and nothing else. ' +
    'They say the Bell state has the amplitudes it should and that the API rejects eleven qubits. ' +
    'They say nothing at all about whether watching a Bloch sphere move teaches anyone anything, which is the claim the prototype was built to test and never did.</p>';
  return h;
}

/* ------------------------------------------------------------
   13. CHROME, WIRING, DEEP LINKS
   ------------------------------------------------------------ */
function renderRail() {
  var h = '<div class="rail-group"><div class="rail-label">Simulator</div>';
  VIEWS.forEach(function (v) {
    h += '<button class="rail-item" data-view="' + v.id + '" aria-current="' + (state.view === v.id) + '">' +
      '<span class="n">' + v.n + '</span><span>' + v.label + '<span class="sub">' + v.sub + '</span></span></button>';
  });
  h += '</div><div class="rail-note"><b>Prototype, never released.</b> The engine, the renderer and the circuit library are complete and working. ' +
    'No learner has used any of it, so the claim it was built to test is exactly as unproven as it was in December.</div>';
  $('rail').innerHTML = h;
}

function renderFoot() {
  $('foot').innerHTML =
    '<b>What this is.</b> The prototype’s simulation engine, ported from Python and NumPy into the browser and running here. ' +
    'Every amplitude, probability, Bloch vector, shot count and timing on this page is computed when the screen renders — nothing is a stored figure. ' +
    'The engine builds the full 2ⁿ × 2ⁿ operator for each gate by Kronecker product exactly as the deployed one does, because the cost of doing it that way is the finding in section 05 and an optimised port would have made that claim uncheckable.' +
    '<br><br><b>Two places it departs from the shipped prototype, both deliberate.</b> The prototype has a Run button; this does not, because the design argument in section 04 is that feedback has to arrive with the placement to be worth anything, and a demo of that argument should be subject to it. ' +
    'And the deployed engine runs on a server: section 03 records that decision, taken so linear algebra would not sit in the render loop. This page does the opposite by necessity — it is one file — so the milliseconds you measure on the ceiling screen are this browser’s, not the deployed engine’s. The deployed curve is drawn beside them for comparison rather than replaced by them.' +
    '<br><br><b>What it is not.</b> Not a released product and not a teaching tool in use. Zero learners have opened it, the usage figures on the case study page are invented placeholders, and the technical characteristics — ten qubits, nine gates, 32 tests, the 200 ms budget — are the real ones.';
}

function render() {
  renderRail();
  var fn = { circuit: viewCircuit, library: viewLibrary, entanglement: viewEntanglement, ceiling: viewCeiling, tests: viewTests }[state.view] || viewCircuit;
  $('pane').innerHTML = fn();
  $('chipQubits').innerHTML = '<span class="dot accent"></span>' + state.n + ' qubit' + (state.n > 1 ? 's' : '') +
    ' &middot; cap <b>10</b>';
  var over = state.ms > BUDGET;
  $('chipTime').className = 'chip ' + (state.computing ? 'state-ruo' : over ? 'state-over' : 'state-ok');
  $('chipTime').innerHTML = '<span class="dot ' + (state.computing ? 'warn' : over ? 'crit' : 'good') + '"></span>' +
    (state.computing ? 'computing…' : 'last update <b>' + fmt(state.ms, 1) + ' ms</b> / 200');
  wire();
}

/* Motion is opt-out at the OS level: no idle spin and no smooth
   scrolling when the user has asked for reduced motion. */
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function setView(id) {
  state.view = id;
  state.loaded = null;
  state.notice = null;
  render();
  window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
}

function loadCircuit(id) {
  var c = libraryById(id);
  if (!c || !c.ready) return;
  state.n = c.qubits;
  state.initial = c.initial.slice();
  state.ops = c.ops.map(function (o) {
    return { id: 'op-' + (nextOpId++), gate: o.gate, target: o.target, control: o.control, step: o.step };
  });
  state.gate = null;
  state.pending = null;
  state.view = 'circuit';
  state.loaded = id;
  state.notice = null;
  runSim();
  render();
  window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
}

function placeGate(q, step) {
  if (!state.gate) return;
  if (isMulti(state.gate)) {
    if (!state.pending) {
      state.pending = { gate: state.gate, control: q, step: step };
      render();
      return;
    }
    if (q === state.pending.control) return;
    state.ops.push({ id: 'op-' + (nextOpId++), gate: state.pending.gate, target: q, control: state.pending.control, step: state.pending.step });
    state.pending = null;
  } else {
    state.ops.push({ id: 'op-' + (nextOpId++), gate: state.gate, target: q, control: null, step: step });
  }
  state.loaded = null;
  recompute();
}

function wire() {
  document.querySelectorAll('[data-view]').forEach(function (b) {
    b.onclick = function () { setView(b.dataset.view); };
  });
  document.querySelectorAll('[data-gate]').forEach(function (b) {
    b.onclick = function () {
      state.gate = state.gate === b.dataset.gate ? null : b.dataset.gate;
      state.pending = null;
      render();
    };
  });
  document.querySelectorAll('[data-cell]').forEach(function (c) {
    c.onclick = function () {
      var p = c.dataset.cell.split('-');
      placeGate(parseInt(p[0], 10), parseInt(p[1], 10));
    };
  });
  document.querySelectorAll('[data-del]').forEach(function (b) {
    b.onclick = function (e) {
      e.stopPropagation();
      state.ops = state.ops.filter(function (o) { return o.id !== b.dataset.del; });
      state.loaded = null;
      recompute();
    };
  });
  document.querySelectorAll('[data-ket]').forEach(function (b) {
    b.onclick = function () {
      var q = parseInt(b.dataset.ket, 10);
      state.initial[q] = state.initial[q] === 1 ? 0 : 1;
      state.loaded = null;
      recompute();
    };
  });
  document.querySelectorAll('[data-load]').forEach(function (b) {
    b.onclick = function () { loadCircuit(b.dataset.load); };
  });
  document.querySelectorAll('[data-ent]').forEach(function (b) {
    b.onclick = function () { state.ent = b.dataset.ent; render(); };
  });

  var qp = $('qPlus');
  if (qp) qp.onclick = function () {
    if (state.n >= 10) return;
    state.n++;
    while (state.initial.length < state.n) state.initial.push(0);
    state.loaded = null;
    recompute();
  };
  var qm = $('qMinus');
  if (qm) qm.onclick = function () {
    if (state.n <= 1) return;
    state.n--;
    state.ops = state.ops.filter(function (o) {
      return o.target < state.n && (o.control === null || o.control < state.n);
    });
    state.initial = state.initial.slice(0, state.n);
    state.pending = null;
    state.loaded = null;
    recompute();
  };
  var rs = $('doReset');
  if (rs) rs.onclick = function () {
    state.ops = [];
    state.pending = null;
    state.gate = null;
    state.loaded = null;
    state.initial = new Array(state.n).fill(0);
    recompute();
  };
  var ss = $('shotSel');
  if (ss) ss.onchange = function () { state.shots = parseInt(ss.value, 10); recompute(); };
  var rsm = $('doResample');
  if (rsm) rsm.onclick = function () { state.seed = (state.seed * 1664525 + 1013904223) >>> 0; recompute(); };
  var sp = $('doSpin');
  if (sp) sp.onclick = function () { state.spin = !state.spin; render(); };
  var bn = $('doBench');
  if (bn) bn.onclick = runBench;
  var tt = $('doTests');
  if (tt) tt.onclick = function () { runTests(); render(); };

  wireSpheres();
}

/* Drag any sphere and the whole set turns with it, so the qubits
   stay comparable rather than each drifting to its own angle. */
var dragging = null;
function wireSpheres() {
  document.querySelectorAll('.sphere-cell').forEach(function (cell) {
    cell.onpointerdown = function (e) {
      dragging = { x: e.clientX, y: e.clientY };
      cell.setPointerCapture(e.pointerId);
      e.preventDefault();
    };
    cell.onpointermove = function (e) {
      if (!dragging) return;
      state.cam.yaw += (e.clientX - dragging.x) * 0.011;
      state.cam.pitch = Math.max(-1.35, Math.min(1.35, state.cam.pitch + (e.clientY - dragging.y) * 0.009));
      dragging = { x: e.clientX, y: e.clientY };
      paintSpheres();
    };
    cell.onpointerup = cell.onpointercancel = function () { dragging = null; };
  });
}

function paintSpheres() {
  var cells = document.querySelectorAll('.sphere-cell');
  for (var i = 0; i < cells.length; i++) {
    var raw = cells[i].dataset.r;
    var r = raw ? raw.split(',').map(Number) : blochOf(parseInt(cells[i].dataset.sphere, 10));
    var svg = cells[i].querySelector('svg');
    if (svg) svg.outerHTML = sphereSVG(r);
  }
}

var lastSpin = 0;
function spinLoop(t) {
  requestAnimationFrame(spinLoop);
  if (!state.spin || dragging || state.computing || state.benchRunning) return;
  if (state.view !== 'circuit' && state.view !== 'entanglement') return;
  if (state.n > 4 && state.view === 'circuit') return;
  if (t - lastSpin < 55) return;
  lastSpin = t;
  state.cam.yaw += 0.014;
  paintSpheres();
}

/* ------------------------------------------------------------
   14. DEEP LINKS

   The case study links each screenshot to the state it pictures,
   so every screen this page can show is reachable by URL.
   ------------------------------------------------------------ */
(function init() {
  var q = new URLSearchParams(location.search);
  var v = q.get('view');
  if (v && VIEWS.some(function (x) { return x.id === v; })) state.view = v;
  if (q.get('case') && ENT_CASES[q.get('case')]) state.ent = q.get('case');
  if (REDUCED || q.get('spin') === '0') state.spin = false;

  var c = q.get('circuit');
  var cLib = c ? libraryById(c) : null;
  if (cLib && cLib.ready) {
    state.n = cLib.qubits;
    state.initial = cLib.initial.slice();
    state.ops = cLib.ops.map(function (o) {
      return { id: 'op-' + (nextOpId++), gate: o.gate, target: o.target, control: o.control, step: o.step };
    });
    if (!v) state.view = 'circuit';
    state.loaded = c;
  } else {
    if (cLib && !cLib.ready) {
      /* A deep link to one of the eight unbuilt circuits used to
         load nothing and say nothing. Say why, in the library
         card's own words. */
      state.notice = { name: cLib.name, reason: cLib.detail };
      if (!v) state.view = 'circuit';
    }
    var n = parseInt(q.get('q'), 10);
    if (n >= 1 && n <= 10) { state.n = n; state.initial = new Array(n).fill(0); }
  }
  if (q.get('gate') && GATE_UI[q.get('gate')]) state.gate = q.get('gate');

  renderFoot();
  runSim();
  render();

  if (q.get('run') === '1') {
    if (state.view === 'tests') { runTests(); render(); }
    if (state.view === 'ceiling') runBench();
  }
  requestAnimationFrame(spinLoop);
})();
</script>
