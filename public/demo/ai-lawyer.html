/* ============================================================
   VIEW — THE CORPUS CEILING
   The one place on this page carrying real numbers. ADR 002,
   measured over 80 granted US patents and their 3,399
   front-page citations — public patent data throughout.
   ============================================================ */
function viewCorpus() {
  const C = CEILING;
  const wide = S.corpus === 'wide';

  return '<div class="stack">' +
    '<p class="lede">Retrieval is the weakest part of this system and the one that most needs reading carefully, because <b>its failure mode is silent</b>. ' +
    'Before spending months tuning a ranker, we measured what any ranker could possibly achieve on the corpus we had. The answer decided the project.</p>' +

    '<div class="tiles">' +
      '<div class="tile"><div class="v">15.4%</div><div class="s">the ceiling</div><div class="l">Of ground-truth citations present in the corpus at all</div></div>' +
      '<div class="tile"><div class="v">' + int(C.citations) + '</div><div class="s">' + int(C.inCorpus) + ' present</div><div class="l">Front-page citations across an ' + C.patents + '-patent gold set</div></div>' +
      '<div class="tile"><div class="v">52.5%</div><div class="l">Of the missing art excluded by the CPC filter, not the date floor</div></div>' +
      '<div class="tile"><div class="v">73.5%</div><div class="s">if widened</div><div class="l">Ceiling after ten subclasses and a 1995 floor</div></div>' +
    '</div>' +

    '<h2 class="sec"><span class="n">01</span>The finding</h2>' +
    '<p class="note">The gold set is ' + C.patents + ' granted US patents in the corpus’s own classification, stratified across four publication eras, with their front-page citations as ground truth — ' +
    'the prior art a human examiner already found. <b>' + pct(1 - C.ceiling, 1) + ' of it is not in the corpus at all</b>, so no amount of embedding work, reranking or query refinement can retrieve it. ' +
    'That is a ceiling, not a score.</p>' +
    bars(C.eras.map((e) => ({ name: e.name, value: e.ceiling, label: e.ceiling.toFixed(1) + '%', hi: e.ceiling === 32.1 }))
      .concat([{ name: 'All four eras', value: 15.4, label: '15.4%', hi: true }, { name: 'After widening', value: 73.5, label: '73.5%', good: true }]),
      100, 'Share of ground-truth citations present in the corpus. n = ' + int(C.citations) + ' citations across ' + C.patents + ' patents.') +

    '<h2 class="sec"><span class="n">02</span>The diagnosis, and why the obvious reading was wrong</h2>' +
    '<p class="note">The era gradient looks like the 2005 date floor. <b>It is not</b> — that reading is confounded, because older patents cite art that is also classified differently. ' +
    'Probing all ' + int(2497) + ' missing US citations against the upstream table separates the two causes:</p>' +
    '<div class="tablewrap"><table><thead><tr><th>Cause</th><th class="num">Citations</th><th class="num">Share</th></tr></thead><tbody>' +
    C.causes.map((c) => '<tr' + (c.sub ? ' style="color:var(--faint)"' : '') + '><td>' + (c.sub ? '&nbsp;&nbsp;' : '') + c.cause + '</td>' +
      '<td class="num">' + int(c.n) + '</td><td class="num">' + c.pct.toFixed(1) + '%</td></tr>').join('') +
    '</tbody></table></div>' +
    '<p class="note" style="margin-top:10px">87.8% of the missing citations are US patents, so this is not a country-coverage problem. Dropping the date floor alone recovers 8.7%.</p>' +

    '<h2 class="sec"><span class="n">03</span>The premise was wrong</h2>' +
    '<div class="alert warn"><h3>Prior art for a UI invention is not UI-classified</h3>' +
    '<p>A map-navigation interface cites G01C and G08G. A messaging interface cites H04L and H04W. Examiners cite across the whole of computing and telecoms, and there is no clean CPC boundary that contains it. ' +
    'The premise behind “build a UI patent corpus” was wrong, and only the measurement exposed it.</p></div>' +
    bars(C.subclasses.map((s) => ({ name: s.code, value: s.pct, label: s.pct.toFixed(1) + '%' })), 50,
      'CPC subclasses of the missing art, as a share of missing citations. Rows overlap: one citation can carry several codes.') +

    '<h2 class="sec"><span class="n">04</span>The reframe, which was the most valuable output</h2>' +
    '<div class="panel panel-pad">' +
    '<p class="note">A ranker scoring 0.14 against a 0.154 ceiling is at <b>91% of achievable</b> — excellent. Reported as “14% recall” it looks broken, and would trigger months of pointless ranker tuning. ' +
    'Move the slider and read both numbers:</p>' +
    '<div class="field" style="margin-top:12px;max-width:420px"><label for="rk">Absolute recall @20 of the ranker under test</label>' +
    '<input id="rk" type="range" min="0" max="154" value="140" data-act="recall"></div>' +
    '<div id="recall-out" style="margin-top:10px"></div>' +
    '<p class="note" style="margin-top:12px">Three numbers must therefore be reported and never collapsed into one: recall, ceiling, and recall relative to ceiling. ' +
    'The regression gate keys on the third, because otherwise widening the corpus later would show up as a quality regression.</p>' +
    '</div>' +

    '<h2 class="sec"><span class="n">05</span>What we decided</h2>' +
    '<div class="alert plain"><h3>Do not widen yet</h3>' +
    '<p>The BigQuery extract exists only because the patent-office API credentials are pending. Those APIs search the entire corpus server-side and have no ceiling problem — ' +
    '<b>the ceiling is a property of the stopgap, not of the architecture.</b> Spending another quarter-terabyte and a billing decision to raise a stopgap’s ceiling, weeks before the stopgap is replaced, ' +
    'is likely wasted work. Ten whole subclasses since 1995 is millions of publications and does not fit the sandbox storage allowance as the schema stands.</p>' +
    '<p>So: keep the ' + int(C.corpusRows) + '-document corpus with a known ceiling for ranker development, report recall against the ceiling, and revisit if the credentials slip.</p></div>' +

    '<div class="btnrow"><button class="btn primary" data-act="toggle-corpus">' +
    (wide ? 'Revert to the shipped corpus' : 'Widen the corpus and re-run the draft') + '</button>' +
    '<span class="note" style="margin:0">' + (wide ? 'Currently on the widened extract — coverage covered, critics exhausted, ' + usd(ledgerTotal('wide')) + '.' : 'Currently on the shipped extract — coverage absent, critics clean, ' + usd(ledgerTotal('narrow')) + '.') + '</span></div>' +
    '</div>';
}

function paintRecall() {
  const el = document.getElementById('recall-out');
  const rk = document.getElementById('rk');
  if (!el || !rk) return;
  const v = Number(rk.value) / 1000;
  const rel = v / CEILING.ceiling;
  el.innerHTML =
    '<div class="tiles">' +
    '<div class="tile"><div class="v">' + pct(v, 1) + '</div><div class="l">Absolute recall @20 — how it would be reported</div></div>' +
    '<div class="tile"><div class="v" style="color:' + (rel > 0.85 ? 'var(--good)' : rel > 0.6 ? 'var(--warn)' : 'var(--crit)') + '">' + pct(rel, 0) + '</div>' +
    '<div class="l">Of achievable — how it should be reported</div></div>' +
    '<div class="tile"><div class="v">15.4%</div><div class="l">Ceiling, fixed by the corpus and not by the ranker</div></div>' +
    '</div>';
}

/* ============================================================
   VIEW — ALL RUNS
   The three worth having are not the successful one.
   ============================================================ */
const RUN_TONE = {
  ok: { label: 'drafted', cls: 'good', note: 'The pipeline ran to completion.' },
  insufficient_disclosure: { label: 'no draft', cls: 'warn', note: 'The source did not support a claim. The gap list is the deliverable.' },
  blocked: { label: 'refused', cls: 'stop', note: 'The containment gate refused before anything was transmitted.' },
  error: { label: 'error', cls: 'stop', note: 'The run failed partway.' },
  incomplete: { label: 'incomplete', cls: '', note: 'No manifest — the run crashed, was killed, or is still going.' },
};

function viewRuns() {
  const rows = RUNS.map((r) => {
    const t = RUN_TONE[r.status];
    return '<tr' + (r.status === 'ok' && r.id.startsWith('20260826T0914') ? ' class="clickable" data-go="result"' : '') + '>' +
      '<td><span class="mono" style="font-size:11.5px;color:var(--ink)">' + r.id + '</span><br>' +
      '<span style="color:var(--faint)">' + (r.title || '— no manifest, so no title —') + '</span></td>' +
      '<td>' + badge(t.label, t.cls) + (r.intake ? '<br>' + badge(statusInfo(r.intake).label) : '') + '</td>' +
      '<td class="num">' + (r.dur ? mmss(r.dur) : '—') + '</td>' +
      '<td class="num">' + (r.cost !== null ? '$' + r.cost : usd(ledgerTotal(S.corpus))) + '</td>' +
      '<td class="num">' + (r.claims ?? '—') + '</td>' +
      '<td>' + (r.filable === true ? badge('filable', 'good') : r.filable === false ? badge('not filable', 'stop') : '—') + '</td>' +
      '<td style="max-width:36ch">' + r.note + '</td></tr>';
  }).join('');

  return '<div class="stack">' +
    '<p class="lede">Seven runs. Browsing them is free and does not need the backend running at all, because the read plane reads the run directories straight off disk. ' +
    '<b>The three worth opening are not the successful one.</b></p>' +

    '<div class="tablewrap"><table><thead><tr>' +
    '<th>Run</th><th>State</th><th class="num">Duration</th><th class="num">Cost</th><th class="num">Claims</th><th>Package</th><th>What it shows</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' +

    '<h2 class="sec"><span class="n">02</span>The refusal, verbatim</h2>' +
    '<p class="note">Run <span class="mono">20260826T083920Z-4f1c8ad2</span>. A new entry point called the retrieval client from inside a worker thread. Context variables do not cross thread boundaries, ' +
    'so the clearance set on the calling thread was invisible in the worker and the gate refused. <b>The failure was closed</b> — it refused rather than transmitting without clearance, ' +
    'which is the correct direction to be wrong in.</p>' +
    '<pre class="verbatim">' +
'ContainmentError: BigQuery query was attempted with no active source.\n' +
'Nothing may be transmitted to a third party until a source has been\n' +
'fingerprinted (W0.1) and an intake decision recorded (W0.2).\n' +
'Wrap the work in `with active_source(src.sha256):` and record a decision\n' +
'first — see patentgen/gates/intake.py.' +
    '</pre>' +
    '<p class="note" style="margin-top:10px">Fail closed is the whole design. No active source is a <b>block</b>, not a pass: the common failure is not “someone set the wrong status”, ' +
    'it is “nobody set one at all”, because a new entry point forgot to. That case has to be the loud one.</p>' +

    '<h2 class="sec"><span class="n">03</span>A run with no manifest</h2>' +
    '<p class="note">Run <span class="mono">20260825T142207Z-4f1c8ad2</span> was killed at the vision pass. It left three files and a directory that looks exactly like a result. ' +
    'The page says <span class="mono">incomplete</span> and lists what was written, rather than rendering an empty draft — “incomplete” is accurate about the files on disk. ' +
    'A run still in flight gets a different word, because calling a ninety-second-old run “incomplete” reads as broken.</p>' +
    '</div>';
}

/* ============================================================
   RENDER + EVENTS
   ============================================================ */
function render() {
  renderChrome();
  const host = document.getElementById('view');
  host.innerHTML = { sources: viewSources, intake: viewIntake, run: viewRun, result: viewResult, corpus: viewCorpus, runs: viewRuns }[S.view]();
  if (S.view === 'run') paintRun();
  if (S.view === 'corpus') paintRecall();
  writeURL();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-act],[data-tab],[data-src]');
  if (!t) return;

  if (t.dataset.act === 'toggle-corpus') {
    S.corpus = S.corpus === 'wide' ? 'narrow' : 'wide';
    render(); return;
  }
  if (t.dataset.act === 'record') {
    const info = statusInfo(S.intake.status);
    S.decisions[S.src] = {
      status: S.intake.status, by: S.intake.by.trim(),
      at: new Date().toISOString().replace(/\.\d+Z$/, 'Z'),
      pub: info.needsDate ? S.intake.pub : null,
      filing: S.intake.filing || null,
      override: info.mayProcess ? null : S.intake.override.trim() || null,
    };
    render(); return;
  }
  if (t.dataset.act === 'reset-decision') {
    S.decisions[t.dataset.src] = null;
    S.intake = { status: 'unpublished_internal', pub: '', filing: '2026-09-01', by: '', override: '' };
    render(); return;
  }
  if (t.dataset.act === 'run-toggle') { S.run.playing ? (stopRun(), render()) : startRun(); return; }
  if (t.dataset.act === 'run-speed') { S.run.speed = Number(t.dataset.v); render(); return; }
  if (t.dataset.act === 'run-skip') { stopRun(); S.run.t = TOTAL_SECONDS; S.run.done = true; go('result'); return; }

  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.go) { if (t.dataset.src) S.src = t.dataset.src; go(t.dataset.go); return; }
  if (t.dataset.src) { S.src = t.dataset.src; render(); return; }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.act === 'pick-status') { S.intake.status = t.value; render(); }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.act === 'field') {
    S.intake[t.dataset.k] = t.value;
    const k = t.dataset.k, pos = t.selectionStart;
    render();
    const again = document.querySelector('[data-k="' + k + '"]');
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (_) {} }
  }
  if (t.dataset && t.dataset.act === 'recall') paintRecall();
});

/* -- Footer ------------------------------------------------ */
document.getElementById('foot').innerHTML =
  '<p><b>What is real here and what is not.</b> The mechanism is the prototype’s: the four publication states and their rationales, the fail-closed containment gate enforced inside the outbound clients, ' +
  'the stage sequence and its measured timings, the three-critic ring with a reviser between rounds, the coverage verdict that leads the prior-art section, the §1.84 proof measured against the rendered sheet, ' +
  'the nested token accounting, and the filable verdict. Every dollar figure on this page is computed from the ledger rows at render time; none is a literal.</p>' +
  '<p><b>The specimen is invented.</b> DIS-0416, EN-2210 and WP-0092 do not exist. The claims, the reference identifiers, the assignees, the people, the run identifiers and the costs are made up for publication. ' +
  'No real disclosure, filing or attorney work product appears anywhere on this page, and the prototype has never been run on a real inventor disclosure.</p>' +
  '<p><b>One exception.</b> The corpus measurement in “Corpus ceiling” is the real result — an 80-patent gold set, 3,399 front-page citations, a 15.4% ceiling and the CPC diagnosis behind it — ' +
  'computed over public patent data. It is the finding the project turned on, and inventing it would have left this page arguing nothing.</p>' +
  '<p>Nothing here has been filed, and no attorney has used it. The output is attorney-review material and the package verdict says so.</p>';

readURL();
render();
// `?play=1` is a live run, not a paused one. Without this the flag would
// render the Pause button over a timer that was never started.
if (S.view === 'run' && S.run.playing) startRun();
</script>
