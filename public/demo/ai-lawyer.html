<!-- ARTIFACT-BODY-START -->
<style>
/* ============================================================
   AI Lawyer / patentgen — interactive recreation.
   Palette and type inherited from the portfolio's case-study
   system and from the sibling demos, so the family reads as one
   product. Single dark theme, every colour painted explicitly.

   The prototype's own UI is a light, document-like surface an
   attorney reads for long stretches. This is the portfolio's
   dark shell wearing the same information architecture: the same
   sections, the same badges, the same verbatim blocks, and the
   same refusal wording.
   ============================================================ */
:root {
  color-scheme: dark;
  --bg: #08080b;
  --surface: #101015;
  --surface-2: #16161d;
  --surface-3: #1c1c25;
  --line: #23232d;
  --line-soft: #17171e;
  --ink: #f2f3f6;
  --body: #b4bacb;
  --muted: #6e7385;
  --faint: #4a4e5e;
  --accent: #b8873f;
  --accent-dim: #5e4520;
  --accent-wash: rgba(184, 135, 63, 0.11);
  --good: #5f9a54;
  --good-dim: #2f5228;
  --good-wash: rgba(95, 154, 84, 0.12);
  --warn: #c9973f;
  --warn-dim: #6b5220;
  --warn-wash: rgba(201, 151, 63, 0.12);
  --crit: #c05e4a;
  --crit-dim: #5e3628;
  --crit-wash: rgba(192, 94, 74, 0.12);
  --blue: #5b7cfa;
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--body);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
select, input { font: inherit; color: inherit; }
a { color: var(--accent); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* -- App chrome ------------------------------------------- */
.app {
  min-height: 100vh;
  max-width: 1320px;
  margin: 0 auto;
  border-left: 1px solid var(--line-soft);
  border-right: 1px solid var(--line-soft);
  display: flex;
  flex-direction: column;
}

.topbar { position: sticky; top: 0; z-index: 40; background: rgba(8,8,11,0.96); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar-row { display: flex; align-items: center; gap: 10px; padding: 11px 20px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 1px; margin-right: auto; }
.brand .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.brand h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.012em; color: var(--ink); }

.chip {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 5px 11px;
  font-size: 11.5px; font-family: var(--mono); color: var(--body); white-space: nowrap;
}
.chip b { color: var(--ink); font-weight: 500; }
.chip.warnish { border-color: var(--warn-dim); color: var(--warn); background: var(--warn-wash); }
.chip.critish { border-color: var(--crit-dim); color: var(--crit); background: var(--crit-wash); }
.chip.goodish { border-color: var(--good-dim); color: var(--good); background: var(--good-wash); }
.chip button { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 2px; font-family: var(--mono); font-size: 11.5px; }

.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.crit { background: var(--crit); }

/* -- View tabs -------------------------------------------- */
.viewbar { display: flex; gap: 2px; padding: 0 14px; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--surface); }
.viewbar button {
  background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 10px 12px; font-size: 12.5px; color: var(--muted); white-space: nowrap;
}
.viewbar button:hover { color: var(--body); }
.viewbar button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.viewbar .vb-count { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-left: 6px; }

/* -- Layout ----------------------------------------------- */
.main { flex: 1; padding: 22px 20px 60px; }
.stack > * + * { margin-top: 20px; }
.lede { max-width: 76ch; color: var(--body); }
.lede b { color: var(--ink); font-weight: 500; }

h2.sec {
  margin: 0 0 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted);
  display: flex; align-items: baseline; gap: 10px;
  border-top: 1px solid var(--line); padding-top: 16px;
}
h2.sec .n { font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: 0; }
h3.sub { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--body); }

.panel { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; }
.panel-pad { padding: 16px 18px; }
.panel + .panel { margin-top: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 14px; }

.note { font-size: 12.5px; color: var(--muted); max-width: 80ch; }
.note b { color: var(--body); font-weight: 500; }
.note code, .lede code { font-family: var(--mono); font-size: 11.5px; color: var(--accent); }

/* -- Alerts ----------------------------------------------- */
.alert { border-radius: 8px; border: 1px solid; padding: 15px 17px; }
.alert h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
.alert p { margin: 6px 0 0; font-size: 12.5px; max-width: 80ch; }
.alert.stop { border-color: var(--crit-dim); background: var(--crit-wash); }
.alert.stop h3 { color: var(--crit); }
.alert.warn { border-color: var(--warn-dim); background: var(--warn-wash); }
.alert.warn h3 { color: var(--warn); }
.alert.ok { border-color: var(--good-dim); background: var(--good-wash); }
.alert.ok h3 { color: var(--good); }
.alert.plain { border-color: var(--line); background: var(--surface-2); }
.alert.plain h3 { color: var(--ink); }

/* Verbatim output — a refusal, a violation, a check failure. Quoted, never
   paraphrased: the exact wording is the actionable part, and rewording a
   legal refusal in friendlier prose loses what makes it actionable. */
pre.verbatim {
  margin: 12px 0 0; padding: 12px 14px; overflow-x: auto;
  white-space: pre-wrap; border: 1px solid var(--line);
  background: var(--surface-3); border-radius: 6px;
  font-family: var(--mono); font-size: 11.5px; line-height: 1.65; color: var(--body);
}

/* -- Badges ----------------------------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--line); color: var(--muted);
  border-radius: 4px; padding: 2px 7px;
  font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
}
.badge.good { border-color: var(--good-dim); color: var(--good); }
.badge.warn { border-color: var(--warn-dim); color: var(--warn); }
.badge.stop { border-color: var(--crit-dim); color: var(--crit); }
.badge.accent { border-color: var(--accent-dim); color: var(--accent); }
.badgerow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* -- Tables ----------------------------------------------- */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
thead th { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 500; background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-2); }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.selected { background: var(--accent-wash); }
tfoot td { font-family: var(--mono); color: var(--ink); border-top: 1px solid var(--line); }

/* -- Definition lists ------------------------------------- */
dl.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px 22px; margin: 0; }
dl.fields dt { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
dl.fields dd { margin: 2px 0 0; color: var(--ink); font-size: 13px; }
dl.fields dd .mono { font-size: 12px; }

/* -- Buttons ---------------------------------------------- */
.btn {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 6px; padding: 8px 14px; font-size: 13px;
}
.btn:hover { border-color: var(--accent-dim); background: var(--surface-3); }
.btn.primary { border-color: var(--accent-dim); background: var(--accent-wash); color: var(--accent); font-weight: 500; }
.btn.primary:hover { background: rgba(184,135,63,0.18); }
.btn.small { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* -- Forms ------------------------------------------------ */
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.field input, .field select {
  background: var(--surface-3); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 10px; font-size: 13px; color: var(--ink);
}
.opt {
  display: block; border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; background: var(--surface-2); cursor: pointer;
}
.opt + .opt { margin-top: 8px; }
.opt:hover { border-color: var(--faint); }
.opt.chosen { border-color: var(--accent-dim); background: var(--accent-wash); }
.opt-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.opt-head .name { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
.opt-why { margin: 7px 0 0 25px; font-size: 12.5px; color: var(--muted); max-width: 74ch; }
.opt input { accent-color: var(--accent); }

/* -- Stage / run progress --------------------------------- */
.stage { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: start; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.stage:last-child { border-bottom: 0; }
.stage .mark { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 10px; color: var(--faint); margin-top: 1px; }
.stage.done .mark { border-color: var(--good-dim); color: var(--good); background: var(--good-wash); }
.stage.active .mark { border-color: var(--accent-dim); color: var(--accent); background: var(--accent-wash); }
.stage .label { color: var(--muted); font-size: 13px; }
.stage.done .label, .stage.active .label { color: var(--ink); }
.stage .t { font-family: var(--mono); font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.substages { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.substages li { font-size: 12px; color: var(--faint); display: flex; gap: 8px; align-items: baseline; }
.substages li.done { color: var(--muted); } .substages li.active { color: var(--accent); }

.bar { height: 4px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width 0.18s linear; }

.eventlog { max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-3); padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.8; }
.eventlog div { color: var(--muted); }
.eventlog div b { color: var(--body); font-weight: 500; }
.eventlog div .ts { color: var(--faint); }

/* -- Claims ----------------------------------------------- */
.claim { padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
.claim:last-child { border-bottom: 0; }
.claim-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.claim-head .n { font-family: var(--mono); font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
.claim-head .preamble { color: var(--ink); font-weight: 500; }
.claim .trans { margin: 3px 0 0 24px; font-size: 12.5px; color: var(--muted); }
.claim ul { margin: 6px 0 0; padding: 0 0 0 24px; list-style: none; display: flex; flex-direction: column; gap: 6px; }
/* A claim reads as a hanging block: the preamble sets the margin and each
   lettered element aligns under it. Running them flush makes (a)/(b)/(c) hard
   to scan, which is most of what reading a claim set is. */
.claim li { padding-left: 2.4rem; text-indent: -2.4rem; font-size: 13px; line-height: 1.62; }
.claim li .el { font-family: var(--mono); color: var(--muted); }
.claim mark { background: var(--accent-wash); color: var(--accent); border-radius: 2px; padding: 0 2px; }
.numeral { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--accent); }

/* -- Critic ring ------------------------------------------ */
.round { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.round + .round { margin-top: 14px; }
.round-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 11px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.round-head h4 { margin: 0; font-size: 13px; color: var(--ink); font-weight: 600; }
.critics { display: grid; grid-template-columns: repeat(auto-fit, minmax(258px, 1fr)); }
.critic { padding: 14px 16px; border-right: 1px solid var(--line-soft); }
.critic:last-child { border-right: 0; }
.critic h5 { margin: 0 0 7px; font-size: 11px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.critic p { margin: 0; font-size: 12.5px; color: var(--muted); }
.finding { border-left: 2px solid var(--crit-dim); padding: 2px 0 2px 11px; margin-top: 10px; }
.finding .fh { font-family: var(--mono); font-size: 11px; color: var(--crit); }
.finding .lim { font-size: 12px; color: var(--body); font-style: italic; margin: 4px 0 0; }
.finding .why { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; }
.reviser { padding: 13px 16px; border-top: 1px solid var(--line); background: var(--surface-2); }
.reviser ul { margin: 7px 0 0; padding-left: 18px; }
.reviser li { font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }

/* -- Charts ----------------------------------------------- */
.hbars { display: flex; flex-direction: column; gap: 9px; }
.hbar { display: grid; grid-template-columns: 210px 1fr 92px; gap: 12px; align-items: center; font-size: 12.5px; }
.hbar .nm { color: var(--body); }
.hbar .track { height: 15px; background: #20202a; border-radius: 3px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.hbar .fill { height: 100%; background: #7d6c4d; }
.hbar.hi .fill { background: var(--accent); }
.hbar.good .fill { background: var(--good); }
.hbar .val { font-family: var(--mono); font-size: 12px; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .hbar { grid-template-columns: 118px 1fr 70px; gap: 8px; font-size: 11.5px; } }

/* -- Metric tiles ----------------------------------------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 13px 15px; }
.tile .v { font-family: var(--mono); font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.tile .s { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-top: 1px; }
.tile .l { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.4; }

/* -- Result tabs ------------------------------------------ */
.rtabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.rtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 12px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.rtabs button:hover { color: var(--body); }
.rtabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.rtabs .c { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-left: 5px; }

/* -- Prose (gaps, package) -------------------------------- */
.prose { max-width: 78ch; font-size: 13px; }
.prose h4 { margin: 20px 0 7px; font-size: 13px; color: var(--ink); font-weight: 600; }
.prose h4:first-child { margin-top: 0; }
.prose h5 { margin: 16px 0 6px; font-size: 12.5px; color: var(--body); font-weight: 600; }
.prose p { margin: 0 0 9px; color: var(--muted); }
.prose ul, .prose ol { margin: 0 0 10px; padding-left: 20px; }
.prose li { margin-bottom: 6px; color: var(--muted); }
.prose li b, .prose p b { color: var(--body); font-weight: 500; }
.prose code { font-family: var(--mono); font-size: 12px; color: var(--accent); background: var(--surface-3); padding: 1px 4px; border-radius: 3px; }

/* -- Drawing sheet ---------------------------------------- */
.sheet { background: #ffffff; border-radius: 4px; padding: 8px; overflow-x: auto; }
.sheet svg { display: block; width: 100%; height: auto; max-width: 780px; margin: 0 auto; }

/* -- Footer ----------------------------------------------- */
.foot { border-top: 1px solid var(--line); margin-top: 44px; padding: 20px; font-size: 12px; color: var(--faint); max-width: 100ch; }
.foot p { margin: 0 0 8px; }
.foot b { color: var(--muted); font-weight: 500; }

@media (max-width: 700px) {

  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="eyebrow">Ixana · patentgen · prototype</span>
        <h1>AI Lawyer — patent drafting run</h1>
      </div>
      <span class="chip goodish"><span class="dot good"></span>Gate&nbsp;0 <b>enforced</b></span>
      <span class="chip" id="chip-corpus"></span>
      <span class="chip" id="chip-cost"></span>
    </div>
    <nav class="viewbar" id="viewbar" aria-label="Views"></nav>

<script>
/* ============================================================
   DATA
   ------------------------------------------------------------
   Two things are true of everything below and the footer says so
   again at the bottom of the page:

   1. The MECHANISM is the prototype's. The four publication
      states and their rationales, the fail-closed containment
      gate, the stage sequence and its measured timings, the
      three-critic ring with a reviser between rounds, the
      coverage verdict that leads the prior-art section, the
      §1.84 proof against the rendered sheet, and the filable
      verdict are all reproduced as built.

   2. The SPECIMEN is invented. The disclosure, the sources, the
      people, the run identifiers, the claims, the references and
      the costs are made up for publication. No real disclosure,
      filing or attorney work product appears anywhere on this
      page.

   The one exception is the corpus measurement in the "Corpus
   ceiling" view, which is the real ADR 002 result over public
   patent data — it is the finding the case study turns on, and
   inventing it would have made the page argue nothing.
   ============================================================ */

/* -- Publication states, served verbatim from the enum ------
   In the prototype these strings come from GET /api/intake/statuses,
   which reads them straight off patentgen/gates/intake.py. The UI
   must never hold its own copy: a duplicate would drift from the
   source of truth while continuing to look authoritative. Here they
   are quoted rather than paraphrased, for the same reason. */
const STATUSES = [
  {
    value: 'unknown',
    label: 'unknown',
    mayProcess: false,
    foreignLost: false,
    needsDate: false,
    rationale: 'Publication status has not been established. Nothing may be transmitted until a human decides.',
  },
  {
    value: 'unpublished_internal',
    label: 'unpublished · internal',
    mayProcess: true,
    foreignLost: false,
    needsDate: false,
    rationale: 'Not disclosed outside the company. All jurisdictions remain available. Provider confidentiality terms still govern which model may be used.',
  },
  {
    value: 'published_us_grace_foreign_lost',
    label: 'published · US grace',
    mayProcess: true,
    foreignLost: true,
    needsDate: true,
    rationale: 'Published within the 35 U.S.C. 102(b)(1) grace period. A US filing remains available. Absolute-novelty jurisdictions (EPO, India) are already lost — draft US-only and record the loss rather than drafting for jurisdictions that are gone.',
  },
  {
    value: 'published_us_barred',
    label: 'published · US barred',
    mayProcess: false,
    foreignLost: true,
    needsDate: true,
    rationale: "Published more than one year before the intended filing date. The inventor's own publication is a statutory bar under 35 U.S.C. 102(b)(1). Requires a named-attorney override.",
  },
];
const statusInfo = (v) => STATUSES.find((s) => s.value === v);
const US_GRACE_PERIOD_DAYS = 365;

/* patentgen/gates/intake.py::classify — advisory only. A human confirms or
   overrides it, and what gets stored is their choice, never a value
   recomputed later against a filing date that has since moved. */
function classify(publicationDate, filingDate) {

/* -- Cost and provenance ------------------------------------
   Three invariants from the prototype are visible in this table and are the
   reason it exists at all:

   1. Token counters are nested totals, not disjoint buckets. `input`
      includes `cached` and `cache write`; `output` includes `reasoning`.
      A formula that adds them up double-bills and nothing raises.
   2. Cache TTL differs by model and a wrong value is a silent no-op.
   3. Output cost dominates input cost — the inverse of the usual RAG
      intuition — because output bills at six times the input rate and
      hidden reasoning tokens bill at the output rate.

   Every dollar figure on this page is computed from these rows at render
   time. Nothing is a literal. */

function rowCost(r) {
  const rate = RATES[r.model];
  const uncached = r.input - r.cached;
  return (uncached * rate.in + r.cached * rate.cached + r.output * rate.out) / 1e6;
}
const ledgerTotal = (mode) => LEDGER[mode].reduce((n, r) => n + rowCost(r), 0);
const reasoningTotal = (mode) => LEDGER[mode].reduce((n, r) => n + r.reason, 0);
const outputShare = (mode) => {
  let out = 0, all = 0;
  for (const r of LEDGER[mode]) {
    const rate = RATES[r.model];
    const o = (r.output * rate.out) / 1e6;
    out += o; all += rowCost(r);
  }
  return all ? out / all : 0;
};

function readURL() {
  const p = new URLSearchParams(location.search);
  const v = p.get('view');
  if (v && VIEWS.some((x) => x.id === v)) S.view = v;
  const src = p.get('src');
  if (src && SOURCES.some((x) => x.id === src)) S.src = src;
  const tab = p.get('tab');
  if (tab) S.tab = tab;
  const c = p.get('corpus');
  if (c === 'wide' || c === 'narrow') S.corpus = c;
  const st = p.get('status');
  if (st && statusInfo(st)) {
    S.intake.status = st;
    const info = statusInfo(st);
    if (info.needsDate && !S.intake.pub) S.intake.pub = st === 'published_us_barred' ? '2024-11-02' : '2026-07-01';
  }
  if (p.get('decided') === '0') S.decisions[S.src] = null;
  if (p.get('speed')) S.run.speed = Number(p.get('speed')) || 30;
  if (p.get('play') === '1') S.run.playing = true;
}

function writeURL() {
  const p = new URLSearchParams();
  p.set('view', S.view);
  if (S.view === 'intake' || S.view === 'sources') p.set('src', S.src);
  // An intake deep link has to survive a reload, or the case study's link
  // lands on a different screen the second time someone opens it.
  if (S.view === 'intake' && !S.decisions[S.src]) {
    p.set('status', S.intake.status);
    if (SOURCES.find((x) => x.id === S.src).decision) p.set('decided', '0');
  }
  if (S.view === 'result') p.set('tab', S.tab);
  if (S.corpus !== 'narrow') p.set('corpus', S.corpus);
  history.replaceState(null, '', location.pathname + '?' + p.toString());
}

function go(view, extra) {
  stopRun();
  S.view = view;
  if (extra) Object.assign(S, extra);
  render();
  document.getElementById('view').focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

    '<button data-go="' + v.id + '"' + (S.view === v.id ? ' aria-current="page"' : '') + '>' + v.label +
    (v.count ? '<span class="vb-count">' + v.count() + '</span>' : '') + '</button>').join('');

  const wide = S.corpus === 'wide';
  document.getElementById('chip-corpus').className = 'chip ' + (wide ? 'goodish' : 'critish');
  document.getElementById('chip-corpus').innerHTML =
    '<span class="dot ' + (wide ? 'good' : 'crit') + '"></span>Corpus: <b>' +
    (wide ? 'widened · ceiling 73.5%' : 'UI extract · ceiling 15.4%') + '</b>' +
    ' <button data-act="toggle-corpus">' + (wide ? 'revert' : 'widen') + '</button>';

  const total = ledgerTotal(S.corpus);
  document.getElementById('chip-cost').innerHTML = 'Run cost <b>' + usd(total) + '</b>';
}

/* ============================================================
   VIEW — SOURCES
   ============================================================ */
function viewSources() {
  const s = SOURCES.find((x) => x.id === S.src) || SOURCES[0];
  const d = S.decisions[s.id];

  const rows = SOURCES.map((x) => {
    const dx = S.decisions[x.id];
    const state = !dx ? badge('no decision', 'stop')
      : statusInfo(dx.status).mayProcess || dx.override ? badge(statusInfo(dx.status).label, 'good')
      : badge(statusInfo(dx.status).label, 'stop');
    return '<tr class="clickable' + (x.id === s.id ? ' selected' : '') + '" data-src="' + x.id + '">' +
      '<td><b style="color:var(--ink)">' + x.origin.split('/').pop() + '</b><br><span class="mono" style="font-size:11px;color:var(--faint)">' + x.sha.slice(0, 24) + '…</span></td>' +
      '<td class="num">' + x.pages + '</td><td class="num">' + x.sheets + '</td>' +
      '<td class="num">' + kb(x.size) + '</td>' +
      '<td>' + state + '</td></tr>';
  }).join('');

  return '<div class="stack">' +
    '<p class="lede">Three documents have been fetched and fingerprinted. <b>Nothing has left this process.</b> ' +
    'Acquisition hashes the bytes; inspection reads them locally. The gate that decides whether they may be transmitted is the next view — ' +
    'and it is a containment boundary, not a workflow step.</p>' +

    '<div class="tablewrap"><table><thead><tr>' +
    '<th>Source · sha256</th><th class="num">Pages</th><th class="num">Sheets</th><th class="num">Size</th><th>Intake decision</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' +

    '<h2 class="sec"><span class="n">02</span>Inspection — no network, no decision required</h2>' +
    '<div class="alert plain"><h3>' + s.title + '</h3>' +
    '<p>You cannot make an informed intake decision about a document you are not allowed to look at, so <code>inspect</code> is deliberately network-free. ' +
    'It is also the only step that costs nothing.</p></div>' +

    '<div class="panel panel-pad"><dl class="fields">' +
    '<div><dt>origin</dt><dd class="mono" style="font-size:12px">' + s.origin + '</dd></div>' +
    '<div><dt>sha256</dt><dd class="mono" style="font-size:11px;word-break:break-all">' + s.sha + '</dd></div>' +
    '<div><dt>content type</dt><dd class="mono">' + s.mime + '</dd></div>' +
    '<div><dt>retrieved</dt><dd class="mono">' + s.retrieved + '</dd></div>' +
    '<div><dt>pages</dt><dd>' + s.pages + '</dd></div>' +
    '<div><dt>text blocks</dt><dd>' + int(s.blocks) + '</dd></div>' +
    '<div><dt>characters</dt><dd>' + int(s.chars) + '</dd></div>' +
    '<div><dt>drawing sheets</dt><dd>' + s.sheets + '</dd></div>' +
    '</dl>' +
    '<p class="note" style="margin-top:14px">Content type is sniffed from the bytes, not from the extension. ' +
    'The store re-hashes on read, so the bytes drafted from are provably the bytes decided on.</p></div>' +

    (s.tables.length ? '<div class="panel panel-pad"><h3 class="sub">Tables preserved · ' + s.tables.length + '</h3>' +
      s.tables.map((t) => '<p class="note" style="margin:0 0 6px"><b>' + t.caption + '</b> — ' + t.headers.join(' · ') + ' · ' + t.rows + ' rows · p.' + t.page + '</p>').join('') +
      '</div>' : '') +

    (s.captions.length ? '<div class="panel panel-pad"><h3 class="sub">Figure captions found · ' + s.captions.length + '</h3>' +
      '<p class="mono" style="font-size:12px;color:var(--body);margin:0">' + s.captions.join(' · ') + '</p>' +
      '<p class="note" style="margin-top:10px">Drawing sheets are located by character count and sheet header, then read by one vision call each. ' +
      'The mechanism usually lives in the drawings rather than the prose, which is why this pass exists at all.</p></div>' : '') +

    '<div class="panel panel-pad"><h3 class="sub">Preview</h3><pre class="verbatim" style="margin-top:0">' + s.preview + '</pre></div>' +

    '<div class="btnrow">' +
    (d
      ? '<span class="badge ' + ((statusInfo(d.status).mayProcess || d.override) ? 'good' : 'stop') + '">decision on record · ' + statusInfo(d.status).label + '</span>' +
        '<button class="btn" data-go="intake" data-src="' + s.id + '">Open the gate for this source</button>'
      : '<button class="btn primary" data-go="intake" data-src="' + s.id + '">Record an intake decision →</button>') +

}

/* ============================================================
   VIEW — INTAKE GATE
   The one screen worth building first. The refusal has to be
   legible, not implied by a greyed-out button, and every
   rationale is the enum's own words.
   ============================================================ */
function viewIntake() {
  const s = SOURCES.find((x) => x.id === S.src) || SOURCES[0];
  const d = S.decisions[s.id];
  if (d) return intakeRecorded(s, d);

  const chosen = S.intake.status;
  const info = statusInfo(chosen);
  const suggested = S.intake.pub ? classify(S.intake.pub, S.intake.filing) : null;

  const opts = STATUSES.map((st) =>
    '<label class="opt' + (st.value === chosen ? ' chosen' : '') + '">' +
      '<span class="opt-head">' +
        '<input type="radio" name="status" value="' + st.value + '" data-act="pick-status"' + (st.value === chosen ? ' checked' : '') + '>' +
        '<span class="name">' + st.value + '</span>' +
        (st.mayProcess ? badge('proceeds', 'good') : badge('blocks', 'stop')) +
        (st.foreignLost ? badge('foreign rights lost', 'warn') : '') +
        (st.needsDate ? badge('needs a date') : '') +
      '</span>' +
      '<p class="opt-why">' + st.rationale + '</p>' +
    '</label>').join('');

  const canRecord = S.intake.by.trim().length > 0 &&
    (!info.needsDate || S.intake.pub) &&
    (info.mayProcess || S.intake.override.trim().length > 0);

  return '<div class="stack">' +
    '<div class="alert stop" role="alert">' +
      '<h3 class="mono">RUN REFUSED — no intake decision on record</h3>' +
      '<p>Nothing may be transmitted to a model or to BigQuery until a human answers one question: ' +
      '<b style="color:var(--ink)">is this document already public?</b></p>' +
      '<p>The gate is enforced at the call boundary inside the model client and the BigQuery client — not at the CLI, and not at client construction. ' +
      'Both clients memoise their SDK object, so a check placed at construction would fire once per process and every subsequent call would sail through. ' +
      'It would look present in review and enforce nothing at run time.</p>' +
      '<pre class="verbatim">' +
'ContainmentError: OpenAI completion (gpt-5.6-sol) was attempted for source\n' +
s.sha.slice(0, 12) + '... which has no intake decision on record.\n' +
'A human must decide the publication status before any material leaves this\n' +
'process. DecisionStore.decide(...) records it.' +
      '</pre>' +
    '</div>' +

    '<p class="lede"><b>' + s.title + '</b><br>' +
    '<span class="mono" style="font-size:11.5px;color:var(--faint)">' + s.sha + '</span></p>' +

    '<h2 class="sec"><span class="n">01</span>Four states, and two of them block</h2>' +
    '<p class="note">The question is not “is the document public?” but “what may the pipeline do with it?”. Those differ, and collapsing them into a boolean ' +
    'is how material gets transmitted before anyone has decided it should be — a publication thirteen months before filing and one thirteen days before filing ' +
    'are both “published”, and are not remotely the same situation.</p>' +
    '<div>' + opts + '</div>' +

    '<h2 class="sec"><span class="n">02</span>Record it</h2>' +
    '<div class="panel panel-pad">' +
      '<div class="grid2">' +
        '<div class="field"><label for="f-by">Decided by (required)</label>' +
        '<input id="f-by" data-act="field" data-k="by" value="' + S.intake.by + '" placeholder="Your name"></div>' +
        '<div class="field"><label for="f-pub">Publication date' + (info.needsDate ? ' (required)' : '') + '</label>' +
        '<input id="f-pub" type="date" data-act="field" data-k="pub" value="' + S.intake.pub + '"></div>' +
        '<div class="field"><label for="f-fil">Intended filing date</label>' +
        '<input id="f-fil" type="date" data-act="field" data-k="filing" value="' + S.intake.filing + '"></div>' +
        (info.mayProcess ? '' :
          '<div class="field"><label for="f-ov">Attorney override (required for a blocking status)</label>' +
          '<input id="f-ov" data-act="field" data-k="override" value="' + S.intake.override + '" placeholder="Named attorney"></div>') +
      '</div>' +

      (suggested ? '<div class="alert ' + (statusInfo(suggested).mayProcess ? 'plain' : 'warn') + '" style="margin-top:14px">' +
        '<h3>Classified from the dates as <span class="mono">' + suggested + '</span> — advisory only</h3>' +
        '<p>' + Math.round((new Date(S.intake.filing || '2026-08-30') - new Date(S.intake.pub)) / 86400000) +
        ' days between publication and the intended filing date, against a ' + US_GRACE_PERIOD_DAYS + '-day grace period. ' +
        'A human confirms or overrides this, and what gets stored is their choice — the pipeline must be able to prove what was decided at intake, ' +
        'not re-derive it later against a filing date that has since moved.</p></div>' : '') +

      (info.mayProcess ? '' :
        '<div class="alert stop" style="margin-top:14px"><h3>This status blocks</h3><p>' + info.rationale + '</p>' +
        '<p>Recording it is allowed. Running on it is not, unless a named attorney takes the decision — and the override is recorded against them.</p></div>') +

      '<div class="btnrow" style="margin-top:16px">' +
      '<button class="btn primary" data-act="record"' + (canRecord ? '' : ' disabled') + '>Record this decision</button>' +
      '<span class="note" style="margin:0">' +
      (canRecord ? 'Recording is free. Only starting a run spends money.'
        : (!S.intake.by.trim() ? 'A name is required — a decision nobody signed is not a decision.'
          : (info.needsDate && !S.intake.pub) ? 'A published status asserts the document is public. Without the date the status is unverifiable.'
          : 'A blocking status needs a named attorney before it can be recorded as an override.')) +
      '</span></div>' +
    '</div>' +

    '<div class="alert plain"><h3>Try the two that matter</h3>' +
    '<p>Pick <span class="mono">published_us_barred</span> and record it: the run button does not appear — it is <b>absent</b>, not greyed out, because a disabled control ' +
    'invites you to look for the way around it. Then pick <span class="mono">unpublished_internal</span> and it appears.</p></div>' +
    '</div>';
}

function intakeRecorded(s, d) {
  const info = statusInfo(d.status);
  const permits = info.mayProcess || !!d.override;
  return '<div class="stack">' +
    '<div class="alert ' + (permits ? 'ok' : 'stop') + '">' +
      '<h3>' + (permits ? 'Decision on record — processing permitted' : 'Decision on record — processing blocked') + '</h3>' +
      '<p>' + info.rationale + '</p>' +
      (d.override ? '<p><b>Overridden by ' + d.override + '.</b> The override is itself auditable, and travels with every artefact this run produces.</p>' : '') +
    '</div>' +

    '<div class="panel panel-pad"><dl class="fields">' +
    '<div><dt>source</dt><dd style="font-size:12.5px">' + s.origin.split('/').pop() + '</dd></div>' +
    '<div><dt>status</dt><dd class="mono" style="font-size:12.5px">' + d.status + '</dd></div>' +
    '<div><dt>decided by</dt><dd>' + d.by + '</dd></div>' +
    '<div><dt>decided at</dt><dd class="mono" style="font-size:12px">' + (d.at || '2026-08-26T08:41:07Z') + '</dd></div>' +
    (d.pub ? '<div><dt>published</dt><dd class="mono">' + d.pub + '</dd></div>' : '') +
    (d.filing ? '<div><dt>intended filing</dt><dd class="mono">' + d.filing + '</dd></div>' : '') +
    '<div><dt>foreign rights</dt><dd>' + (info.foreignLost ? '<span style="color:var(--warn)">already lost</span>' : 'available') + '</dd></div>' +
    '<div><dt>permits processing</dt><dd>' + (permits ? '<span style="color:var(--good)">yes</span>' : '<span style="color:var(--crit)">no</span>') + '</dd></div>' +
    '</dl>' +
    '<p class="note" style="margin-top:14px">Keyed to the content hash, not the path: editing the document produces different bytes, and a decision made about the old text does not carry over. ' +
    'A draft built from several documents is exactly as cleared as its least-cleared member — the gate ANDs the clearances rather than trusting the first one.</p></div>' +

    (permits
      ? '<div class="btnrow"><button class="btn primary" data-go="run">Start the run</button>' +
        '<span class="note" style="margin:0">≈ ' + mmss(TOTAL_SECONDS) + ' and ' + usd(ledgerTotal('narrow')) + '. This is the only step that spends money.</span></div>'
      : '<div class="alert plain"><h3>There is no run button here</h3>' +
        '<p>Not a disabled one — none. A greyed-out control tells you the thing exists and you are not allowed to have it, which is an invitation to find the way around. ' +
        'A named attorney can record an override, and that is a different act with a different name attached to it.</p></div>') +

    '<div class="btnrow"><button class="btn small" data-act="reset-decision" data-src="' + s.id + '">Clear this decision and try another status</button></div>' +
    '</div>';
}

/* ============================================================
   VIEW — THE RUN
   Seven stages with durations measured from real runs, four
   phases inside the longest one, and the artifacts appearing as
   they are written. The alternative is an indeterminate spinner
   for five minutes, which tells a user nothing except that
   something might be wrong.
   ============================================================ */
const RUN_START = 9 * 3600 + 14 * 60 + 12;
function clockAt(sec) {
  const t = RUN_START + Math.round(sec);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

const STAGE_START = (() => {
  let acc = 0; const out = {};
  for (const s of STAGES) { out[s.id] = acc; acc += s.typical; }
  return out;
})();

const ARTIFACTS_AT = [
  { at: 5, name: 'extracted.txt', size: '82,566 chars' },
  { at: 43, name: 'source_figures.md', size: '19,204 chars' },
  { at: 90, name: 'extracted_disclosure.json', size: '24,118 chars' },
  { at: 90, name: 'gaps.md', size: '4,806 chars' },
  { at: 289, name: 'claims.json', size: '16,402 chars' },
  { at: 289, name: 'claims.txt', size: '9,713 chars' },
  { at: 289, name: 'critique.json', size: '3,144 chars' },
  { at: 289, name: 'critique.md', size: '2,588 chars' },
  { at: 289, name: 'specification.json', size: '31,880 chars' },
  { at: 289, name: 'abstract.txt', size: '902 chars' },
  { at: 289, name: 'prior_art.json', size: '2,410 chars' },
  { at: 289, name: 'prior_art.md', size: '812 chars' },
  { at: 310, name: 'figures.json', size: '8,911 chars' },
  { at: 310, name: 'numerals.json', size: '1,690 chars' },
  { at: 310, name: 'drawings.pdf', size: '3 sheets' },
  { at: 312, name: 'package/*.docx', size: '3 files' },
  { at: 312, name: 'application.pdf', size: 'review copy' },
  { at: 312, name: 'manifest.json', size: 'final' },
];

const EVENTS = [
  { at: 90, ev: 'concepts', label: 'Extracting search concepts' },
  { at: 101, ev: 'retrieval', label: 'Searching the corpus' },
  { at: 114, ev: 'rerank', label: 'Ranking prior art', extra: () => 'candidates ' + RETRIEVAL[S.corpus].judged },
  { at: 136, ev: 'claims', label: 'Drafting claims', extra: () => 'prior_art ' + RETRIEVAL[S.corpus].refs.filter((r) => r.inArt).length },
  { at: 208, ev: 'critics', label: 'Critic round 1', extra: () => 'claims ' + visibleClaims().length },
  { at: 255, ev: 'specification', label: 'Writing the specification', extra: () => 'claims ' + visibleClaims().length },
];

function stopRun() {
  if (S.run.timer) { clearInterval(S.run.timer); S.run.timer = null; }
  S.run.playing = false;
}

function startRun() {
  stopRun();
  if (S.run.done) { S.run.t = 0; S.run.done = false; }
  S.run.playing = true;
  const step = 0.1;
  S.run.timer = setInterval(() => {
    S.run.t += step * S.run.speed;
    if (S.run.t >= TOTAL_SECONDS) {
      S.run.t = TOTAL_SECONDS;
      S.run.done = true;
      stopRun();
      render();
      return;
    }
    paintRun();
  }, step * 1000);
  render();
}

function currentStage() {
  let id = STAGES[0].id;
  for (const s of STAGES) if (S.run.t >= STAGE_START[s.id]) id = s.id;
  return id;
}

function viewRun() {
  return '<div class="stack">' +
    '<p class="lede">The run is on disk from the first stage, so closing the tab is safe — this page is a reader over a directory, not a session. ' +
    'A local <code>readdir</code> is sub-millisecond and keeps working while the backend is saturated by a five-minute run, which is exactly when you want to browse a previous one.</p>' +
    (S.corpus === 'wide'
      ? '<p class="note">This plays the run against the <b>shipped</b> corpus: ' + mmss(TOTAL_SECONDS) + ' and ' + usd(ledgerTotal('narrow')) + '. ' +
        'On the widened corpus the same disclosure takes ' + mmss(468) + ' and ' + usd(ledgerTotal('wide')) + ', because the critic ring runs a third round and the claim chart gets built.</p>'
      : '') +
    '<div class="btnrow">' +
      '<button class="btn primary" data-act="run-toggle">' + (S.run.playing ? 'Pause' : S.run.done ? 'Run it again' : S.run.t > 0 ? 'Resume' : 'Start the run') + '</button>' +
      '<button class="btn small" data-act="run-speed" data-v="1"' + (S.run.speed === 1 ? ' aria-pressed="true"' : '') + '>1×</button>' +
      '<button class="btn small" data-act="run-speed" data-v="30"' + (S.run.speed === 30 ? ' aria-pressed="true"' : '') + '>30×</button>' +
      '<button class="btn small" data-act="run-speed" data-v="120"' + (S.run.speed === 120 ? ' aria-pressed="true"' : '') + '>120×</button>' +
      '<button class="btn small" data-act="run-skip">Skip to the result</button>' +
      '<span class="note" style="margin:0">Real elapsed time ' + mmss(TOTAL_SECONDS) + '. Playing at ' + S.run.speed + '×.</span>' +
    '</div>' +
    '<div id="run-body"></div></div>';
}

function paintRun() {
  const host = document.getElementById('run-body');
  if (!host) return;
  const t = S.run.t;
  const cur = currentStage();
  const curIdx = STAGES.findIndex((s) => s.id === cur);
  const frac = Math.min(1, t / TOTAL_SECONDS);

  const stageRows = STAGES.map((s, i) => {
    const started = t >= STAGE_START[s.id];
    const done = i < curIdx || S.run.done;
    const active = i === curIdx && !S.run.done;
    let sub = '';
    if (s.id === 'drafting' && started) {
      const rel = t - STAGE_START.drafting;
      sub = '<ul class="substages">' + SUBSTAGES.map((ss, j) => {
        const next = SUBSTAGES[j + 1];
        const sdone = next ? rel >= next.at : rel >= s.typical;
        const sactive = rel >= ss.at && !sdone;
        return '<li class="' + (sdone ? 'done' : sactive ? 'active' : '') + '">' +
          '<span class="mono" style="font-size:10.5px">' + (sdone ? '✓' : sactive ? '▸' : '·') + '</span>' + ss.label + '</li>';
      }).join('') + '</ul>';
    }
    return '<div class="stage ' + (done ? 'done' : active ? 'active' : '') + '">' +
      '<span class="mark">' + (done ? '✓' : active ? '▸' : '') + '</span>' +
      '<span><span class="label">' + s.label + '</span>' + sub + '</span>' +
      '<span class="t">' + (started ? '+' + Math.round(Math.min(t, STAGE_START[s.id] + s.typical)) + 's' : s.typical ? '~' + s.typical + 's' : '') + '</span>' +
    '</div>';
  }).join('');

  const written = ARTIFACTS_AT.filter((a) => t >= a.at);
  const evs = EVENTS.filter((e) => t >= e.at);

  host.innerHTML =
    '<div class="panel panel-pad">' +
      '<div class="badgerow" style="margin-bottom:12px">' +
        (S.run.done ? badge('drafted', 'good') : badge('running', 'accent')) +
        badge('internal') +
        '<span class="mono" style="font-size:11.5px;color:var(--faint)">20260826T091412Z-4f1c8ad2</span>' +
        '<span class="mono" style="margin-left:auto;font-size:12px;color:var(--ink)">' + mmss(t) + ' / ' + mmss(TOTAL_SECONDS) + '</span>' +
      '</div>' +
      '<div class="bar"><i style="width:' + (frac * 100).toFixed(1) + '%"></i></div>' +
      '<div style="margin-top:14px">' + stageRows + '</div>' +
      (t >= 90 && !S.run.done ? '<p class="note" style="margin-top:12px"><b>The gap list is already on disk.</b> It appears at +90 seconds and stays on screen while claims are still drafting — it is produced whether or not a draft follows, so it is not held back to arrive with one.</p>' : '') +
    '</div>' +

    '<div class="grid2" style="margin-top:14px">' +
      '<div class="panel panel-pad"><h3 class="sub">Events</h3>' +
        (evs.length ? '<div class="eventlog">' + evs.map((e) =>
          '<div><span class="ts">' + clockAt(e.at) + '</span> <b>' + e.ev + '</b> — ' + e.label +
          (e.extra ? ' <span class="ts">· ' + e.extra() + '</span>' : '') + '</div>').join('') + '</div>'
          : '<p class="note">Nothing yet.</p>') +
      '</div>' +
      '<div class="panel panel-pad"><h3 class="sub">Artifacts written · ' + written.length + ' of ' + ARTIFACTS_AT.length + '</h3>' +
        (written.length ? '<div class="eventlog">' + written.slice().reverse().map((a) =>
          '<div><span class="ts">+' + a.at + 's</span> <b>' + a.name + '</b> <span class="ts">' + a.size + '</span></div>').join('') + '</div>'
          : '<p class="note">Nothing yet.</p>') +
      '</div>' +
    '</div>' +

    (S.run.done ? '<div class="alert ok" style="margin-top:14px"><h3>Done — ' + mmss(TOTAL_SECONDS) + ', ' + usd(ledgerTotal('narrow')) + '</h3>' +
      '<p>The pipeline ran to completion. What it produced is attorney-review material, not a filing — used that way it is worth five minutes; used as a filing it is a liability.</p>' +
      '<p><button class="btn primary" data-go="result">Open the result</button></p></div>' : '');
}

/* ============================================================
   VIEW — THE RESULT
   ============================================================ */
function visibleClaims() {
  return CLAIMS.filter((c) => !c.wideOnly || S.corpus === 'wide');
}

const RESULT_TABS = [

/* -- tab: claims ------------------------------------------- */
function tabClaims() {
  const cl = visibleClaims();
  const ind = cl.filter((c) => c.kind === 'independent');
  const wide = S.corpus === 'wide';
  const qs = CLAIMSET.openQuestions[S.corpus];

  /* The reviser's §103 amendments are carried inline and marked, so the claim
     set reads as one document either way rather than as two variants. */
  const wideText = (t) => wide
    ? t.replace(/<span data-wide>/g, '<mark>').replace(/<\/span>/g, '</mark>')
    : t.replace(/<span data-wide>[\s\S]*?<\/span>/g, '');

  const rendered = cl.map((c) => {
    const els = c.els.map((e) =>
      '<li><span class="el">' + e.l + '</span> ' + wideText(e.t) + '</li>').join('');
    const head = '<div class="claim-head"><span class="n">' + c.n + '.</span>' +
      '<span class="preamble">' + c.preamble + '</span>' +
      badge(c.cat) + (c.dep ? badge('← ' + c.dep) : '') + (c.wideOnly ? badge('added under §103', 'warn') : '') +
      '</div>';
    // A dependent claim is one sentence continuing its parent — "The device of
    // claim 1, wherein ...". Printing a transitional phrase and a lettered list
    // over a single clause is how a generated claim set announces itself.
    if (c.kind === 'dependent') {
      return '<li class="claim">' + head +
        '<p style="margin:5px 0 0 24px;font-size:13px;line-height:1.62">' +
        c.els.map((e) => wideText(e.t)).join(' ') + '</p></li>';
    }
    return '<li class="claim">' + head +
      '<p class="trans">' + c.trans + ':</p><ul>' + els + '</ul></li>';
  }).join('');

  return '<div class="stack">' +
    '<p class="note">' + ind.length + ' independent · ' + (cl.length - ind.length) + ' dependent · Alice risk ' +
    '<span style="color:var(--good)">' + CLAIMSET.aliceRisk + '</span>' +
    (wide ? ' · <span style="color:var(--accent)">highlighted text was added by the reviser after the widened corpus produced a §103 finding</span>' : '') + '</p>' +

    (wide ? '' : '<div class="alert stop"><h3>Read the coverage verdict before reading these claims</h3>' +
      '<p>No reference retrieved in this run is in this disclosure’s art. Nothing below has been differentiated over anything, and the critics’ verdict on it means nothing. ' +
      'The claims read well. That is the failure mode, not evidence against it.</p></div>') +

    '<ol style="list-style:none;padding:0;margin:0">' + rendered + '</ol>' +

    '<div class="panel panel-pad"><h3 class="sub">Strategy</h3><p class="note" style="margin:0">' + CLAIMSET.strategy + '</p></div>' +

    '<div class="alert warn"><h3>Flagged for the attorney · ' + qs.length + '</h3>' +
    '<ul style="margin:8px 0 0;padding-left:18px">' + qs.map((q) => '<li style="font-size:12.5px;margin-bottom:6px">' + q + '</li>').join('') + '</ul></div>' +
    '</div>';
}

/* -- tab: prior art ----------------------------------------
   Led by whether the search was worth anything.

   The coverage verdict is an alert rather than a stat because it
   invalidates the sections around it. `absent` means the corpus does not
   contain this disclosure's art, so the references are not prior art
   against these claims and neither the critic ring's verdict nor the
   claim chart carries a novelty conclusion — a distinction that is
   invisible in a well-formatted reference list, which is exactly why it
   gets its own banner. */
function tabPriorArt() {
  const r = RETRIEVAL[S.corpus];
  const covered = r.coverage === 'covered';

  const refRows = r.refs.map((x) =>
    '<tr>' +
      '<td><span class="mono" style="font-size:11.5px;color:' + (x.closest ? 'var(--accent)' : 'var(--body)') + '">' + x.id + '</span>' +
      (x.closest ? ' ' + badge('closest', 'accent') : '') + (x.inArt ? ' ' + badge('in art', 'good') : ' ' + badge('off art', 'stop')) +
      '<br><b style="color:var(--ink)">' + x.title + '</b></td>' +
      '<td><span class="mono" style="font-size:11px">' + x.cpc + '</span><br><span style="color:var(--faint)">' + x.assignee + ' · ' + x.date + '</span></td>' +
      '<td style="max-width:34ch">' + x.why + '</td>' +
    '</tr>').join('');

  const chart = covered
    ? '<h2 class="sec"><span class="n">03</span>Claim chart — claim 1 against ' + CHART.closest + '</h2>' +
      '<p class="note">The broadest claim, limitation by limitation, against the closest reference. ' +
      '<b>“Taught elsewhere” is the column that matters:</b> a limitation supplied by a second reference in the same subclass is a §103 position, not a distinction.</p>' +
      '<div class="tablewrap"><table><thead><tr><th>El.</th><th>Limitation</th><th>Verdict</th><th>Where</th><th>Note</th></tr></thead><tbody>' +
      CHART.rows.map((row) => {
        const cls = row.verdict === 'not taught' ? 'good' : row.verdict === 'elsewhere' ? 'warn' : 'stop';
        const lbl = row.verdict === 'elsewhere' ? 'taught elsewhere' : row.verdict;
        return '<tr><td class="mono">' + row.el + '</td><td style="max-width:32ch;color:var(--body)">' + row.lim + '</td>' +
          '<td>' + badge(lbl, cls) + '</td><td class="mono" style="font-size:11px">' + row.where + '</td>' +
          '<td style="max-width:32ch">' + row.note + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="grid2" style="margin-top:14px">' +
        '<div class="panel panel-pad"><h3 class="sub">Risk on this record</h3>' +
        '<p class="note" style="margin:0">§102 anticipation <b style="color:var(--good)">' + CHART.anticipation + '</b> · ' +
        '§103 obviousness <b style="color:var(--crit)">' + CHART.obviousness + '</b> · ' +
        CHART.distinguishing + ' distinguishing feature found</p>' +
        '<p class="note" style="margin-top:8px">The single distinguishing feature is the sub-eight-millisecond wake bound. Everything else in claim 1 is taught by the record, ' +
        'which is why the reviser moved the bound to the point of novelty rather than leaving it in a dependent claim.</p></div>' +
        '<div class="panel panel-pad"><h3 class="sub">What changed when the corpus widened</h3>' +
        '<p class="note" style="margin:0">Claims went from 14 to 15, claim 1 gained a limitation, the critic ring ran three rounds instead of two and stopped ' +
        '<b>exhausted</b> rather than <b>clean</b>, and the run cost ' + usd(ledgerTotal('wide') - ledgerTotal('narrow')) + ' more. ' +
        'The disclosure did not change. Only the search did.</p></div>' +
      '</div>'
    : '<h2 class="sec"><span class="n">03</span>Claim chart</h2>' +
      '<div class="alert plain"><h3>Not built</h3>' +
      '<p>No retrieved reference is in this disclosure’s art, so there is no closest reference to chart. This is a corpus coverage problem, not evidence of novelty. ' +
      'Charting the closest document in the wrong art would produce a confident novelty position resting on nothing, so the chart is refused rather than rendered empty.</p></div>';

  return '<div class="stack">' +
    '<div class="alert ' + (covered ? 'ok' : 'stop') + '" role="alert">' +
      '<h3>Corpus coverage: ' + r.coverage + ' — ' + r.inArt + ' of ' + r.judged + ' candidates in this art</h3>' +
      (covered
        ? '<p>At least three references are in the disclosure’s art. Novelty reasoning here rests on a search that looked in the right place — still subject to the 73.5% ceiling of the widened extract.</p>'
        : '<p>None of the ' + r.judged + ' candidates judged is in this disclosure’s art. <b>The references below are not prior art against these claims and no novelty conclusion may be drawn from them.</b> ' +
          'Retrieval outside the corpus’s net does not return nothing — it returns the least irrelevant documents it holds, formatted exactly like real results, and everything downstream reasons from them.</p>') +
      '<p>Field read as: ' + r.field + '</p>' +
    '</div>' +

    (covered ? '' : '<div class="alert warn"><h3>This is what a silent failure looks like</h3>' +
      '<p>On a real run of this shape the simulated examiner reported every claim allowable — over touch-interface art. Correct reasoning, worthless conclusion. ' +
      'Nothing in the output looked wrong, which is why the verdict is computed and banner-ed rather than left for an attorney to notice. ' +
      '<button class="btn small" data-act="toggle-corpus">Widen the corpus and watch this page change</button></p></div>') +

    '<h2 class="sec"><span class="n">02</span>References of record · ' + r.refs.length + ' shown of ' + r.judged + ' judged</h2>' +
    '<p class="note">Candidates come from lexical search — CPC hints <b>boost, never filter</b>, because a wrong hint must not empty the result set — widened by citation expansion: ' +
    'the references a seed patent itself cites are a shortlist a human examiner already assembled for a neighbouring invention. ' +
    'Ranking is done by a model against the disclosure rather than by term overlap, and each reference carries its own one-line rationale.</p>' +
    '<div class="tablewrap"><table><thead><tr><th>Reference</th><th>Classification · origin</th><th>Why it came back</th></tr></thead><tbody>' + refRows + '</tbody></table></div>' +
    '<p class="note" style="margin-top:8px"><b>Reference identifiers, titles, assignees and dates on this page are invented for publication</b> and do not correspond to real publications. ' +
    'The retrieval behaviour, the coverage verdict and the chart structure are the real ones.</p>' +

    chart +
    '</div>';
}

/* -- tab: claim review ------------------------------------- */
function tabReview() {
  const rev = REVIEW[S.corpus];
  const stopTone = rev.stop === 'clean' ? 'good' : 'warn';
  const outstanding = rev.rounds[rev.rounds.length - 1].critics.reduce((n, c) => n + c.findings.length, 0);

  const rounds = rev.rounds.map((rd) =>
    '<div class="round">' +
      '<div class="round-head"><h4>Round ' + rd.n + '</h4>' +
      rd.critics.map((c) => badge(c.name.replace('simulated first office action', 'examiner') + ' · ' + (c.allow ? 'would allow' : 'would reject'), c.allow ? 'good' : 'stop')).join('') +
      '</div>' +
      '<div class="critics">' + rd.critics.map((c) =>
        '<div class="critic"><h5>' + c.name + (c.allowable ? '<span style="color:var(--faint)">allowable: ' + c.allowable + '</span>' : '') + '</h5>' +
        '<p>' + c.assessment + '</p>' +
        c.findings.map((f) =>
          '<div class="finding"><span class="fh">' + f.ground + ' · ' + f.severity + ' · claims ' + f.claims + '</span>' +
          '<p class="lim">' + f.lim + '</p><p class="why">' + f.why + '</p>' +
          '<p class="why" style="color:var(--body)"><b>Proposed:</b> ' + f.fix + '</p></div>').join('') +
        '</div>').join('') +
      '</div>' +
      (rd.amendments.length
        ? '<div class="reviser"><h3 class="sub" style="margin:0">The reviser answered</h3><ul>' + rd.amendments.map((a) => '<li>' + a + '</li>').join('') + '</ul></div>'
        : '<div class="reviser"><p class="note" style="margin:0">No amendment. ' +
          (rd.n === rev.rounds.length ? 'The round limit ran out with findings standing.' : 'Nothing forced one.') + '</p></div>') +
    '</div>').join('');

  return '<div class="stack">' +
    '<p class="lede">Three critics attack the claims <b>concurrently and blind to each other</b> — a novelty critic against the retrieved record, a §112 critic against the disclosure, ' +
    'and a simulated first office action — and a reviser answers them between rounds. Blind matters: a novelty critic that can see the §112 findings starts negotiating with them.</p>' +

    '<div class="alert ' + (rev.stop === 'clean' ? 'ok' : 'warn') + '">' +
      '<h3>Stopped: ' + rev.stop + ' after ' + rev.rounds.length + ' round' + (rev.rounds.length > 1 ? 's' : '') + '</h3>' +
      (rev.stop === 'clean'
        ? '<p>No critic could still fault the final claim set. Note what this does <b>not</b> mean on the current corpus: the novelty critic allowed the claims because nothing in the record was in the right art.</p>'
        : '<p><b>' + outstanding + ' finding still standing when the cap ran out.</b> Three rounds ending <span class="mono">exhausted</span> and three rounds ending <span class="mono">clean</span> are opposite outcomes and the round count is identical — ' +
          'which is why the headline is the stop reason and never “3 rounds”. What is unresolved is what the attorney is being handed, named.</p>') +
    '</div>' +

    rounds +

    '<div class="alert plain"><h3>The reviser is allowed to refuse</h3>' +
    '<p>' + (S.corpus === 'wide'
      ? 'In round 2 it declined to pull the suspension limitation up into the independent claims and recorded why: the disclosure supports it for one embodiment only, and surrendering scope before the inventor has answered question 2 in the gap list is a decision an attorney should make, not a loop. That refusal is why this run ends <span class="mono">exhausted</span>.'
      : 'A reviser that always concedes converges quickly on claims nobody would file. Its refusals are recorded with their reasons, and an unresolved finding is reported rather than absorbed. On the widened corpus this run ends <span class="mono">exhausted</span> for exactly that reason.') + '</p></div>' +
    '</div>';
}

  const body = rows.map((r) => {

      '<td class="mono" style="font-size:11.5px">' + r.model + '</td>' +
      '<td class="num">' + r.calls + '</td>' +
      '<td class="num">' + int(r.input) + (r.cached ? '<br><span style="color:var(--faint);font-size:11px">' + int(r.cached) + ' cached</span>' : '') +
        (r.write ? '<br><span style="color:var(--faint);font-size:11px">' + int(r.write) + ' cache write</span>' : '') + '</td>' +
      '<td class="num">' + int(r.output) + (r.reason ? '<br><span style="color:var(--faint);font-size:11px">' + int(r.reason) + ' reasoning</span>' : '') + '</td>' +
      '<td class="num">' + (r.calls ? usd4(c) : '—') + '</td></tr>';
  }).join('');

  return '<div class="stack">' +
    '<p class="lede">Every model call carries its own cost record, attached at the call rather than reconciled from an invoice. ' +
    'Cost per disclosure is the number that decides whether this beats outside counsel, and a monthly bill cannot answer that question for one document.</p>' +

    '<div class="tiles">' +
      '<div class="tile"><div class="v">' + usd(total) + '</div><div class="l">This run, computed from the rows below</div></div>' +
      '<div class="tile"><div class="v">' + pct(share, 0) + '</div><div class="l">Of that spent on output tokens</div></div>' +
      '<div class="tile"><div class="v">' + int(reasoning) + '</div><div class="l">Hidden reasoning tokens, billed at the output rate</div></div>' +
      '<div class="tile"><div class="v">' + usd(total / GAPS.claimable) + '</div><div class="l">Per claimable concept carried into the draft</div></div>' +
    '</div>' +

    '<div class="tablewrap"><table><thead><tr>' +
    '<th>Agent</th><th>Model</th><th class="num">Calls</th><th class="num">Input</th><th class="num">Output</th><th class="num">Cost</th>' +
    '</tr></thead><tbody>' + body + '</tbody>' +
    '<tfoot><tr><td colspan="3">Total</td>' +
    '<td class="num">' + int(rows.reduce((n, r) => n + r.input, 0)) + '</td>' +
    '<td class="num">' + int(rows.reduce((n, r) => n + r.output, 0)) + '</td>' +
    '<td class="num">' + usd(total) + '</td></tr></tfoot></table></div>' +

    '<h2 class="sec"><span class="n">02</span>Three invariants this table exists to make visible</h2>' +
    '<div class="grid2">' +
      '<div class="panel panel-pad"><h3 class="sub">1 · Counters are nested, not disjoint</h3>' +
      '<p class="note" style="margin:0"><code>input</code> already includes <code>cached</code> and <code>cache write</code>; <code>output</code> already includes <code>reasoning</code>. ' +
      'A formula that adds them up double-bills and nothing raises — it just inflates every forecast. The usage type asserts the nesting rather than trusting it, so a provider-side change surfaces immediately instead of silently.</p></div>' +

      '<div class="panel panel-pad"><h3 class="sub">2 · Cache TTL differs by model, and a wrong value is a silent no-op</h3>' +
      '<p class="note" style="margin:0">' + Object.entries(RATES).map(([m, r]) => '<code>' + m + '</code> accepts only <code>' + r.ttl + '</code>').join('; ') + '. ' +
      'Passing the wrong one is dropped upstream and you pay for a cold prefix believing it was warm, so the cache-parameter builder raises rather than sending it.</p></div>' +

      '<div class="panel panel-pad"><h3 class="sub">3 · Output cost dominates input cost</h3>' +
      '<p class="note" style="margin:0">The inverse of the usual retrieval intuition. Output bills at six times the input rate and reasoning tokens bill at the output rate, so ' + pct(share, 0) + ' of this run is output. ' +
      'Cost levers in order: model choice for output-heavy agents, reasoning effort, the critic-loop cap, and only then input caching.</p></div>' +

      '<div class="panel panel-pad"><h3 class="sub">Provenance is attached at creation</h3>' +
      '<p class="note" style="margin:0">Every model-touching function records its run on success, on refusal <em>and</em> on exception. A trace that only records successes looks complete while missing the step that failed. ' +
      'This is also the one thing here that genuinely cannot be retrofitted: you cannot attach provenance to artefacts that already exist.</p></div>' +
    '</div>' +
    '</div>';
}
