<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Product Planning OS</title>
<meta name="description" content="Interactive demo of the AI product planning operating system: pause-on-doubt intake, section selection from a 30-section master template, a planner reviewed by a different model against a 10-point scorecard, a frozen approved plan, and one task whose every step carries a completion test.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
</head>
<body>
<!-- ARTIFACT-BODY-START -->
<style>
/* ============================================================
   AI product planning OS - interactive demo.
   Tier-B native sibling of the XANA design system: warm
   brown-black ground (#0E0805 / #1A1410 / #3A3028), a single
   #FF6321 accent with the #CD3D00 -> #FF6321 gradient reserved
   for primary actions and hero numbers, Geist / Geist Mono,
   13px workhorse type, bordered-not-shadowed rounded-xl cards,
   quiet 200ms motion on the ease-out-expo curve.
   Single dark theme; every colour painted explicitly.
   ============================================================ */
:root {
  color-scheme: dark;
  --bg: #0E0805;
  --surface: #1A1410;
  --surface-2: #221A14;
  --surface-3: #2A2420;
  --surface-deep: #140F0B;
  --line: #3A3028;
  --line-soft: #2A2018;
  --line-hover: #5A4838;
  --ink: #FFFFFF;
  --body: #C0B6AC;
  --prose: #E8E0D8;
  --muted: #A89888;
  --faint: #8A7E72;
  --accent: #FF6321;
  --accent-soft: #FF8A56;
  --accent-dim: rgba(255, 99, 33, 0.38);
  --accent-wash: rgba(255, 99, 33, 0.09);
  --grad: linear-gradient(90deg, #CD3D00, #FF6321);
  --good: #22C55E;
  --good-dim: rgba(34, 197, 94, 0.38);
  --good-wash: rgba(34, 197, 94, 0.09);
  --warn: #F59E0B;
  --warn-dim: rgba(245, 158, 11, 0.4);
  --warn-wash: rgba(245, 158, 11, 0.09);
  --crit: #EF4444;
  --crit-dim: rgba(239, 68, 68, 0.42);
  --crit-wash: rgba(239, 68, 68, 0.09);
  --sans: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --dur: 200ms;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --rail: 264px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--body);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: rgba(255, 99, 33, 0.32); color: #fff; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
select, input, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* -- App chrome ------------------------------------------- */
.app {
  min-height: 100vh;
  max-width: 1340px;
  margin: 0 auto;
  border-left: 1px solid var(--line-soft);
  border-right: 1px solid var(--line-soft);
  display: flex;
  flex-direction: column;
}

.topbar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(14, 8, 5, 0.78);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line-soft);
}
.topbar-row { display: flex; align-items: center; gap: 10px; padding: 12px 20px; flex-wrap: wrap; }
.mark {
  width: 34px; height: 34px; flex: none; border-radius: 10px;
  background: linear-gradient(135deg, #CD3D00, #FF6321);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(255, 99, 33, 0.16);
}
.mark svg { width: 15px; height: 15px; display: block; }
.brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
.brand .eyebrow {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--faint);
}
.brand h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.25px; color: var(--ink); }

.chip {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 5px 12px;
  font-size: 11px; font-family: var(--mono); color: var(--body); white-space: nowrap;
}
.chip b { color: var(--ink); font-weight: 500; }
.chip.state-ruo { border-color: var(--warn-dim); color: var(--warn); background: var(--warn-wash); }
.chip.state-ok { border-color: var(--good-dim); color: var(--good); background: var(--good-wash); }
.chip.state-bad { border-color: var(--crit-dim); color: var(--crit); background: var(--crit-wash); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.good { background: var(--good); }
.dot.warn { background: var(--warn); }
.dot.crit { background: var(--crit); }
.dot.accent { background: var(--accent); }

/* -- Layout ----------------------------------------------- */
.shell { display: flex; align-items: stretch; flex: 1; min-height: 0; }

/* The pipeline rail is the spine: numbered stage nodes joined
   by a vertical thread, the active stage lit on the gradient. */
.rail {
  width: var(--rail); flex: none;
  border-right: 1px solid var(--line-soft);
  padding: 20px 0 40px;
  background: var(--bg);
}
.rail-group { padding: 0 0 18px; }
.rail-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--faint);
  padding: 0 20px 12px;
}
.rail-item {
  position: relative;
  display: flex; align-items: flex-start; gap: 12px; width: 100%;
  padding: 9px 18px 9px 20px; border: 0; background: transparent; text-align: left;
  color: var(--muted); font-size: 13px; line-height: 1.35;
  transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.rail-item::before, .rail-item::after {
  content: ""; position: absolute; left: 31.5px; width: 1px; background: var(--line-soft);
}
.rail-item::before { top: 0; height: 9px; }
.rail-item::after { top: 33px; bottom: 0; }
.rail-group .rail-item:first-of-type::before { display: none; }
.rail-group .rail-item:last-of-type::after { display: none; }
.rail-item .n {
  position: relative; z-index: 1;
  display: inline-flex; align-items: center; justify-content: center;
  flex: none; width: 24px; height: 24px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
  font-family: var(--mono); font-size: 10px; color: var(--faint);
  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.rail-item:hover { color: var(--ink); background: rgba(255, 255, 255, 0.02); }
.rail-item:hover .n { border-color: var(--line-hover); color: var(--body); }
.rail-item[aria-current="true"] { color: var(--ink); font-weight: 500; }
.rail-item[aria-current="true"] .n {
  background: linear-gradient(135deg, #CD3D00, #FF6321);
  border-color: transparent; color: #fff; font-weight: 600;
  box-shadow: 0 4px 12px rgba(255, 99, 33, 0.25);
}
.rail-item .sub { display: block; font-size: 11px; color: var(--faint); font-weight: 400; margin-top: 1px; }
.rail-item[aria-current="true"] .sub { color: var(--muted); }
.rail-item .tick { margin-left: auto; align-self: center; font-size: 11px; color: var(--good); flex: none; }
.rail-note {
  margin: 6px 20px 0; padding: 12px 13px;
  border: 1px solid var(--line-soft); border-radius: 12px; background: var(--surface-deep);
  font-size: 11.5px; line-height: 1.55; color: var(--faint);
}
.rail-note b { color: var(--muted); font-weight: 500; }

.pane { flex: 1; min-width: 0; padding: 26px 30px 72px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.pane.enter { animation: rise 0.32s var(--ease) both; }

/* -- Headings + shared blocks ----------------------------- */
.pane-head { margin-bottom: 20px; }
.pane-head .kicker {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent-soft); margin-bottom: 7px;
}
.pane-head h2 { margin: 0 0 8px; font-size: 24px; font-weight: 600; color: var(--ink); letter-spacing: -0.5px; line-height: 1.2; }
.pane-head p { margin: 0; max-width: 76ch; font-size: 13px; line-height: 1.6; color: var(--body); }

.card {
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); padding: 17px 19px; margin-bottom: 16px;
  overflow-x: auto;
  transition: border-color var(--dur) var(--ease);
}
.card > h3 {
  margin: 0 0 3px; font-size: 13.5px; font-weight: 600; color: var(--ink); letter-spacing: -0.1px;
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
}
.card > .sub { margin: 0 0 13px; font-size: 12px; color: var(--muted); max-width: 84ch; line-height: 1.55; }
.card.tight { padding: 13px 15px; }
.card.frozen { border-color: var(--good-dim); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.grid2 > .card { margin-bottom: 0; }
.grid2.wide { grid-template-columns: 1.35fr 1fr; }
@media (max-width: 1080px) { .grid2, .grid2.wide { grid-template-columns: 1fr; } }

.badge {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
  border-radius: 999px; padding: 2.5px 8px; border: 1px solid var(--line);
  color: var(--muted); background: var(--surface-2); white-space: nowrap;
}
.badge.rule { border-color: var(--accent-dim); color: var(--accent-soft); background: var(--accent-wash); }
.badge.good { border-color: var(--good-dim); color: var(--good); background: var(--good-wash); }
.badge.warn { border-color: var(--warn-dim); color: var(--warn); background: var(--warn-wash); }
.badge.crit { border-color: var(--crit-dim); color: var(--crit); background: var(--crit-wash); }

.note {
  border-left: 2px solid var(--line); padding: 2px 0 2px 13px;
  font-size: 12px; line-height: 1.6; color: var(--muted); max-width: 90ch;
}
.note.warn { border-left-color: var(--warn-dim); color: var(--warn); }
.note.good { border-left-color: var(--good-dim); }
.note.crit { border-left-color: var(--crit-dim); color: var(--crit); }
.note.accent { border-left-color: var(--accent-dim); }
.note + .note { margin-top: 9px; }

.btn {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; padding: 6px 13px; font-size: 12.5px; color: var(--body);
  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease),
              background-color var(--dur) var(--ease), filter var(--dur) var(--ease);
}
.btn:hover { border-color: var(--accent-dim); color: var(--ink); background: var(--surface-2); }
.btn.primary {
  background: linear-gradient(90deg, #CD3D00, #FF6321);
  border-color: transparent; color: #fff; font-weight: 600;
}
.btn.primary:hover { filter: brightness(1.1); color: #fff; }
.btn.good { background: var(--good); border-color: var(--good); color: #06120A; font-weight: 600; }
.btn.good:hover { filter: brightness(1.08); color: #06120A; }
.btn.sm { padding: 3px 10px; font-size: 11.5px; }
.btn[aria-pressed="true"] { border-color: var(--accent-dim); background: var(--accent-wash); color: var(--ink); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--line); color: var(--body); background: var(--surface); }

/* Round switcher: the top-bar underline grammar, relocated. */
.tab {
  border: 0; background: transparent; padding: 6px 2px 9px;
  font-size: 13px; font-weight: 600; letter-spacing: -0.1px;
  color: var(--faint); position: relative;
  transition: color var(--dur) var(--ease);
}
.tab:hover { color: var(--ink); }
.tab[aria-pressed="true"] { color: var(--ink); }
.tab[aria-pressed="true"]::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 2px;
  height: 2px; border-radius: 1px; background: var(--accent);
}

.toolrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.toolrow .spacer { margin-left: auto; }
.sel {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px;
  padding: 5px 8px; font-size: 12px; font-family: var(--mono); color: var(--ink);
  transition: border-color var(--dur) var(--ease);
}
.sel:hover { border-color: var(--line-hover); }
.sel option { background: #1A1410; color: #E8E0D8; }

/* -- Tables ----------------------------------------------- */
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th {
  text-align: left; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--faint); font-weight: 500;
  padding: 0 10px 7px 0; border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.t td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.num, table.t th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.t td.k { font-family: var(--mono); font-size: 12px; color: var(--ink); white-space: nowrap; }
table.t tr.excluded td { opacity: 0.45; }

/* -- Classification --------------------------------------- */
.cls-row {
  display: grid; grid-template-columns: 92px 1fr auto; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid var(--line-soft); align-items: baseline;
}
.cls-row:last-child { border-bottom: 0; }
.cls-tag {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
  border-radius: 999px; padding: 2.5px 8px; border: 1px solid var(--line); text-align: center;
}
.cls-tag.fact { border-color: var(--good-dim); color: var(--good); background: var(--good-wash); }
.cls-tag.assumption { border-color: var(--warn-dim); color: var(--warn); background: var(--warn-wash); }
.cls-tag.unknown { border-color: var(--crit-dim); color: var(--crit); background: var(--crit-wash); }
.cls-src { font-family: var(--mono); font-size: 10.5px; color: var(--faint); text-align: right; }
.cls-row .it { color: var(--body); }
.cls-row.resolved .it { color: var(--prose); }

/* -- Question card ---------------------------------------- */
.qcard {
  border: 1px solid var(--accent-dim); background: var(--surface-deep);
  border-radius: 16px; padding: 18px 20px; margin-bottom: 16px;
}
.qcard .qmeta {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent-soft); margin-bottom: 8px;
}
.qcard .qq { font-size: 16px; color: var(--ink); font-weight: 500; margin: 0 0 7px; line-height: 1.45; letter-spacing: -0.2px; }
.qcard .qw { font-size: 12.5px; color: var(--body); margin: 0 0 13px; max-width: 84ch; line-height: 1.6; }
.qcard .qa {
  border-left: 2px solid var(--accent-dim); padding: 4px 0 4px 13px;
  font-size: 12.5px; color: var(--body); margin-bottom: 13px; line-height: 1.6;
}
.qlog { display: flex; flex-direction: column; gap: 2px; }
.qlog-row {
  display: grid; grid-template-columns: 24px 1fr auto; gap: 10px;
  padding: 7px 0; border-bottom: 1px solid var(--line-soft); align-items: baseline;
}
.qlog-row:last-child { border-bottom: 0; }
.qlog-row .pri { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.qlog-row .qt { font-size: 12.5px; color: var(--body); line-height: 1.55; }
.qlog-row .qt b { color: var(--ink); font-weight: 500; }
.qlog-row .qs { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
.qlog-row .qs.answered { color: var(--good); }
.qlog-row .qs.skipped { color: var(--crit); }
.qlog-row .qs.pending { color: var(--accent-soft); }

/* -- Section pills ---------------------------------------- */
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  font-family: var(--mono); font-size: 11px; border-radius: 999px; padding: 3.5px 10px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
}
.pill.sel { border-color: var(--accent-dim); background: var(--accent-wash); color: var(--prose); padding: 3.5px 10px; }
.pill.exc { border-color: var(--warn-dim); color: var(--warn); background: var(--warn-wash); }
.pill.na { opacity: 0.5; }

/* -- Model pairing hero ----------------------------------- */
.pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
.pair-tile {
  display: flex; flex-direction: column; gap: 8px;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface-deep); padding: 13px 14px;
}
.pair-role {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent-soft);
}
.pair-note { font-size: 11px; color: var(--faint); line-height: 1.5; }
.pair-tile .sel { width: 100%; }
.pair-link {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; padding: 0 8px; color: var(--good);
}
.pair-link svg { width: 26px; height: 26px; }
.pair-link span { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; }
.pair-link.bad { color: var(--crit); }
@media (max-width: 640px) {
  .pair { grid-template-columns: 1fr; }
  .pair-link { flex-direction: row; padding: 2px 0; }
}

/* -- The refusal: SameModelError as a designed moment ------ */
.refusal {
  border: 1px solid var(--crit-dim); border-radius: 16px;
  background: var(--surface-deep); margin-bottom: 16px; overflow: hidden;
}
@keyframes pulse-crit {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  50% { box-shadow: 0 4px 24px rgba(239, 68, 68, 0.16); }
}
@media (prefers-reduced-motion: no-preference) {
  .refusal { animation: pulse-crit 2.6s ease-in-out infinite; }
}
.refusal-head {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 18px; background: var(--crit-wash);
  border-bottom: 1px solid var(--crit-dim);
}
.refusal-glyph {
  width: 30px; height: 30px; flex: none; border-radius: 999px;
  border: 1px solid var(--crit-dim); color: var(--crit);
  display: flex; align-items: center; justify-content: center;
}
.refusal-name { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--crit); letter-spacing: -0.1px; }
.refusal-src { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-top: 2px; }
.refusal-body { padding: 16px 18px; }
.refusal-msg {
  margin: 0 0 10px; font-family: var(--mono); font-size: 12.5px;
  line-height: 1.65; color: var(--prose); max-width: 86ch;
}
.refusal-why { margin: 0 0 14px; font-size: 12.5px; color: var(--body); max-width: 86ch; line-height: 1.6; }
.refusal-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 13px; }
.refusal-stat { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px 14px; }
.refusal-stat .rv {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 24px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.15;
}
.refusal-stat .rv small { font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.refusal-stat.one .rv { color: var(--crit); }
.refusal-stat.two .rv { color: var(--good); }
.refusal-stat .rl { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }
.refusal-cite { margin: 0; font-size: 11.5px; color: var(--faint); max-width: 90ch; line-height: 1.6; }
@media (max-width: 640px) { .refusal-stats { grid-template-columns: 1fr; } }

/* -- Scorecard -------------------------------------------- */
.scorebar {
  display: flex; height: 6px; border-radius: 999px; overflow: hidden;
  margin-bottom: 12px; background: var(--surface-3);
}
.scorebar i { display: block; height: 100%; }
.scorebar i.pass { background: var(--good); }
.scorebar i.partial { background: var(--warn); }
.scorebar i.fail { background: var(--crit); }

.sc-row {
  display: grid; grid-template-columns: 1fr auto; gap: 12px;
  padding: 9px 0; border-bottom: 1px solid var(--line-soft);
}
.sc-row:last-child { border-bottom: 0; }
.sc-name { font-family: var(--mono); font-size: 12px; color: var(--ink); }
.sc-fb { font-size: 12px; color: var(--muted); margin-top: 4px; max-width: 84ch; line-height: 1.55; }
.sc-btns { display: flex; gap: 4px; align-items: flex-start; }
.sc-btn {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
  border-radius: 999px; padding: 3px 9px;
  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease),
              background-color var(--dur) var(--ease);
}
.sc-btn:hover { border-color: var(--line-hover); color: var(--body); }
.sc-btn[aria-pressed="true"].pass { border-color: var(--good-dim); color: var(--good); background: var(--good-wash); }

<script>
/* ============================================================
   AI product planning OS - interactive demo.

   The rules below are ported from the product's own source:
   lib/prd/master-template.ts, lib/agents/scoring.ts,
   lib/agents/deps.ts, lib/diff.ts, lib/llm/config.ts and
   lib/agents/agent5.ts. Every gate decision, score total, diff,
   dependency verdict and day estimate on this page is computed
   by that logic when the screen renders.

   The model *output* - the pre-mortem, the questions, the plan
   prose, the reviewer's objections, the checklist - is a
   recorded run of an invented brief. Those are the parts a
   language model wrote; a browser cannot re-derive them. What
   it can re-derive, and does, is every decision the system
   makes about them. That is the part the case study argues
   about, so that is the part left computable.
   ============================================================ */

/* ------------------------------------------------------------
   1. MASTER PRD TEMPLATE  (lib/prd/master-template.ts)
      Exactly 30 sections. Agent 2 selects from this menu.
   ------------------------------------------------------------ */
var PROJECT_TYPES = ['software_web', 'software_mobile', 'software_infra', 'hardware', 'mixed', 'research', 'process', 'content'];
var ALL = PROJECT_TYPES.slice();
function allExcept() {
  var drop = Array.prototype.slice.call(arguments);
  return ALL.filter(function (t) { return drop.indexOf(t) === -1; });
}

var MASTER_PRD_SECTIONS = [
  { id: 'exec_summary', name: 'Executive Summary', appliesTo: ALL },
  { id: 'problem_statement', name: 'Problem Statement', appliesTo: ALL },
  { id: 'goals_objectives', name: 'Goals & Objectives', appliesTo: ALL },
  { id: 'target_users', name: 'Target Users & Personas', appliesTo: ['software_web', 'software_mobile', 'content'] },
  { id: 'user_stories', name: 'User Stories / Use Cases', appliesTo: ['software_web', 'software_mobile'] },
  { id: 'functional_req', name: 'Functional Requirements', appliesTo: ['software_web', 'software_mobile', 'software_infra', 'hardware', 'mixed'] },
  { id: 'non_functional_req', name: 'Non-Functional Requirements', appliesTo: ['software_web', 'software_mobile', 'software_infra', 'mixed'] },
  { id: 'system_arch', name: 'System Architecture', appliesTo: ['software_web', 'software_mobile', 'software_infra', 'mixed'] },
  { id: 'data_model', name: 'Data Model', appliesTo: ['software_web', 'software_mobile', 'software_infra'] },
  { id: 'api_design', name: 'API Design', appliesTo: ['software_web', 'software_infra'] },
  { id: 'ui_ux', name: 'UI/UX Design Notes', appliesTo: ['software_web', 'software_mobile', 'content'] },
  { id: 'hardware_spec', name: 'Hardware Specification', appliesTo: ['hardware', 'mixed'] },
  { id: 'firmware_embedded', name: 'Firmware / Embedded Software', appliesTo: ['hardware', 'mixed'] },
  { id: 'infra_deploy', name: 'Infrastructure & Deployment', appliesTo: ['software_web', 'software_infra', 'mixed'] },
  { id: 'security', name: 'Security & Compliance', appliesTo: ['software_web', 'software_mobile', 'software_infra', 'mixed'] },
  { id: 'testing_strategy', name: 'Testing & Validation Strategy', appliesTo: allExcept('content', 'process') },
  { id: 'risk_mitigation', name: 'Risk Analysis & Mitigation', appliesTo: ALL },
  { id: 'timeline_milestones', name: 'Timeline & Milestones', appliesTo: ALL },
  { id: 'success_metrics', name: 'Success Metrics', appliesTo: ALL },
  { id: 'dependencies_ext', name: 'External Dependencies', appliesTo: ALL },
  { id: 'assumptions_log', name: 'Assumptions Log', appliesTo: ALL },
  { id: 'stakeholders', name: 'Stakeholders & Communication', appliesTo: allExcept('research') },
  { id: 'budget_resources', name: 'Budget & Resources', appliesTo: ALL },
  { id: 'research_methodology', name: 'Research Methodology', appliesTo: ['research'] },
  { id: 'data_pipeline', name: 'Data Pipeline', appliesTo: ['research', 'software_infra'] },
  { id: 'ml_model_spec', name: 'ML Model Specification', appliesTo: ['research'] },
  { id: 'process_design', name: 'Process Design', appliesTo: ['process'] },
  { id: 'content_plan', name: 'Content Plan', appliesTo: ['content'] },
  { id: 'out_of_scope', name: 'Out of Scope', appliesTo: ALL },
  { id: 'future_roadmap', name: 'Future Roadmap', appliesTo: ALL }
];

var SECTION_IDS = MASTER_PRD_SECTIONS.map(function (s) { return s.id; });
var SECTION_BY_ID = {};
MASTER_PRD_SECTIONS.forEach(function (s) { SECTION_BY_ID[s.id] = s; });
function sectionName(id) { return (SECTION_BY_ID[id] || {}).name || id; }
function sectionsForType(type) {
  return MASTER_PRD_SECTIONS.filter(function (s) { return s.appliesTo.indexOf(type) !== -1; })
    .map(function (s) { return s.id; });
}

/* ------------------------------------------------------------
   2. MODEL PAIRING  (lib/llm/config.ts)

   The product's central guarantee. Agent 3 (planner) and Agent 4
   (reviewer) must resolve to different models or the "independent
   second opinion" is worth nothing. Enforced in code, not left
   as configuration, because configuration gets changed for cost
   on a bad week - which is section 05 of the case study.
   ------------------------------------------------------------ */
var MODEL_CHOICES = [
  { ref: 'anthropic:claude-opus-4-8', label: 'claude-opus-4-8', family: 'anthropic', tier: 'strong' },
  { ref: 'anthropic:claude-sonnet-5', label: 'claude-sonnet-5', family: 'anthropic', tier: 'mid' },
  { ref: 'openai:gpt-4o', label: 'gpt-4o', family: 'openai', tier: 'mid' },
  { ref: 'openai:gpt-4o-mini', label: 'gpt-4o-mini', family: 'openai', tier: 'cheap' }
];
function modelLabel(ref) {
  for (var i = 0; i < MODEL_CHOICES.length; i++) if (MODEL_CHOICES[i].ref === ref) return MODEL_CHOICES[i].label;
  return ref;
}

function SameModelError(msg) { var e = new Error(msg); e.name = 'SameModelError'; return e; }

/** assertDistinctPlannerReviewer - throws when the pair collides. */
function assertDistinctPlannerReviewer(planner, reviewer) {
  if (planner === reviewer) {
    throw SameModelError(
      'Planner and Reviewer must differ, both resolved to ' + planner +
      '. Set PLANNER_MODEL / REVIEWER_MODEL to distinct models.'
    );
  }
}

/* ------------------------------------------------------------
   3. THE SCORING RULE  (lib/agents/scoring.ts)
      any fail -> reject; more than 3 partial -> reject; else approve.
   ------------------------------------------------------------ */
var REVIEW_CRITERIA = [
  'completeness', 'hallucination_check', 'requirement_gaps', 'stakeholder_gaps',
  'dependency_consistency', 'acceptance_criteria_quality', 'timeline_realism',
  'risk_coverage', 'assumption_validity', 'validation_strategy'
];
var MAX_PARTIALS = 3;

function InvalidScorecardError(msg) { var e = new Error(msg); e.name = 'InvalidScorecardError'; return e; }

function validateScorecard(scorecard) {
  if (!scorecard || scorecard.length === 0) throw InvalidScorecardError('scorecard is empty');
  var seen = {};
  for (var i = 0; i < scorecard.length; i++) {
    var item = scorecard[i];
    if (REVIEW_CRITERIA.indexOf(item.criterion) === -1) throw InvalidScorecardError('unknown criterion: ' + item.criterion);
    if (seen[item.criterion]) throw InvalidScorecardError('duplicate criterion: ' + item.criterion);
    seen[item.criterion] = true;
    if (['pass', 'partial', 'fail'].indexOf(item.score) === -1) throw InvalidScorecardError('invalid score: ' + item.score);
  }
  for (var c = 0; c < REVIEW_CRITERIA.length; c++) {
    if (!seen[REVIEW_CRITERIA[c]]) throw InvalidScorecardError('missing criterion: ' + REVIEW_CRITERIA[c]);
  }
}

function scoreReview(scorecard) {
  validateScorecard(scorecard);
  var fails = scorecard.filter(function (s) { return s.score === 'fail'; }).length;
  var partials = scorecard.filter(function (s) { return s.score === 'partial'; }).length;
  if (fails > 0) return 'rejected';
  if (partials > MAX_PARTIALS) return 'rejected';
  return 'approved';
}

/* ------------------------------------------------------------
   4. DEPENDENCY GRAPH  (lib/agents/deps.ts)
      Rejects unknown ids, self-dependency, duplicate ids,
      forward references and cycles. A disconnected DAG is fine.
   ------------------------------------------------------------ */
function validateTaskGraph(tasks) {
  var errors = [];
  var ids = {};
  tasks.forEach(function (t) {
    if (ids[t.task_id]) errors.push({ kind: 'duplicate_id', taskId: t.task_id });
    ids[t.task_id] = true;
  });
  var indexOfId = function (id) {
    for (var i = 0; i < tasks.length; i++) if (tasks[i].task_id === id) return i;
    return -1;
  };
  tasks.forEach(function (t) {
    t.dependencies.forEach(function (dep) {
      if (dep === t.task_id) errors.push({ kind: 'self_dependency', taskId: t.task_id });
      else if (!ids[dep]) errors.push({ kind: 'unknown_dependency', taskId: t.task_id, dependency: dep });
      else if (indexOfId(dep) > indexOfId(t.task_id)) errors.push({ kind: 'dependency_order', taskId: t.task_id, dependency: dep });
    });
  });

  var adj = {};
  tasks.forEach(function (t) {
    adj[t.task_id] = t.dependencies.filter(function (d) { return ids[d] && d !== t.task_id; });
  });
  var WHITE = 0, GRAY = 1, BLACK = 2;
  var color = {}, stack = [];
  Object.keys(ids).forEach(function (id) { color[id] = WHITE; });

  function visit(node) {
    color[node] = GRAY;
    stack.push(node);
    var next = adj[node] || [];
    for (var i = 0; i < next.length; i++) {
      if (color[next[i]] === GRAY) {
        var start = stack.indexOf(next[i]);
        errors.push({ kind: 'cycle', cycle: stack.slice(start).concat([next[i]]) });
        return true;
      }
      if (color[next[i]] === WHITE && visit(next[i])) return true;
    }
    stack.pop();
    color[node] = BLACK;
    return false;
  }
  var keys = Object.keys(ids);
  for (var k = 0; k < keys.length; k++) {
    if (color[keys[k]] === WHITE && visit(keys[k])) break;
  }
  return errors;
}
function isValidTaskGraph(tasks) { return validateTaskGraph(tasks).length === 0; }

function describeDepError(e) {
  if (e.kind === 'cycle') return 'cycle: ' + e.cycle.join(' → ');
  if (e.kind === 'unknown_dependency') return e.taskId + ' depends on ' + e.dependency + ', which does not exist';
  if (e.kind === 'self_dependency') return e.taskId + ' depends on itself';
  if (e.kind === 'duplicate_id') return 'duplicate id ' + e.taskId;
  if (e.kind === 'dependency_order') return e.taskId + ' depends on ' + e.dependency + ', which is listed after it';
  return e.kind;
}

/* ------------------------------------------------------------
   5. LINE DIFF  (lib/diff.ts) - LCS, section statuses
   ------------------------------------------------------------ */
function diffLines(a, b) {
  var A = a.split('\n'), B = b.split('\n'), n = A.length, m = B.length;
  var dp = [];
  for (var i = 0; i <= n; i++) dp.push(new Array(m + 1).fill(0));
  for (var i2 = n - 1; i2 >= 0; i2--) {
    for (var j2 = m - 1; j2 >= 0; j2--) {
      dp[i2][j2] = A[i2] === B[j2] ? dp[i2 + 1][j2 + 1] + 1 : Math.max(dp[i2 + 1][j2], dp[i2][j2 + 1]);
    }
  }
  var ops = [], i3 = 0, j3 = 0;
  while (i3 < n && j3 < m) {
    if (A[i3] === B[j3]) { ops.push({ type: 'same', text: A[i3] }); i3++; j3++; }
    else if (dp[i3 + 1][j3] >= dp[i3][j3 + 1]) { ops.push({ type: 'del', text: A[i3] }); i3++; }
    else { ops.push({ type: 'add', text: B[j3] }); j3++; }
  }
  while (i3 < n) ops.push({ type: 'del', text: A[i3++] });
  while (j3 < m) ops.push({ type: 'add', text: B[j3++] });
  return ops;
}

function diffPlans(p1, p2) {
  var map1 = {}, map2 = {};
  p1.sections.forEach(function (s) { map1[s.section_id] = s; });
  p2.sections.forEach(function (s) { map2[s.section_id] = s; });
  var out = [];
  function count(lines) {
    return {
      added_lines: lines.filter(function (l) { return l.type === 'add'; }).length,
      removed_lines: lines.filter(function (l) { return l.type === 'del'; }).length
    };
  }
  p2.sections.forEach(function (s2) {
    var s1 = map1[s2.section_id];
    if (!s1) {
      var la = s2.content.split('\n').map(function (t) { return { type: 'add', text: t }; });
      out.push(Object.assign({ section_id: s2.section_id, title: s2.title, status: 'added', lines: la }, count(la)));
    } else if (s1.content === s2.content) {
      out.push({ section_id: s2.section_id, title: s2.title, status: 'unchanged', lines: [], added_lines: 0, removed_lines: 0 });
    } else {
      var lc = diffLines(s1.content, s2.content);
      out.push(Object.assign({ section_id: s2.section_id, title: s2.title, status: 'changed', lines: lc }, count(lc)));
    }
  });
  p1.sections.forEach(function (s1) {
    if (!map2[s1.section_id]) {
      var ld = s1.content.split('\n').map(function (t) { return { type: 'del', text: t }; });
      out.push(Object.assign({ section_id: s1.section_id, title: s1.title, status: 'removed', lines: ld }, count(ld)));
    }
  });
  return {
    v1: p1.version, v2: p2.version, sections: out,
    changed_count: out.filter(function (s) { return s.status !== 'unchanged'; }).length
  };
}

/* ------------------------------------------------------------
   6. ESTIMATES  (lib/agents/schemas.ts + agent5.ts)

   Item days are snapped to 0.5. The task total is DERIVED as the
   snapped sum, never asked from the model - so "total = sum of
   steps" cannot drift. Items over 1.5 days must show their
   arithmetic rather than assert a number.
   ------------------------------------------------------------ */
var CYCLE_EVIDENCE_THRESHOLD = 1.5;
function snapDays(d) { return Math.max(0.5, Math.round(d * 2) / 2); }
function deriveTotalDays(items) {
  return Math.round(items.reduce(function (s, i) { return s + i.days; }, 0) * 2) / 2;
}
function estimateEvidenceMissing(items) {
  return items.filter(function (i) { return i.days > CYCLE_EVIDENCE_THRESHOLD && !i.estimate_basis; });
}

/* ------------------------------------------------------------
   7. WRITE OWNERSHIP  (lib/memory/types.ts, enforced in the store)
      Which actor may write which memory key.
   ------------------------------------------------------------ */
var WRITE_OWNERS = {
  agent_1: ['context_validation', 'intake', 'decisions'],
  agent_2: ['scope', 'decisions'],

  if (!state.scores) return base;
  return base.map(function (c) {
    return { criterion: c.criterion, score: state.scores[c.criterion] || c.score, feedback: c.feedback };
  });
}
function scorecardEdited() {
  if (!state.scores) return false;
  var base = REVIEWS[state.round - 1].scorecard;
  return base.some(function (c) { return state.scores[c.criterion] && state.scores[c.criterion] !== c.score; });
}

function modelsCollide() { return state.planner === state.reviewer; }

/* ------------------------------------------------------------
   15. INTAKE
   ------------------------------------------------------------ */
function liveClassification() {
  return CLASSIFICATION.map(function (c) {
    if (c.category !== 'unknown' || !c.resolvedBy) return { item: c.item, category: c.category, source: c.source, resolved: false };
    var st = state.qStatus[c.resolvedBy];
    if (st === 'answered' && c.resolved) {
      return { item: c.item, category: 'fact', source: 'clarification · ' + c.resolvedBy, resolved: true, answer: c.resolved };
    }
    return { item: c.item, category: 'unknown', source: st === 'skipped' ? 'skipped at ' + c.resolvedBy : c.source, resolved: false };
  });
}
function countBy(list, cat) { return list.filter(function (c) { return c.category === cat; }).length; }

function classificationHTML(list) {
  return list.map(function (c) {
    return '<div class="cls-row' + (c.resolved ? ' resolved' : '') + '">' +
      '<span class="cls-tag ' + c.category + '">' + c.category + '</span>' +
      '<span class="it">' + esc(c.item) +
      (c.answer ? '<br><span style="color:var(--muted);font-size:12px">→ ' + esc(c.answer) + '</span>' : '') +
      '</span>' +
      '<span class="cls-src">' + esc(c.source) + '</span></div>';
  }).join('');
}

function viewIntake() {
  var list = liveClassification();
  var h = '<div class="pane-head"><div class="kicker">01 &middot; Intake</div>' +
    '<h2>Every input classified before anything is written</h2>' +
    '<p>The first agent reads the brief and sorts every statement in it into fact, assumption or unknown, each with the field it came from. ' +
    'Twenty-four audited plans failed because the model filled gaps silently; this screen is the opposite behaviour, and it is the only place the rest of the run can get its facts.</p></div>';

  h += '<div class="grid2 wide" style="margin-bottom:16px">';
  h += '<div class="card"><h3>The brief <span class="badge warn">invented</span></h3>' +
    '<p class="sub">Structured intake, as a person filled it in. Nothing here was written by a model.</p>' +
    '<table class="t"><tbody>' +
    '<tr><td class="k" style="width:150px">Why / problem</td><td>' + esc(INTAKE.why) + '</td></tr>' +
    '<tr><td class="k">Deliverable</td><td>' + esc(INTAKE.deliverable) + '</td></tr>' +
    '<tr><td class="k">Estimate</td><td>' + INTAKE.task_days + ' working days, whole task</td></tr>' +
    '<tr><td class="k">Risk · tiger</td><td>' + esc(INTAKE.risks_tiger[0]) + '</td></tr>' +
    '<tr><td class="k">Risk · elephant</td><td>' + esc(INTAKE.risks_elephant[0]) + '</td></tr>' +
    '<tr><td class="k">Assumptions</td><td>' + INTAKE.assumptions.map(esc).join('<br>') + '</td></tr>' +
    '<tr><td class="k">Constraints</td><td>' + INTAKE.constraints.map(esc).join('<br>') + '</td></tr>' +
    '<tr><td class="k">Dependencies</td><td>' + INTAKE.dependencies.map(esc).join('<br>') + '</td></tr>' +
    '</tbody></table></div>';

  h += '<div class="card"><h3>Pre-mortem</h3>' +
    '<p class="sub">Written before the plan, not after. It is the only place in the run where the system is asked to imagine failing.</p>' +
    '<p style="font-size:13px;color:var(--body);margin:0">' + esc(PRE_MORTEM) + '</p></div>';
  h += '</div>';

  h += '<div class="card"><h3>Information classification ' +
    '<span class="badge good">' + countBy(list, 'fact') + ' fact</span>' +
    '<span class="badge warn">' + countBy(list, 'assumption') + ' assumption</span>' +
    '<span class="badge crit">' + countBy(list, 'unknown') + ' unknown</span></h3>' +
    '<p class="sub">Counts are derived from the rows below, and the rows change as clarifying questions are answered or skipped on the next screen. An unknown is never quietly promoted.</p>' +
    classificationHTML(list) + '</div>';

  var unknowns = countBy(list, 'unknown');
  h += '<p class="note ' + (unknowns ? 'crit' : 'good') + '">' +
    (unknowns
      ? unknowns + ' item' + (unknowns === 1 ? '' : 's') + ' still unknown. Anything left unknown here is rendered as an explicit gap in the plan rather than filled in — that is what the reviewer checks for, and what it caught on round one.'
      : 'Nothing unknown remains. Every fact in the plan traces to the brief or to a clarification answer.') + '</p>';
  return h;
}

/* ------------------------------------------------------------
   16. CLARIFICATION - pause on doubt
   ------------------------------------------------------------ */
function pendingQuestion() {
  for (var i = 0; i < QUESTIONS.length; i++) {
    if (!state.qStatus[QUESTIONS[i].id]) return QUESTIONS[i];
  }
  return null;
}
function askedCount() {
  return QUESTIONS.filter(function (q) { return state.qStatus[q.id] || q === pendingQuestion(); }).length;
}

var PRIORITY_LABEL = {
  1: 'priority 1 · required-field gap',
  2: 'priority 2 · hallucination risk',
  3: 'priority 3 · dependency or risk ambiguity',
  4: 'priority 4 · nice to have'
};

function viewClarify() {
  var q = pendingQuestion();
  var list = liveClassification();

  var h = '<div class="pane-head"><div class="kicker">02 &middot; Clarification</div>' +
    '<h2>One question, and the pipeline stops until you answer it</h2>' +
    '<p>The agent surfaces the single highest-priority doubt and blocks. Batching questions gets a form filled in badly; one at a time gets it answered. ' +
    'Priority runs required-field gap, then hallucination risk, then dependency or risk ambiguity, then nice-to-have — and the cap is ' + MAX_CLARIFYING_QUESTIONS +
    ' per round, after which the remainder are marked TBD rather than looping forever.</p></div>';

  h += '<div class="toolrow">' +
    '<span class="chip"><span class="dot ' + (q ? 'accent' : 'good') + '"></span>' +
    (q ? 'awaiting_answer' : 'context validated') + '</span>' +
    '<span class="chip">question <b>' + Math.min(askedCount(), QUESTIONS.length) + '</b> of cap ' + MAX_CLARIFYING_QUESTIONS + '</span>' +
    '<span class="spacer"></span>' +
    '<button class="btn sm" id="qReset">Restart from the first question</button></div>';

  if (q) {
    h += '<div class="qcard"><div class="qmeta">' + q.id + ' &middot; ' + PRIORITY_LABEL[q.priority] +
      (q.field ? ' &middot; field: ' + q.field : ' &middot; no single field') + '</div>' +
      '<p class="qq">' + esc(q.question) + '</p>' +
      '<p class="qw">' + esc(q.why) + '</p>' +
      '<div class="toolrow" style="margin:0">' +
      (q.answer
        ? '<button class="btn primary" data-answer="' + q.id + '">Answer as the run did</button>'
        : '<button class="btn" disabled title="no answer was ever supplied">Answer</button>') +
      '<button class="btn" data-skip="' + q.id + '">Skip</button>' +
      (q.answer ? '' : '<span class="chip state-ruo"><span class="dot warn"></span>no answer was ever given for this one</span>') +
      '</div>' +
      (q.answer ? '<div class="qa" style="margin-top:13px"><b style="color:var(--ink)">The answer this run got.</b> ' + esc(q.answer) + '</div>' : '') +
      '</div>';
  } else {
    h += '<div class="card frozen"><h3>Context validated <span class="badge good">ready to plan</span></h3>' +
      '<p class="sub">No doubt is outstanding. Whatever was skipped stays an unknown and travels into the plan as one.</p></div>';
  }

  h += '<div class="card"><h3>Question log</h3>' +
    '<p class="sub">In the order the agent chose, which is priority order rather than the order they occurred to it.</p><div class="qlog">';
  QUESTIONS.forEach(function (qq) {
    var st = state.qStatus[qq.id] || (qq === q ? 'pending' : 'not asked yet');
    h += '<div class="qlog-row"><span class="pri">P' + qq.priority + '</span>' +
      '<span class="qt"><b>' + qq.id + '.</b> ' + esc(qq.question) +
      (st === 'answered' ? '<br><span style="color:var(--muted);font-size:12px">→ ' + esc(qq.answer) + '</span>' : '') +
      (st === 'skipped' ? '<br><span style="color:var(--crit);font-size:12px">→ skipped; the item stays unknown</span>' : '') +
      '</span><span class="qs ' + (st === 'answered' ? 'answered' : st === 'skipped' ? 'skipped' : 'pending') + '">' + st + '</span></div>';
  });
  h += '</div></div>';

  h += '<div class="card"><h3>What that did to the classification ' +
    '<span class="badge good">' + countBy(list, 'fact') + ' fact</span>' +
    '<span class="badge warn">' + countBy(list, 'assumption') + ' assumption</span>' +
    '<span class="badge crit">' + countBy(list, 'unknown') + ' unknown</span></h3>' +
    '<p class="sub">The same rows as the intake screen, recomputed. An answer moves an item to fact and records where it came from; a skip leaves it exactly where it was.</p>' +
    classificationHTML(list) + '</div>';

  h += '<p class="note accent">Skip Q3 and the run continues with an unowned release channel — which is what actually happened, and what the reviewer caught the planner inventing an answer to. ' +
    'Answer it instead and the plan on the next screen no longer matches, because the plan below is the recorded output of the skipped path.</p>';
  return h;
}

/* ------------------------------------------------------------
   17. SCOPE
   ------------------------------------------------------------ */
function viewScope() {
  var applicable = sectionsForType(SCOPE.project_type);
  var excludedIds = SCOPE.excluded.map(function (e) { return e.section_id; });
  var notApplicable = SECTION_IDS.filter(function (id) { return applicable.indexOf(id) === -1; });

  var h = '<div class="pane-head"><div class="kicker">03 &middot; Scope</div>' +
    '<h2>Sixteen sections chosen from a menu of thirty</h2>' +
    '<p>A fixed master template means the plan cannot quietly drop a section nobody thought about, and an explicit exclusion with a reason means dropping one is a decision on the record rather than an omission. ' +
    'Project type and work scale are decided once here and persisted, so the planner, the reviewer and the task generator all read the same verdict instead of each re-inferring it.</p></div>';

  h += '<div class="toolrow">' +
    '<span class="chip">type <b>' + SCOPE.project_type + '</b></span>' +
    '<span class="chip">scale <b>' + SCOPE.work_scale + '</b></span>' +
    '<span class="chip">master template <b>' + SECTION_IDS.length + '</b> sections</span>' +
    '<span class="chip">applicable to this type <b>' + applicable.length + '</b></span>' +
    '</div>';

  h += '<div class="card"><h3>Why this scale</h3><p class="sub" style="margin:0">' + esc(SCOPE.rationale) + '</p></div>';

  h += '<div class="card"><h3>Selected <span class="badge rule">' + SCOPE.selected.length + '</span></h3>' +
    '<p class="sub">These are written by the planner and scored by the reviewer.</p><div class="pills">' +
    SCOPE.selected.map(function (id) { return '<span class="pill sel">' + esc(sectionName(id)) + '</span>'; }).join('') +
    '</div></div>';

  h += '<div class="card"><h3>Excluded, with a reason <span class="badge warn">' + SCOPE.excluded.length + '</span></h3>' +
    '<p class="sub">Applicable to this project type and deliberately left out. The reason is stored beside the exclusion, so a reader can disagree with it.</p>' +
    '<table class="t"><thead><tr><th>Section</th><th>Why it was dropped</th></tr></thead><tbody>' +
    SCOPE.excluded.map(function (e) {
      return '<tr><td class="k">' + esc(sectionName(e.section_id)) + '</td><td>' + esc(e.reason) + '</td></tr>';
    }).join('') + '</tbody></table></div>';

  h += '<div class="card"><h3>Not applicable to a ' + SCOPE.project_type + ' project <span class="badge">' + notApplicable.length + '</span></h3>' +
    '<p class="sub">Filtered by the template itself rather than by a judgement call — these never reached the agent as options.</p><div class="pills">' +
    notApplicable.map(function (id) { return '<span class="pill na">' + esc(sectionName(id)) + '</span>'; }).join('') +
    '</div></div>';

  var sum = SCOPE.selected.length + SCOPE.excluded.length + notApplicable.length;
  h += '<p class="note ' + (sum === SECTION_IDS.length ? 'good' : 'crit') + '">' +
    SCOPE.selected.length + ' selected + ' + SCOPE.excluded.length + ' excluded + ' + notApplicable.length +
    ' not applicable = <b>' + sum + '</b>, against ' + SECTION_IDS.length + ' in the master template. ' +
    (sum === SECTION_IDS.length ? 'Every section is accounted for; none was silently dropped.' : 'Sections are unaccounted for — the template and the scope disagree.') +
    '</p>';
  return h;
}

/* ------------------------------------------------------------
   18. PLAN AND REVIEW  -  the screen section 06 argues about
   ------------------------------------------------------------ */
function modelSelect(id, value) {
  return '<select class="sel" id="' + id + '">' + MODEL_CHOICES.map(function (m) {
    return '<option value="' + m.ref + '"' + (m.ref === value ? ' selected' : '') + '>' + m.label + '</option>';
  }).join('') + '</select>';
}

function planSectionsHTML(plan) {
  return plan.sections.map(function (s) {
    var body = esc(s.content).replace(/\[UNKNOWN\]/g, '<span class="tbd">UNKNOWN</span>');
    return '<div class="psec"><h4>' + esc(s.title) + '</h4><p class="pc">' + body + '</p></div>';
  }).join('');
}

function diffHTML(d) {
  var changed = d.sections.filter(function (s) { return s.status !== 'unchanged'; });
  var unchanged = d.sections.filter(function (s) { return s.status === 'unchanged'; });
  var h = '';
  changed.forEach(function (s) {
    var open = state.openSections[s.section_id] === true;
    h += '<div class="dsec"><button class="dhead" data-sec="' + s.section_id + '" style="width:100%;border:0;text-align:left">' +
      '<span class="badge ' + (s.status === 'added' ? 'good' : s.status === 'removed' ? 'crit' : 'warn') + '">' + s.status + '</span>' +
      esc(s.title) +
      '<span class="cnt">+' + s.added_lines + ' &minus;' + s.removed_lines + ' &middot; ' + (open ? 'hide' : 'show') + '</span></button>';
    if (open) {
      h += '<div class="dbody"><div class="diff">' + s.lines.map(function (l) {
        return '<div class="dl ' + l.type + '"><span class="sign">' +
          (l.type === 'add' ? '+' : l.type === 'del' ? '−' : ' ') + '</span><span>' + esc(l.text) + '</span></div>';
      }).join('') + '</div></div>';
    }
    h += '</div>';
  });
  if (unchanged.length) {
    h += '<p class="note" style="margin-top:11px"><b>' + unchanged.length + ' section' + (unchanged.length === 1 ? '' : 's') +
      ' byte-identical between the two versions</b> — ' + unchanged.map(function (s) { return esc(s.title); }).join(', ') +
      '. The revision touched only what the reviewer objected to, which is what makes a diff worth reading.</p>';
  }
  return h;
}

function viewReview() {
  var review = REVIEWS[state.round - 1];
  var plan = PLANS[review.plan_version - 1];
  var collide = modelsCollide();

  var h = '<div class="pane-head"><div class="kicker">04 &middot; Plan and review</div>' +
    '<h2>A different model has to agree before you see it</h2>' +
    '<p>The planner drafts, a reviewer on a different model scores it against ten fixed criteria, and the loop runs up to ' + MAX_REVIEW_ROUNDS +
    ' rounds before escalating to a person with the unresolved issues attached. Any single <b>fail</b> rejects; more than ' + MAX_PARTIALS +
    ' <b>partials</b> rejects. That rule is applied here, on this page, to the scores below.</p></div>';

  /* ---- The model pairing. Callout 1: named on screen, as the hero. ---- */
  h += '<div class="card"><h3>Model pairing ' +
    (collide ? '<span class="badge crit">refused</span>' : '<span class="badge good">distinct</span>') + '</h3>' +
    '<p class="sub">Enforced in code, not left as configuration — configuration gets changed for cost on a bad week. Set both to the same model and watch the run refuse to start.</p>' +
    '<div class="pair">' +
    '<div class="pair-tile"><span class="pair-role">Agent 3 &middot; planner</span>' + modelSelect('selPlanner', state.planner) +
    '<span class="pair-note">drafts every selected section; may never write its own review</span></div>' +
    '<div class="pair-link' + (collide ? ' bad' : '') + '" aria-hidden="true">' +
    (collide
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg><span>collision</span>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13m0 0l-3-3m3 3l-3 3M20 15H7m0 0l3-3m-3 3l3 3"/></svg><span>distinct</span>') +
    '</div>' +
    '<div class="pair-tile"><span class="pair-role">Agent 4 &middot; reviewer</span>' + modelSelect('selReviewer', state.reviewer) +
    '<span class="pair-note">scores against ten fixed criteria; may never write the plan</span></div>' +
    '</div>' +
    '<div class="toolrow" style="margin:12px 0 0">' +
    '<button class="btn sm" id="btnCollide">' + (collide ? 'Restore distinct models' : 'Set both to the same model') + '</button>' +
    '</div></div>';

  if (collide) {
    h += '<div class="refusal" role="alert">' +
      '<div class="refusal-head">' +
      '<span class="refusal-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v9m0 4h.01"/></svg></span>' +
      '<div><div class="refusal-name">SameModelError</div>' +
      '<div class="refusal-src">assertDistinctPlannerReviewer &middot; lib/llm/config.ts &middot; thrown before Agent 3 drafts anything</div></div></div>' +
      '<div class="refusal-body">' +
      '<p class="refusal-msg">Planner and Reviewer must differ, both resolved to ' + esc(state.planner) + '. Set PLANNER_MODEL / REVIEWER_MODEL to distinct models.</p>' +
      '<p class="refusal-why">The pipeline throws before Agent 3 drafts anything, so there is no plan to show and no review to read — which is why everything below this card is gone.</p>' +
      '<div class="refusal-stats">' +
      '<div class="refusal-stat one"><div class="rv">27<small> / 30</small></div><div class="rl">first-read approvals when the reviewer shared the planner’s model — and two of three planted defects sailed through</div></div>' +
      '<div class="refusal-stat two"><div class="rv">19<small> / 30</small></div><div class="rl">first-read approvals on two distinct models — all three planted defects caught, plus four nobody planted</div></div>' +
      '</div>' +
      '<p class="refusal-cite">Thirty runs measured this: on one model the reviewer approved 27 of 30 first time and missed two of three planted defects; on two models it approved 19 and caught all three, plus four nobody planted.</p>' +
      '</div></div>';
    return h;
  }

  /* ---- Verdict, computed by scoreReview() ---- */
  var card = activeScorecard();
  var verdict, err = null;
  try { verdict = scoreReview(card); } catch (e) { err = e; verdict = null; }
  var passes = card.filter(function (c) { return c.score === 'pass'; }).length;
  var partials = card.filter(function (c) { return c.score === 'partial'; }).length;
  var fails = card.filter(function (c) { return c.score === 'fail'; }).length;

  h += '<div class="toolrow">' +
    QUESTIONS.slice(0, 0).join('') +
    REVIEWS.map(function (r) {
      return '<button class="tab" data-round="' + r.round + '" aria-pressed="' + (state.round === r.round) + '">Round ' + r.round + ' &middot; plan v' + r.plan_version + '</button>';
    }).join('') +
    '<span class="chip">round <b>' + state.round + '</b> of cap ' + MAX_REVIEW_ROUNDS + '</span>' +
    (scorecardEdited() ? '<button class="btn sm" id="btnResetScores">Restore the reviewer’s scores</button>' : '') +
    '</div>';

  h += '<div class="verdict ' + (verdict || '') + '">' +
    '<span class="vv">' + (verdict ? (verdict === 'approved' ? 'Reviewer approved' : 'Reviewer rejected') : 'Invalid scorecard') + '</span>' +
    '<span class="vr">' + fails + ' fail &middot; ' + partials + ' partial &middot; ' + passes + ' pass</span>' +
    '<span class="vr">by <b style="color:var(--ink)">' + esc(modelLabel(state.reviewer)) + '</b>, planned by ' + esc(modelLabel(state.planner)) + '</span>' +
    '<span class="vr" style="margin-left:auto">' +
    (err ? esc(err.name + ': ' + err.message)
      : fails > 0 ? fails + ' fail → reject'
        : partials > MAX_PARTIALS ? partials + ' partial > ' + MAX_PARTIALS + ' → reject'
          : 'no fail, ' + partials + ' partial ≤ ' + MAX_PARTIALS + ' → approve') +
    '</span></div>';

  h += '<div class="grid2 wide" style="margin-bottom:16px">';
  h += '<div class="card"><h3>Scorecard <span class="badge rule">' + REVIEW_CRITERIA.length + ' criteria</span>' +
    '<span class="badge">' + esc(modelLabel(state.reviewer)) + '</span></h3>' +
    '<p class="sub">' + esc(review.summary) + ' Change any score and the verdict above recomputes — the rule is real, not a label on a stored result.</p>' +
    '<div class="scorebar">' +
    '<i class="pass" style="width:' + fmt(pct(passes, card.length), 2) + '%"></i>' +
    '<i class="partial" style="width:' + fmt(pct(partials, card.length), 2) + '%"></i>' +
    '<i class="fail" style="width:' + fmt(pct(fails, card.length), 2) + '%"></i></div>';

  card.forEach(function (c) {
    h += '<div class="sc-row"><div><div class="sc-name">' + c.criterion + '</div>' +
      (c.feedback ? '<div class="sc-fb">' + esc(c.feedback) + '</div>' : '') + '</div>' +
      '<div class="sc-btns">' +
      ['pass', 'partial', 'fail'].map(function (s) {
        return '<button class="sc-btn ' + s + '" data-score="' + c.criterion + ':' + s + '" aria-pressed="' + (c.score === s) + '">' + s + '</button>';
      }).join('') + '</div></div>';
  });
  h += '</div>';

  /* ---- Diff against the previous draft ---- */
  if (state.round > 1) {
    var d = diffPlans(PLANS[state.round - 2], plan);
    h += '<div class="card"><h3>What changed since v' + d.v1 + ' <span class="badge warn">' + d.changed_count + ' of ' + d.sections.length + ' sections</span></h3>' +
      '<p class="sub">Line-level, computed here by the same longest-common-subsequence diff the product uses. The revision is only supposed to touch what the review objected to, and this is how you check that it did.</p>' +
      diffHTML(d) + '</div>';
  } else {
    h += '<div class="card"><h3>Plan v1 <span class="badge">first draft</span></h3>' +
      '<p class="sub">Nothing to diff against yet — this is the first thing the planner wrote. The reviewer’s objections to it are beside this, and round 2 shows what the planner did with them.</p>' +
      '<p class="note crit" style="margin-top:11px">The objection that matters is <b>hallucination_check</b>. External Dependencies names an owner for the release channel. Nobody supplied one: the brief records the absence of an owner as a risk, and the clarifying question that would have settled it was skipped. The plan filled the gap anyway, which is the single defect this whole product exists to catch.</p></div>';
  }
  h += '</div>';

  /* ---- The human gate. Callout 4: visibly frozen.
     Only the latest version can be approved: an earlier round is
     already superseded, and showing an approve button on it would
     imply a version could be frozen after another one replaced it. ---- */
  var reviewerApproved = verdict === 'approved';
  var isLatest = state.round === REVIEWS.length;
  var frozenHere = state.approved && isLatest;

  if (!isLatest) {
    h += '<div class="card"><h3>Superseded <span class="badge warn">v' + plan.version + ' was rejected</span></h3>' +
      '<p class="sub" style="margin:0">This version never reached a person. The reviewer rejected it, the planner revised it, and v' +
      (plan.version + 1) + ' is what went to human review — so there is no approval to make here. It is kept because a task has to be traceable to the reasoning that produced it, including the reasoning that was thrown away.</p></div>';
  } else {
    h += '<div class="card' + (frozenHere ? ' frozen' : '') + '"><h3>Human review ' +
      (frozenHere
        ? '<span class="badge good">approved &amp; frozen v' + plan.version + '</span>'
        : reviewerApproved ? '<span class="badge warn">awaiting your review</span>' : '<span class="badge crit">reviewer rejected — not yet yours</span>') + '</h3>' +
      '<p class="sub">The model’s approval is a precondition, never the decision. Approving freezes this plan version: later feedback opens a revision and a new version rather than editing this one, so every generated task keeps pointing at the reasoning that produced it.</p>' +
      '<div class="toolrow" style="margin:0">' +
      (frozenHere
        ? '<button class="btn" id="btnUnfreeze">Unfreeze and reopen</button><span class="chip state-ok"><span class="dot good"></span>tasks generate from v' + plan.version + '</span>'
        : '<button class="btn good" id="btnApprove"' + (reviewerApproved ? '' : ' disabled') + '>Approve plan</button>' +
          '<button class="btn" disabled>Request changes</button>' +
          (reviewerApproved ? '' : '<span class="chip state-bad"><span class="dot crit"></span>the reviewer has not passed this version</span>')) +
      '</div></div>';
  }

  h += '<div class="card"><h3>Plan v' + plan.version + ' <span class="badge">' + plan.created_by + '</span>' +
    (frozenHere ? '<span class="badge good">frozen</span>' : '') + '</h3>' +
    '<p class="sub">All ' + plan.sections.length + ' selected sections, as the planner wrote them.</p>' +
    '<button class="btn sm" id="btnPlan">' + (state.planOpen ? 'Hide the plan' : 'Read all ' + plan.sections.length + ' sections') + '</button>' +
    (state.planOpen ? '<div style="margin-top:9px">' + planSectionsHTML(plan) + '</div>' : '') +
    '</div>';
  return h;
}

function currentChecklist() {
  if (!state.breakGraph) return CHECKLIST;
  return CHECKLIST.map(function (t) {
    if (t.task_id !== 'TASK-003') return t;
    var copy = Object.assign({}, t);
    copy.dependencies = t.dependencies.concat(['TASK-006']);
    return copy;
  });
}

function viewTask() {
  if (!state.approved) {
    return '<div class="pane-head"><div class="kicker">05 &middot; Task</div>' +
      '<h2>Nothing is generated from an unapproved plan</h2>' +
      '<p>Task generation always reads a frozen plan version. The plan on the previous screen is not approved, so there is nothing here — not an empty state for its own sake, but the freeze doing its job.</p></div>' +
      '<p class="note warn">Approve the plan on screen 04 and this fills in.</p>';
  }

  var items = currentChecklist();
  var errors = validateTaskGraph(items);
  var total = deriveTotalDays(items);
  var missing = estimateEvidenceMissing(items);

  var h = '<div class="pane-head"><div class="kicker">05 &middot; Task</div>' +
    '<h2>One task, and every step carries a test</h2>' +
    '<p>Not a backlog. A person can meaningfully check one task’s checklist and cannot check thirty, so a generated backlog gets approved wholesale by somebody scrolling — which reintroduces the original defect one level up. ' +
    'A backlog here is built by repetition with a real review at each step.</p></div>';

  h += '<div class="toolrow">' +
    '<span class="chip">from plan <b>v' + TASK_OVERVIEW.plan_version + '</b> (frozen)</span>' +
    '<span class="chip">derived total <b>' + total + 'd</b></span>' +

  h += '<div class="card"><h3>' + esc(TASK_OVERVIEW.title) + ' <span class="lno ' + TASK_OVERVIEW.leverage + '">' +
    TASK_OVERVIEW.leverage + TASK_OVERVIEW.importance + '</span></h3>' +

    '<table class="t"><tbody>' +

    '<tr><td class="k">Evidence required</td><td>' + esc(TASK_OVERVIEW.evidence_required) + '</td></tr>' +
    '<tr><td class="k">Definition of done</td><td>' + esc(TASK_OVERVIEW.definition_of_done) + '</td></tr>' +
    '<tr><td class="k">Why this long</td><td>' + esc(TASK_OVERVIEW.duration_reasoning) + '</td></tr>' +

    '</tbody></table></div>';

  h += '<div class="card' + (errors.length ? '' : ' frozen') + '"><h3>Dependency graph ' +

      : '<span class="badge good">valid</span>') + '</h3>' +
    '<p class="sub">Checked on this page by the product’s own validator: unknown ids, self-dependency, duplicate ids, forward references and cycles. A disconnected but acyclic graph is fine.</p>' +
    (errors.length
      ? '<div class="note crit">' + errors.map(function (e) { return esc(describeDepError(e)); }).join('<br>') + '</div>'
      : '<div class="note good">' + items.length + ' items, ' +
        items.reduce(function (a, t) { return a + t.dependencies.length; }, 0) +
        ' edges, no cycle and no forward reference. Every dependency names an item that exists and is listed before it.</div>') +
    '</div>';

  h += '<div class="card"><h3>Checklist <span class="badge rule">' + items.length + ' steps</span>' +
    '<span class="badge good">' + items.length + ' completion tests</span></h3>' +
    '<p class="sub">Fifteen of the twenty-four audited plans contained a step with no test for whether it was done, so a step got marked done because time had passed. Every step below carries a binary test beside it.</p>';
  items.forEach(function (t) {
    h += '<div class="ck"><div class="ck-head">' +
      '<span class="cid">' + t.task_id + '</span><span class="ctitle">' + esc(t.title) + '</span>' +

      (t.estimate_basis
