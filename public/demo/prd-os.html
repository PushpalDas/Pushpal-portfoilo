    '</tbody></table>' +
    '<p class="note ' + (missing.length ? 'crit' : 'good') + '" style="margin-top:12px">' +
    (missing.length
      ? missing.length + ' item(s) over the threshold assert a number with no arithmetic — the schema rejects these and retries the generation.'
      : 'All ' + items.filter(function (t) { return t.days > CYCLE_EVIDENCE_THRESHOLD; }).length +
        ' items over the threshold show count × cost. The derived total is ' + total + ' days against the ' +
        INTAKE.task_days + ' the brief guessed, and the gap is visible rather than reconciled away.') +
    '</p></div>';
  return h;
}

/* ------------------------------------------------------------
   20. THE RUNS  -  every figure in section 08, derived
   ------------------------------------------------------------ */
var BINS = [
  { name: '2–4', lo: 2, hi: 4 }, { name: '4–6', lo: 4, hi: 6 },
  { name: '6–8', lo: 6, hi: 8 }, { name: '8–10', lo: 8, hi: 10 },
  { name: '10+', lo: 10, hi: Infinity }
];
var CEILING_MIN = 10;

function binCounts() {
  return BINS.map(function (b) {
    return COUNTED.filter(function (r) { return r.minutes >= b.lo && r.minutes < b.hi; }).length;
  });
}

function histogramSVG() {
  var counts = binCounts();
  var W = 700, H = 250, ml = 40, mr = 16, mt = 14, mb = 40;
  var pw = W - ml - mr, ph = H - mt - mb;
  var yMax = Math.max.apply(null, counts) + 1;
  var bw = pw / BINS.length;
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Distribution of run times to human review">';
  for (var t = 0; t <= yMax; t += Math.ceil(yMax / 5)) {
    var y = mt + ph - (t / yMax) * ph;
    s += '<line x1="' + ml + '" y1="' + fmt(y, 1) + '" x2="' + (W - mr) + '" y2="' + fmt(y, 1) + '" stroke="#2A2018"/>';
    s += '<text x="' + (ml - 8) + '" y="' + fmt(y + 3.5, 1) + '" fill="#8A7E72" font-size="10" font-family="Geist Mono, ui-monospace, monospace" text-anchor="end">' + t + '</text>';
  }
  counts.forEach(function (c, i) {
    var over = BINS[i].lo >= CEILING_MIN;
    var bh = (c / yMax) * ph;
    var x = ml + i * bw + bw * 0.16;
    s += '<rect x="' + fmt(x, 1) + '" y="' + fmt(mt + ph - bh, 1) + '" width="' + fmt(bw * 0.68, 1) + '" height="' + fmt(bh, 1) +
      '" rx="3" fill="' + (over ? '#EF4444' : '#FF6321') + '"/>';
    s += '<text x="' + fmt(x + bw * 0.34, 1) + '" y="' + fmt(mt + ph - bh - 6, 1) +
      '" fill="' + (over ? '#EF4444' : '#C0B6AC') + '" font-size="11" font-family="Geist Mono, ui-monospace, monospace" text-anchor="middle">' + c + '</text>';
    s += '<text x="' + fmt(x + bw * 0.34, 1) + '" y="' + (H - 20) + '" fill="#A89888" font-size="10.5" font-family="Geist Mono, ui-monospace, monospace" text-anchor="middle">' + BINS[i].name + '</text>';
  });
  var cx = ml + 4 * bw;
  s += '<line x1="' + fmt(cx, 1) + '" y1="' + mt + '" x2="' + fmt(cx, 1) + '" y2="' + (mt + ph) + '" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="5 4"/>';
  s += '<text x="' + fmt(cx - 7, 1) + '" y="' + (mt + 11) + '" fill="#F59E0B" font-size="10" font-family="Geist Mono, ui-monospace, monospace" text-anchor="end">10 min ceiling</text>';
  s += '<text x="' + fmt(ml + pw / 2, 1) + '" y="' + (H - 5) + '" fill="#8A7E72" font-size="10" font-family="Geist Mono, ui-monospace, monospace" text-anchor="middle">minutes to human review</text>';
  s += '</svg>';
  return s;
}

function viewRuns() {
  var mins = COUNTED.map(function (r) { return r.minutes; });
  var med = median(mins);
  var before = COUNTED.filter(function (r) { return r.era === 'before'; });
  var after = COUNTED.filter(function (r) { return r.era === 'after'; });
  var firstRead = COUNTED.filter(function (r) { return r.first_read; }).length;
  var shared = RUNS.filter(function (r) { return r.planner === r.reviewer; }).length;
  var overCeiling = COUNTED.filter(function (r) { return r.minutes >= CEILING_MIN; });
  var overWithTwoClar = overCeiling.filter(function (r) { return r.clarifications >= 2; }).length;
  var twoClarAnywhere = COUNTED.filter(function (r) { return r.clarifications >= 2; }).length;

  var h = '<div class="pane-head"><div class="kicker">06 &middot; The 41 runs</div>' +
    '<h2>Where each figure on the case study comes from</h2>' +
    '<p>Every number in section 08 is computed from the rows at the bottom of this screen when it renders. ' +
    'Three runs reached human review and were never opened; they are excluded rather than counted as approved, which is the difference between measuring approval and measuring abandonment.</p></div>';

  h += '<div class="metrics" style="margin-bottom:16px">' +
    '<div class="metric"><div class="mv">' + COUNTED.length + '</div><div class="ml">Briefs taken through to an approved plan</div></div>' +
    '<div class="metric"><div class="mv">4h → 25m</div><div class="ml">Median brief to execution-ready checklist</div></div>' +
    '<div class="metric"><div class="mv">' + mmss(med) + '</div><div class="ml">Median run to human review</div></div>' +
    '<div class="metric"><div class="mv">' + fmt(mean(before.map(function (r) { return r.rounds; })), 1) + ' → ' +
      fmt(mean(after.map(function (r) { return r.rounds; })), 1) + '</div><div class="ml">Planner–reviewer rounds before approval</div></div>' +
    '<div class="metric"><div class="mv">' + Math.round(pct(firstRead, COUNTED.length)) + '%<small> of ' + COUNTED.length + '</small></div>' +
      '<div class="ml">Plans approved by the human on first read</div></div>' +
    '<div class="metric"><div class="mv">' + shared + '</div><div class="ml">Runs where planner and reviewer shared a model</div></div>' +
    '</div>';

  h += '<p class="note" style="margin-bottom:16px">Five of these six are computed from the ' + RUNS.length +
    ' rows below. <b>4h → 25m is not</b> — it came from timing people planning by hand before the system existed, and no log on this page contains it. It is left in place and marked rather than quietly dropped.</p>';

  h += '<div class="card"><h3>Time to human review <span class="badge rule">' + COUNTED.length + ' completed runs</span></h3>' +
    '<p class="sub">The ceiling matters more than the median: a run must reach a person inside ten minutes or it stops being part of a working session. Bars past the line are counted, not hidden.</p>' +
    histogramSVG() +
    '<p class="note ' + (overWithTwoClar === overCeiling.length ? 'warn' : 'crit') + '" style="margin-top:11px">' +
    overCeiling.length + ' run' + (overCeiling.length === 1 ? '' : 's') + ' past the ten-minute ceiling, and ' +
    overWithTwoClar + ' of those needed two clarification rounds. ' +
    (twoClarAnywhere === overWithTwoClar
      ? 'No run inside the ceiling needed two, so the ceiling breaches are a clarification story rather than a model-speed one.'
      : (twoClarAnywhere - overWithTwoClar) + ' run(s) inside the ceiling also needed two, so the explanation is not clean.') +
    '</p></div>';

  h += '<div class="card"><h3>Before and after the context-handoff fix</h3>' +
    '<p class="sub">The review loop’s early failures were a plumbing bug, not a reviewing problem: the reviewer could not see the clarification answers and the planner revised without its own previous draft, so both sides spent rounds converging on things they already knew.</p>' +
    '<table class="t"><thead><tr><th>Period</th><th class="num">Runs</th><th class="num">Mean rounds</th><th class="num">Median minutes</th><th class="num">First-read approved</th></tr></thead><tbody>' +
    [['Before the fix', before], ['After the fix', after]].map(function (p) {
      var rows = p[1];
      var fr = rows.filter(function (r) { return r.first_read; }).length;
      return '<tr><td class="k">' + p[0] + '</td><td class="num">' + rows.length + '</td>' +
        '<td class="num">' + fmt(mean(rows.map(function (r) { return r.rounds; })), 2) + '</td>' +
        '<td class="num">' + fmt(median(rows.map(function (r) { return r.minutes; })), 1) + '</td>' +
        '<td class="num">' + fr + ' of ' + rows.length + ' &middot; ' + Math.round(pct(fr, rows.length)) + '%</td></tr>';
    }).join('') + '</tbody></table></div>';

  h += '<div class="card"><h3>Every run <span class="badge rule">' + COUNTED.length + ' counted</span>' +
    '<span class="badge warn">' + EXCLUDED.length + ' excluded</span></h3>' +
    '<p class="sub">Excluded rows reached human review and were never opened. Counting them as approvals would measure abandonment; counting them as rejections would measure something nobody did.</p>' +
    '<table class="t"><thead><tr><th>Run</th><th>Era</th><th class="num">Minutes</th><th class="num">Rounds</th><th class="num">Clarifications</th><th>Planner</th><th>Reviewer</th><th>Outcome</th></tr></thead><tbody>' +
    RUNS.map(function (r) {
      return '<tr class="' + (r.opened ? '' : 'excluded') + '"><td class="k">' + r.id + '</td><td>' + r.era + '</td>' +
        '<td class="num">' + fmt(r.minutes, 2) + '</td><td class="num">' + r.rounds + '</td><td class="num">' + r.clarifications + '</td>' +
        '<td class="k" style="color:var(--muted)">' + esc(modelLabel(r.planner)) + '</td>' +
        '<td class="k" style="color:var(--muted)">' + esc(modelLabel(r.reviewer)) + '</td>' +
        '<td>' + (!r.opened ? '<span class="badge warn">never opened</span>'
          : r.first_read ? '<span class="badge good">approved first read</span>'
            : '<span class="badge">revision requested</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  return h;
}

/* ------------------------------------------------------------
   21. RULES  -  the invariants, run in this page

   These are the pure-logic checks from the product's own suite:
   the scoring boundaries, the dependency validator, the model
   pairing assertion, the diff, the template and the estimate
   derivation. The full suite is larger and needs a runtime this
   page does not have; the count is stated in the footer rather
   than rounded up.
   ------------------------------------------------------------ */
function fullCard(overrides) {
  return REVIEW_CRITERIA.map(function (c) {
    return { criterion: c, score: (overrides && overrides[c]) || 'pass', feedback: null };
  });
}
function nPartials(n) {
  var o = {};
  REVIEW_CRITERIA.slice(0, n).forEach(function (c) { o[c] = 'partial'; });
  return fullCard(o);
}
function item(id, deps) { return { task_id: id, dependencies: deps || [], days: 1 }; }
function throws(fn, name) {
  try { fn(); } catch (e) { if (name && e.name !== name) throw new Error('threw ' + e.name + ', expected ' + name); return; }
  throw new Error('expected ' + (name || 'an error') + ', nothing thrown');
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }

var RULES = [
  ['scoring · lib/agents/scoring.ts', 'all ten pass → approved', function () {
    assert(scoreReview(fullCard()) === 'approved');
  }],
  ['scoring · lib/agents/scoring.ts', 'a single fail → rejected', function () {
    assert(scoreReview(fullCard({ hallucination_check: 'fail' })) === 'rejected');
  }],
  ['scoring · lib/agents/scoring.ts', 'three partials → approved (boundary)', function () {
    assert(scoreReview(nPartials(3)) === 'approved');
  }],
  ['scoring · lib/agents/scoring.ts', 'four partials → rejected (boundary)', function () {
    assert(scoreReview(nPartials(4)) === 'rejected');
  }],
  ['scoring · lib/agents/scoring.ts', 'a fail outranks any partial count', function () {
    assert(scoreReview(nPartials(0).map(function (c, i) { return i === 0 ? { criterion: c.criterion, score: 'fail', feedback: null } : c; })) === 'rejected');
  }],
  ['scoring · lib/agents/scoring.ts', 'missing criterion → InvalidScorecardError', function () {
    throws(function () { scoreReview(fullCard().slice(1)); }, 'InvalidScorecardError');
  }],
  ['scoring · lib/agents/scoring.ts', 'duplicate criterion → InvalidScorecardError', function () {
    var c = fullCard(); c.push(c[0]);
    throws(function () { scoreReview(c); }, 'InvalidScorecardError');
  }],
  ['scoring · lib/agents/scoring.ts', 'unknown criterion → InvalidScorecardError', function () {
    var c = fullCard(); c[0] = { criterion: 'vibes', score: 'pass', feedback: null };
    throws(function () { scoreReview(c); }, 'InvalidScorecardError');
  }],
  ['scoring · lib/agents/scoring.ts', 'empty scorecard → InvalidScorecardError', function () {
    throws(function () { scoreReview([]); }, 'InvalidScorecardError');
  }],
  ['scoring · lib/agents/scoring.ts', 'the run’s own round 1 rejects, round 2 approves', function () {
    assert(scoreReview(REVIEWS[0].scorecard) === 'rejected', 'round 1 should reject');
    assert(scoreReview(REVIEWS[1].scorecard) === 'approved', 'round 2 should approve');
  }],

  ['model pairing · lib/llm/config.ts', 'distinct planner and reviewer pass', function () {
    assertDistinctPlannerReviewer('anthropic:claude-opus-4-8', 'openai:gpt-4o');
  }],
  ['model pairing · lib/llm/config.ts', 'identical pair → SameModelError', function () {
    throws(function () { assertDistinctPlannerReviewer('openai:gpt-4o', 'openai:gpt-4o'); }, 'SameModelError');
  }],
  ['model pairing · lib/llm/config.ts', 'same family, different model is allowed', function () {
    assertDistinctPlannerReviewer('anthropic:claude-opus-4-8', 'anthropic:claude-sonnet-5');
  }],
  ['model pairing · lib/llm/config.ts', 'no logged run shared a model', function () {
    assert(RUNS.filter(function (r) { return r.planner === r.reviewer; }).length === 0);
  }],

  ['dependencies · lib/agents/deps.ts', 'the run’s own checklist is a valid DAG', function () {
    assert(isValidTaskGraph(CHECKLIST), JSON.stringify(validateTaskGraph(CHECKLIST)));
  }],
  ['dependencies · lib/agents/deps.ts', 'unknown dependency id is caught', function () {
    var e = validateTaskGraph([item('TASK-001', ['TASK-999'])]);
    assert(e.length === 1 && e[0].kind === 'unknown_dependency');
  }],
  ['dependencies · lib/agents/deps.ts', 'self-dependency is caught', function () {
    var e = validateTaskGraph([item('TASK-001', ['TASK-001'])]);
    assert(e.some(function (x) { return x.kind === 'self_dependency'; }));
  }],
  ['dependencies · lib/agents/deps.ts', 'duplicate task id is caught', function () {
    var e = validateTaskGraph([item('TASK-001'), item('TASK-001')]);
    assert(e.some(function (x) { return x.kind === 'duplicate_id'; }));
  }],
  ['dependencies · lib/agents/deps.ts', 'a two-node cycle is caught', function () {
    var e = validateTaskGraph([item('TASK-001', ['TASK-002']), item('TASK-002', ['TASK-001'])]);
    assert(e.some(function (x) { return x.kind === 'cycle'; }));
  }],
  ['dependencies · lib/agents/deps.ts', 'a three-node cycle is caught', function () {
    var e = validateTaskGraph([item('TASK-001', ['TASK-003']), item('TASK-002', ['TASK-001']), item('TASK-003', ['TASK-002'])]);
    assert(e.some(function (x) { return x.kind === 'cycle'; }));
  }],
  ['dependencies · lib/agents/deps.ts', 'a disconnected but acyclic graph is accepted', function () {
    assert(isValidTaskGraph([item('TASK-001'), item('TASK-002'), item('TASK-003', ['TASK-001'])]));
  }],
  ['dependencies · lib/agents/deps.ts', 'a forward reference is caught', function () {
    var e = validateTaskGraph([item('TASK-001', ['TASK-002']), item('TASK-002')]);
    assert(e.some(function (x) { return x.kind === 'dependency_order'; }));
  }],

  ['diff · lib/diff.ts', 'identical plans report nothing changed', function () {
    var d = diffPlans(PLAN_V1, buildPlan(1, 'agent_3', null));
    assert(d.changed_count === 0, d.changed_count + ' changed');
  }],
  ['diff · lib/diff.ts', 'the run’s revision touched exactly three sections', function () {
    var d = diffPlans(PLAN_V1, PLAN_V2);
    assert(d.changed_count === 3, d.changed_count + ' changed');
  }],
  ['diff · lib/diff.ts', 'an added section reports every line as an addition', function () {
    var a = { version: 1, sections: [] };
    var b = { version: 2, sections: [{ section_id: 'x', title: 'X', content: 'one\ntwo' }] };
    var d = diffPlans(a, b);
    assert(d.sections[0].status === 'added' && d.sections[0].added_lines === 2);
  }],
  ['diff · lib/diff.ts', 'a removed section is reported at the end', function () {
    var a = { version: 1, sections: [{ section_id: 'x', title: 'X', content: 'one' }] };
    var d = diffPlans(a, { version: 2, sections: [] });
    assert(d.sections[0].status === 'removed' && d.sections[0].removed_lines === 1);
  }],
  ['diff · lib/diff.ts', 'a one-line edit is one add and one delete', function () {
    var ops = diffLines('a\nb\nc', 'a\nB\nc');
    assert(ops.filter(function (o) { return o.type === 'add'; }).length === 1);
    assert(ops.filter(function (o) { return o.type === 'del'; }).length === 1);
  }],

  ['template · lib/prd/master-template.ts', 'exactly 30 sections', function () {
    assert(MASTER_PRD_SECTIONS.length === 30, MASTER_PRD_SECTIONS.length + ' sections');
  }],
  ['template · lib/prd/master-template.ts', 'every section id is unique', function () {
    assert(new Set(SECTION_IDS).size === SECTION_IDS.length);
  }],
  ['template · lib/prd/master-template.ts', 'every section applies to at least one project type', function () {
    assert(MASTER_PRD_SECTIONS.every(function (s) { return s.appliesTo.length > 0; }));
  }],
  ['template · lib/prd/master-template.ts', 'every selected section exists in the template', function () {
    assert(SCOPE.selected.every(function (id) { return SECTION_IDS.indexOf(id) !== -1; }));
  }],
  ['template · lib/prd/master-template.ts', 'selected + excluded + inapplicable = 30', function () {
    var applicable = sectionsForType(SCOPE.project_type);
    var na = SECTION_IDS.filter(function (id) { return applicable.indexOf(id) === -1; }).length;
    assert(SCOPE.selected.length + SCOPE.excluded.length + na === 30,
      SCOPE.selected.length + '+' + SCOPE.excluded.length + '+' + na);
  }],

  ['estimates · lib/agents/schemas.ts', 'day estimates snap to 0.5', function () {
    assert(snapDays(1.3) === 1.5 && snapDays(1.1) === 1 && snapDays(0.1) === 0.5);
  }],
  ['estimates · lib/agents/agent5.ts', 'the task total is the snapped sum of its steps', function () {
    var manual = CHECKLIST.reduce(function (a, t) { return a + t.days; }, 0);
    assert(deriveTotalDays(CHECKLIST) === Math.round(manual * 2) / 2);
  }],
  ['estimates · lib/agents/schemas.ts', 'every item over 1.5d shows its arithmetic', function () {
    assert(estimateEvidenceMissing(CHECKLIST).length === 0);
  }],
  ['estimates · lib/agents/schemas.ts', 'stated arithmetic matches the stated days', function () {
    CHECKLIST.filter(function (t) { return t.cycle_count; }).forEach(function (t) {
      assert(t.cycle_count * t.cycle_cost_days === t.days, t.task_id + ' arithmetic does not reach its estimate');
    });
  }],

  ['memory · lib/memory/types.ts', 'the reviewer may write reviews', function () {
    assert(mayWrite('agent_4', 'reviews'));
  }],
  ['memory · lib/memory/types.ts', 'the reviewer may not write plans', function () {
    assert(!mayWrite('agent_4', 'plans'));
  }],
  ['memory · lib/memory/types.ts', 'the planner may not write its own review', function () {
    assert(!mayWrite('agent_3', 'reviews'));
  }],
  ['memory · lib/memory/types.ts', 'only the system may freeze an approved version', function () {
    assert(mayWrite('system', 'approved_plan_version'));
    assert(['agent_1', 'agent_2', 'agent_3', 'agent_4', 'agent_5', 'user'].every(function (a) {
      return !mayWrite(a, 'approved_plan_version');
    }));
  }]
];

function runRules() {
  state.rules = RULES.map(function (r) {
    var t0 = performance.now(), pass = true, err = null;
    try { r[2](); } catch (e) { pass = false; err = e.message; }
    return { group: r[0], name: r[1], pass: pass, err: err, ms: performance.now() - t0 };
  });
}

function viewRules() {
  var h = '<div class="pane-head"><div class="kicker">07 &middot; Rules</div>' +
    '<h2>The invariants, run in this page</h2>' +
    '<p>Everything the system promises is a rule in code rather than a habit in a prompt: the scoring boundaries, the dependency validator, the model-pairing assertion, the diff, the template and the estimate derivation. ' +
    'These are the ones that are pure logic and can run in a browser, and they run against this page’s own data as well as against fixtures.</p></div>';

  h += '<div class="toolrow"><button class="btn primary" id="btnRules">' +
    (state.rules ? 'Run them again' : 'Run all ' + RULES.length) + '</button>';
  if (state.rules) {
    var passed = state.rules.filter(function (r) { return r.pass; }).length;
    var total = state.rules.reduce(function (a, r) { return a + r.ms; }, 0);
    h += '<span class="chip ' + (passed === state.rules.length ? 'state-ok' : 'state-bad') + '">' +
      '<span class="dot ' + (passed === state.rules.length ? 'good' : 'crit') + '"></span>' +
      passed + ' of ' + state.rules.length + ' passing &middot; ' + fmt(total, 0) + ' ms</span>';
  }
  h += '</div>';

  if (!state.rules) {
    h += '<p class="note">Not run yet.</p>';
    return h;
  }

  var groups = [];
  state.rules.forEach(function (r) { if (groups.indexOf(r.group) === -1) groups.push(r.group); });
  h += '<div class="card">';
  groups.forEach(function (g) {
    var rows = state.rules.filter(function (r) { return r.group === g; });
    var ok = rows.filter(function (r) { return r.pass; }).length;
    h += '<div class="rgroup"><h4>' + esc(g) + ' <span class="badge ' + (ok === rows.length ? 'good' : 'crit') + '">' + ok + '/' + rows.length + '</span></h4>';
    rows.forEach(function (r) {
      h += '<div class="rrow"><span class="rk ' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? '✓' : '✗') + '</span>' +
        '<span class="rn">' + esc(r.name) + (r.pass ? '' : ' — <span style="color:var(--crit)">' + esc(r.err) + '</span>') + '</span>' +
        '<span class="rt">' + fmt(r.ms, 2) + ' ms</span></div>';
    });
    h += '</div>';
  });
  h += '</div>';

  h += '<p class="note good">Passing rules say the machinery holds. They say nothing about whether a plan is any good — that is what the reviewing model is for, and what the human gate after it is for.</p>';
  return h;
}

/* ------------------------------------------------------------
   22. CHROME, WIRING, DEEP LINKS
   ------------------------------------------------------------ */
function renderRail() {
  var done = { intake: true, clarify: !pendingQuestion(), scope: true, review: state.approved, task: state.approved, runs: false, rules: !!state.rules };
  var h = '<div class="rail-group"><div class="rail-label">Pipeline</div>';
  VIEWS.forEach(function (v) {
    h += '<button class="rail-item" data-view="' + v.id + '" aria-current="' + (state.view === v.id) + '">' +
      '<span class="n">' + v.n + '</span><span>' + v.label + '<span class="sub">' + v.sub + '</span></span>' +
      (done[v.id] ? '<span class="tick">✓</span>' : '') + '</button>';
  });
  h += '</div><div class="rail-note"><b>One walkthrough run.</b> The brief, the questions, the plan and the checklist are an invented run of a real system. ' +
    'Every gate decision, score total, diff, dependency verdict and day estimate on these screens is computed here, not stored.</div>';
  $('rail').innerHTML = h;
}

function renderFoot() {
  $('foot').innerHTML =
    '<b>What this is.</b> The product’s decision logic, ported from its own source — the master template, the reviewer scoring rule, the dependency validator, the line diff, the model-pairing assertion and the estimate derivation — running here against one recorded run. ' +
    'Change a score and the approve/reject verdict recomputes by the real rule. Point planner and reviewer at the same model and the run refuses to start. Break a dependency and the validator names the cycle. ' +
    'The logged history on screen 06 works the same way: the median, the histogram, the round counts and the first-read rate are all derived from the rows printed beneath them.' +
    '<br><br><b>What is recorded rather than computed.</b> The parts a language model wrote — the pre-mortem, the three clarifying questions, the plan prose, the reviewer’s objections and the checklist. ' +
    'A browser cannot re-derive those, and pretending otherwise would be the exact failure this product exists to prevent. They are one run of an invented brief, chosen so the interesting case appears: the planner asserts an owner nobody supplied, and the reviewer catches it.' +
    '<br><br><b>What it is not.</b> Not the internal product and not connected to it. The brief is invented, the 44 logged runs are invented, and the figures on the case study page are placeholders for a public sample. ' +
    'The structural characteristics are real: five stages, a 30-section master template, ten scorecard criteria, a review loop capped at five rounds, 0.5-day estimate granularity, and distinct planner and reviewer models enforced in code. ' +
    'This page runs <b>' + RULES.length + '</b> of the product’s invariants because they are pure logic; the repository’s own suite is <b>105 tests across 13 files</b>, which needs a runtime this page does not have.';
}

function render() {
  renderRail();
  var fn = { intake: viewIntake, clarify: viewClarify, scope: viewScope, review: viewReview, task: viewTask, runs: viewRuns, rules: viewRules }[state.view] || viewReview;
  $('pane').innerHTML = fn();

  var q = pendingQuestion();
  $('chipStage').className = 'chip ' + (q ? 'state-ruo' : state.approved ? 'state-ok' : '');
  $('chipStage').innerHTML = '<span class="dot ' + (q ? 'warn' : state.approved ? 'good' : 'accent') + '"></span>' +
    (q ? 'awaiting_answer' : state.approved ? 'approved &middot; frozen v2' : 'human_review');
  var collide = modelsCollide();
  $('chipModels').className = 'chip ' + (collide ? 'state-bad' : 'state-ok');
  $('chipModels').innerHTML = '<span class="dot ' + (collide ? 'crit' : 'good') + '"></span>' +
    (collide ? 'planner = reviewer — refused' : esc(modelLabel(state.planner)) + ' ⇄ ' + esc(modelLabel(state.reviewer)));
  wire();
}

function go(view) {
  state.view = view;
  render();
  var pane = $('pane');
  if (pane && pane.classList) { pane.classList.remove('enter'); void pane.offsetWidth; pane.classList.add('enter'); }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
}

function wire() {
  document.querySelectorAll('[data-view]').forEach(function (b) {
    b.onclick = function () { go(b.dataset.view); };
  });
  document.querySelectorAll('[data-answer]').forEach(function (b) {
    b.onclick = function () { state.qStatus[b.dataset.answer] = 'answered'; render(); };
  });
  document.querySelectorAll('[data-skip]').forEach(function (b) {
    b.onclick = function () { state.qStatus[b.dataset.skip] = 'skipped'; render(); };
  });
  document.querySelectorAll('[data-round]').forEach(function (b) {
    b.onclick = function () {
      state.round = parseInt(b.dataset.round, 10);
      state.scores = null;
      render();
    };
  });
  document.querySelectorAll('[data-score]').forEach(function (b) {
    b.onclick = function () {
      var parts = b.dataset.score.split(':');
      state.scores = state.scores || {};
      state.scores[parts[0]] = parts[1];
      render();
    };
  });
  document.querySelectorAll('[data-sec]').forEach(function (b) {
    b.onclick = function () {
      var id = b.dataset.sec;
      state.openSections[id] = state.openSections[id] !== true;
      render();
    };
  });

  var qr = $('qReset');
  if (qr) qr.onclick = function () { state.qStatus = {}; render(); };
  var sp = $('selPlanner');
  if (sp) sp.onchange = function () { state.planner = sp.value; render(); };
  var sr = $('selReviewer');
  if (sr) sr.onchange = function () { state.reviewer = sr.value; render(); };
  var bc = $('btnCollide');
  if (bc) bc.onclick = function () {
    if (modelsCollide()) { state.planner = 'anthropic:claude-opus-4-8'; state.reviewer = 'openai:gpt-4o'; }
    else { state.reviewer = state.planner; }
    render();
  };
  var brs = $('btnResetScores');
  if (brs) brs.onclick = function () { state.scores = null; render(); };
  var ba = $('btnApprove');
  if (ba) ba.onclick = function () { state.approved = true; render(); };
  var bu = $('btnUnfreeze');
  if (bu) bu.onclick = function () { state.approved = false; render(); };
  var bp = $('btnPlan');
  if (bp) bp.onclick = function () { state.planOpen = !state.planOpen; render(); };
  var bb = $('btnBreak');
  if (bb) bb.onclick = function () { state.breakGraph = !state.breakGraph; render(); };
  var br = $('btnRules');
  if (br) br.onclick = function () { runRules(); render(); };
}

/* ------------------------------------------------------------
   23. DEEP LINKS

   The case study links each screenshot to the state it pictures,
   so every screen this page can show is reachable by URL.
   ------------------------------------------------------------ */
(function init() {
  var p = new URLSearchParams(location.search);
  var v = p.get('view');
  if (v && VIEWS.some(function (x) { return x.id === v; })) state.view = v;
  var r = parseInt(p.get('round'), 10);
  if (r === 1 || r === 2) state.round = r;
  if (p.get('collide') === '1') state.reviewer = state.planner;
  if (p.get('planner')) state.planner = p.get('planner');
  if (p.get('reviewer')) state.reviewer = p.get('reviewer');
  if (p.get('approved') === '0') state.approved = false;
  if (p.get('broken') === '1') state.breakGraph = true;
  if (p.get('plan') === '1') state.planOpen = true;
  if (p.get('diff') === 'all') { ['functional_req', 'timeline_milestones', 'dependencies_ext'].forEach(function (k) { state.openSections[k] = true; }); }
  var q = p.get('q');
  if (q !== null) {
    /* q = how many questions have been resolved, 0 to 3. */
    var n = parseInt(q, 10);
    state.qStatus = {};
    if (n >= 1) state.qStatus.Q1 = 'answered';
    if (n >= 2) state.qStatus.Q2 = 'answered';
    if (n >= 3) state.qStatus.Q3 = 'skipped';
  }
  renderFoot();
  render();
  if (p.get('run') === '1' && state.view === 'rules') { runRules(); render(); }
})();
</script>

</body>
