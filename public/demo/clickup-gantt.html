<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporting and Gantt Dashboard</title>
<meta name="description" content="Interactive demo of the ClickUp reporting and Gantt dashboard: a read-only timeline with instant scale switching, a bandwidth grid, a status board, and delay analysis read out of the comment thread.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
</head>
<body>
<style>
/* ============================================================
   ClickUp reporting and Gantt dashboard — interactive demo.

   Native sibling of the XANA internal tools: the same warm
   near-black ground (#0E0805), raised #1A1410 surfaces held up
   by 1px #3A3028 borders instead of shadows, dense 13px UI type
   with uppercase letter-spaced kickers, mono tabular numerics,
   and the single #FF6321 orange reserved for the accent moments
   — the active tab underline, the TODAY line, the "why?" link
   into a delay account. Single-theme by intent: an internal
   dashboard, dark by design, every colour painted explicitly.

   Workflow-state hues are re-stepped for this warm ground:
   blue / amber / violet / green / warm grey, each light enough
   to carry a dark ink label inside the bar. Colour is never the
   only carrier — every bar prints its state word, the legend is
   always on, and overdue is a red HATCH plus a "days late"
   badge, never a fifth hue competing with the states.
   ============================================================ */
:root {
  color-scheme: dark;
  --bg: #0E0805;
  --surface: #1A1410;
  --surface-2: #221A14;
  --surface-deep: #140F0B;
  --line: #3A3028;
  --line-hover: #5A4838;
  --line-soft: #1C140E;
  --line-hair: rgba(255, 255, 255, 0.06);
  --ink: #FFFFFF;
  --body: #E0D0C0;
  --muted: #808080;
  --faint: #606060;
  --warm: #A89888;
  --accent: #FF6321;
  --accent-deep: #CD3D00;
  --accent-soft: #FF8A56;
  --accent-cite: #FF8C5A;
  --accent-line: rgba(255, 99, 33, 0.35);
  --accent-wash: rgba(255, 99, 33, 0.08);

  /* Workflow states — light fills that carry a dark ink label. */
  --st-todo: #5AA2F7;
  --st-prog: #F59E0B;
  --st-review: #B497F8;
  --st-done: #22C55E;
  --st-closed: #8A8178;
  --bar-ink: #140F0B;
  /* Overdue is a flag, not a state: texture + badge, never a hue. */
  --crit: #EF4444;
  --crit-wash: rgba(239, 68, 68, 0.10);
  --ok: #22C55E;
  --warn: #F59E0B;

  --plan: #8A7A66; /* the dimension line under a slipped bar */

  --radius-sm: 8px;
  --radius-md: 12px;
  --dur: 200ms;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);

  --sans: Geist, Arial, Helvetica, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--body);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.55;
  letter-spacing: -0.1px;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
select, input { font: inherit; color: inherit; }
button, .tab, .chip, .seg button, a { transition: color var(--dur), border-color var(--dur), background-color var(--dur); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app {
  min-height: 100vh;
  max-width: 1340px;
  margin: 0 auto;
  border-left: 1px solid var(--line-hair);
  border-right: 1px solid var(--line-hair);
  display: flex;
  flex-direction: column;
}

/* -- Top bar ----------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(14, 8, 5, 0.72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line-hair);
}
.topbar-row { display: flex; align-items: center; gap: 14px; padding: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
.brand .eyebrow {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--accent-soft);
}
.brand .name { font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -0.25px; }

.ro-badge {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--warm);
  background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: 999px; padding: 5px 12px 5px 10px;
}
.ro-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.ro-badge b { color: var(--ink); font-weight: 600; }

/* Mode + view tabs — flat links, 2px orange underline on the
   active one, the house nav grammar. */
.tabs { display: flex; gap: 6px; padding: 0 20px; border-bottom: 1px solid var(--line-hair); flex-wrap: wrap; }
.tab {
  position: relative;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--muted); padding: 10px 11px 11px; font-weight: 500;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; left: 11px; right: 11px; bottom: -1px;
  height: 2px; background: var(--accent);
}
.tab .n { color: var(--faint); margin-left: 6px; font-size: 10px; }

/* Control strip */
.controls {
  display: flex; align-items: flex-end; gap: 12px; padding: 14px 20px;
  border-bottom: 1px solid var(--line-soft); flex-wrap: wrap;
  background: var(--surface-deep);
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--faint);
}
.field select, .field input {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; color: var(--ink);
  min-width: 190px; transition: border-color var(--dur), background-color var(--dur);
}
.field select:hover, .field input:hover { border-color: var(--line-hover); background: var(--surface-2); }

.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 2px; }
.seg button {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 6px 12px; border-radius: 6px; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
.seg button:hover:not([aria-pressed="true"]) { color: var(--ink); }

.chip {
  font-family: var(--mono); font-size: 11px; padding: 6px 12px;
  border: 1px solid var(--line); border-radius: 999px; color: var(--muted);
  background: var(--surface);
}
.chip[aria-pressed="true"] { color: var(--accent-soft); border-color: var(--accent-line); background: var(--accent-wash); }
.chip:hover { color: var(--ink); border-color: var(--line-hover); }

.spacer { margin-left: auto; }

.perf {
  font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 10.5px; color: var(--muted);
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
}
.perf b { color: var(--ink); font-weight: 500; }
.perf .sep { color: var(--faint); }

/* Legend */
.legend {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 9px 20px; border-bottom: 1px solid var(--line-soft);
  font-family: var(--mono); font-size: 10.5px; color: var(--muted);
  background: var(--surface-deep);
}
.legend .li { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 9px; height: 9px; border-radius: 2px; }
.legend .sw.hatch { background: var(--crit-wash); box-shadow: inset 0 0 0 1px var(--crit); }
.legend .title { color: var(--ink); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; font-size: 10px; }

/* -- Panels ------------------------------------------------ */
.panel { padding: 0; }
.pane-head { padding: 20px 20px 0; }
.pane-head h2 { font-size: 16px; color: var(--ink); margin: 0 0 4px; font-weight: 600; letter-spacing: -0.25px; }
.pane-head p { margin: 0; font-size: 13px; color: var(--muted); max-width: 74ch; }

/* Names pinned, chart scrolling. The two SVGs share a y layout, so
   the rows line up; only the chart moves under the header. */
.gantt-shell { display: flex; align-items: flex-start; margin: 16px 0 20px; }
svg.gantt-names {
  flex: none; display: block;
  border-right: 1px solid var(--line);
  background: var(--bg);
  position: relative; z-index: 2;
}
.chart-wrap { overflow-x: auto; flex: 1; min-width: 0; padding-bottom: 4px; }
svg.gantt { display: block; }
.chart-wrap::-webkit-scrollbar { height: 9px; }
.chart-wrap::-webkit-scrollbar-track { background: var(--surface-deep); }
.chart-wrap::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
.chart-wrap::-webkit-scrollbar-thumb:hover { background: var(--line-hover); }

.notice {
  margin: 0 20px 18px; padding: 12px 15px;
  border: 1px solid var(--line); border-left: 2px solid var(--accent-line);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; background: var(--surface-deep);
  font-size: 12.5px; color: var(--muted);
}
.notice b { color: var(--body); font-weight: 600; }

/* Undated */
.undated { margin: 0 20px 22px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.undated summary {
  cursor: pointer; padding: 11px 14px; font-family: var(--mono);
  font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--warm);
}
.undated summary::marker { color: var(--faint); }
.undated summary:hover { color: var(--ink); }
.undated .rows { border-top: 1px solid var(--line); }
.undated .r {
  display: flex; align-items: center; gap: 12px; padding: 9px 14px;
  border-bottom: 1px solid var(--line-soft); font-size: 13px;
  transition: background-color var(--dur);
}
.undated .r:hover { background: var(--surface-2); }
.undated .r:last-child { border-bottom: none; }
.undated .r .nm { color: var(--body); flex: 1; min-width: 0; }

/* -- Tables ------------------------------------------------ */
.tbl-wrap { overflow-x: auto; padding: 6px 20px 22px; }
table.tbl {
  width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md);
}
table.tbl th {
  text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: #B0B0B0; font-weight: 600;
  padding: 10px 12px; background: var(--surface-2);
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.tbl th:first-child { border-top-left-radius: 11px; }
table.tbl th:last-child { border-top-right-radius: 11px; }
table.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
table.tbl tbody tr:last-child td { border-bottom: none; }
table.tbl tbody tr { transition: background-color var(--dur); }
table.tbl tbody tr:hover { background: var(--surface-2); }
table.tbl tbody tr { cursor: pointer; }
.tname { color: var(--ink); font-family: var(--mono); font-size: 12.5px; }
.tpath { color: var(--faint); font-size: 11px; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 4px; color: var(--bar-ink); font-weight: 600; white-space: nowrap;
}
.badge-late {
  display: inline-flex; align-items: center; gap: 4px; margin-left: 7px;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 3px;
  color: var(--crit); border: 1px solid var(--crit); background: var(--crit-wash);
}

.who { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.av {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: 0.02em;
  background: var(--surface-2); color: var(--warm); box-shadow: inset 0 0 0 1px var(--line);
}

/* -- Bandwidth ---------------------------------------------- */
table.bw-tbl td { white-space: nowrap; }
table.bw-tbl tbody tr { cursor: default; }
.bw-free { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--ink); }
.bw-free.bw-none { color: var(--faint); }
/* Overdue open work is the opposite of free, and must not read as a date. */
.bw-free.bw-late {
  color: var(--crit); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  border: 1px solid var(--crit); background: var(--crit-wash); border-radius: 3px; padding: 2px 7px;
}
/* The refusal, styled so it cannot be mistaken for a date. */
.bw-unknown {
  display: inline-flex; align-items: baseline; gap: 7px;
  font-family: var(--mono); font-size: 12.5px; color: var(--muted);
}
.bw-why {
  font-size: 9.5px; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--crit); border: 1px solid var(--crit); background: var(--crit-wash);
  border-radius: 3px; padding: 2px 6px;
}
/* The definition, printed on the sheet rather than kept in a note. */
.bw-rule {
  margin: 0 20px 12px; padding: 11px 15px;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2);
  font-size: 12.5px; color: var(--muted);
}
.bw-rule b { color: var(--body); font-weight: 600; }

/* -- Status board ------------------------------------------ */
.tiles {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px; padding: 6px 20px 18px;
}
.tile {
  border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface);
  padding: 14px; position: relative; overflow: hidden;
  transition: border-color var(--dur), transform var(--dur);
}
.tile:hover { border-color: var(--line-hover); transform: translateY(-1px); }
.tile::before { content: ""; position: absolute; inset: 0 auto auto 0; height: 2px; width: 46px; background: var(--st-closed); }
.tile .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 600; color: var(--ink); line-height: 1.1; letter-spacing: -0.02em; }
.tile .l {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted); margin-top: 6px;
}
.tile .p { position: absolute; top: 14px; right: 14px; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--faint); }

.board { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 16px; padding: 0 20px 22px; align-items: start; }
@media (max-width: 760px) { .board { grid-template-columns: 1fr; } }
.donut-card { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); padding: 16px; }
.donut-row { display: flex; align-items: center; gap: 16px; }
.dlegend { display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; min-width: 0; }
.dlegend .row { display: flex; align-items: center; gap: 8px; }
.dlegend .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.dlegend .nm { color: var(--body); flex: 1; white-space: nowrap; }
.dlegend .ct { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.dlegend .pc { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--faint); font-size: 11px; width: 34px; text-align: right; }

.grp { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; }
.grp + .grp { margin-top: 12px; }
.grp > .h {
  display: flex; align-items: center; gap: 9px; padding: 10px 13px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #B0B0B0;
  background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.grp > .h .ct { margin-left: auto; color: var(--faint); }
.grp .r { display: flex; align-items: center; gap: 12px; padding: 8px 13px; border-bottom: 1px solid var(--line-soft); font-size: 13px; cursor: pointer; transition: background-color var(--dur); }
.grp .r:last-child { border-bottom: none; }
.grp .r:hover { background: var(--surface-2); }
.grp .r .nm { color: var(--body); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12.5px; }
.grp .r .dt { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--faint); white-space: nowrap; }

/* -- Detail drawer ------------------------------------------
   The signature surface: the two-audience delay account. Panel
   enters on the house ease-out-expo, sits on the deep surface
   the AI panels use, and the marked comments carry the same
   tinted-accent citation treatment as answer chips. */
.scrim { position: fixed; inset: 0; background: rgba(8, 4, 2, 0.62); z-index: 60; animation: fade-in 0.25s ease both; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%);
  background: var(--surface-deep); border-left: 1px solid var(--line);
  z-index: 61; overflow-y: auto; padding: 0 0 40px;
  animation: drawer-in 0.35s var(--ease-out-expo) both;
}
.drawer .dh {
  position: sticky; top: 0; background: var(--surface-deep); border-bottom: 1px solid var(--line);
  padding: 16px 20px; display: flex; align-items: flex-start; gap: 14px; z-index: 2;
}
.drawer .dh .t { flex: 1; min-width: 0; }
.drawer .dh h3 { margin: 0 0 5px; font-size: 15px; color: var(--ink); font-weight: 600; font-family: var(--mono); letter-spacing: -0.01em; }
.drawer .dh .sub { font-size: 11.5px; color: var(--faint); font-family: var(--mono); }
.drawer .x { font-size: 19px; color: var(--muted); line-height: 1; padding: 2px 6px; border-radius: 6px; }
.drawer .x:hover { color: var(--ink); background: var(--surface); }

.dsec { padding: 16px 20px; border-bottom: 1px solid var(--line-soft); }
.dsec > h4 {
  margin: 0 0 10px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--faint); font-weight: 500;
}
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px 16px; }
.meta .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.meta .v { font-size: 13px; color: var(--ink); font-family: var(--mono); font-variant-numeric: tabular-nums; margin-top: 3px; }

.deeplink {
  display: flex; align-items: center; gap: 10px; padding: 11px 13px; width: 100%; text-align: left;
  border: 1px solid var(--accent-line); border-radius: var(--radius-sm); background: var(--accent-wash);
  font-family: var(--mono); font-size: 12px; color: var(--ink); word-break: break-all;
  transition: background-color var(--dur), border-color var(--dur);
}
.deeplink:hover { background: rgba(255, 99, 33, 0.14); }
.deeplink .arrow { color: var(--accent); flex: none; }
.deeplink .cp { margin-left: auto; flex: none; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-soft); }

.thread { display: flex; flex-direction: column; gap: 2px; }
.cmt { padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid transparent; }
.cmt.used { border-color: var(--accent-line); background: var(--accent-wash); }
.cmt .ch { display: flex; align-items: baseline; gap: 9px; margin-bottom: 4px; }
.cmt .au { font-size: 12.5px; color: var(--ink); font-weight: 500; }
.cmt .wh { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.cmt .tag {
  margin-left: auto; font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--accent-cite);
}
.cmt .bd { font-size: 13px; color: var(--body); }

.twoup { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 620px) { .twoup { grid-template-columns: 1fr; } }
.acct { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); padding: 13px; }
.acct h5 {
  margin: 0 0 8px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent-soft); font-weight: 500;
}
.acct p { margin: 0; font-size: 13px; line-height: 1.6; color: #E8E0D8; }
.gen-note { margin-top: 11px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  z-index: 90; background: var(--surface-2); border: 1px solid var(--line);
  border-left: 2px solid var(--crit); border-radius: var(--radius-sm);
  padding: 11px 15px; font-size: 13px; color: var(--body);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); max-width: min(520px, calc(100vw - 32px));
  animation: toast-in 0.3s var(--ease-out-expo) both;
}

  while (c <= e) {
    var w = c.getDay();
    if (w !== 0 && w !== 6) out.push(new Date(c));
    c = addDays(c, 1);
  }
  return out;
}

var SCALE = {
  week:    { perCol: 1,  colW: 30, label: "Week" },
  month:   { perCol: 5,  colW: 58, label: "Month" },
  quarter: { perCol: 22, colW: 104, label: "Quarter" }
};

/* Trim a label to the pixels actually available rather than to a
   character count. A monospace guess was close enough until a
   task called "Backwards and forwards capture compatibility"
   walked straight through the avatar column. */
var _mc = null;
function textPx(s, size, weight) {
  if (!_mc) _mc = document.createElement("canvas").getContext("2d");
  _mc.font = (weight || 400) + " " + (size || 12) + 'px "Geist Mono", monospace';
  return _mc.measureText(s).width;
}
function trimPx(s, maxPx, size, weight) {
  if (textPx(s, size, weight) <= maxPx) return s;
  var lo = 0, hi = s.length;
  while (lo < hi) {
    var mid = (lo + hi + 1) >> 1;
    if (textPx(s.slice(0, mid) + "…", size, weight) <= maxPx) lo = mid; else hi = mid - 1;
  }
  return s.slice(0, lo).replace(/[\s·-]+$/, "") + "…";
}

var MONO_SVG = "Geist Mono, ui-monospace, monospace";

function renderGantt(host) {
  var rows = scopedTasks();
  var dated = rows.filter(function (t) { return t.dated; });
  var undated = rows.filter(function (t) { return !t.dated; });

  if (!dated.length) {
    host.innerHTML = '<div class="notice">No dated tasks match this filter. ' +
      'The status filter and the late-only toggle both narrow the timeline; clear them to see the rest.</div>';
    renderUndated(host, undated);
    return;
  }

  var cfg = SCALE[S.scale] || SCALE.week;
  var lo = dated.reduce(function (m, t) { return t.start < m ? t.start : m; }, dated[0].start);
  var hi = dated.reduce(function (m, t) { return t.due > m ? t.due : m; }, dated[0].due);
  lo = addDays(lo, -4); hi = addDays(hi, 6);
  if (dayStart(TODAY) < lo) lo = addDays(TODAY, -4);
  if (dayStart(TODAY) > hi) hi = addDays(TODAY, 6);

  var wd = buildWorkdays(lo, hi);
  var N = wd.length;
  var wdKey = {};
  wd.forEach(function (x, i) { wdKey[dayStart(x).getTime()] = i; });

  // Fractional workday index, so a weekend date lands between the
  // Friday and the Monday rather than being snapped onto one of them.
  function wdIndex(date) {
    var k = dayStart(date).getTime();
    if (wdKey[k] !== undefined) return wdKey[k];
    if (k < dayStart(wd[0]).getTime()) return 0;
    if (k > dayStart(wd[N - 1]).getTime()) return N - 1;
    for (var i = 0; i < N - 1; i++) {
      var a = dayStart(wd[i]).getTime(), b = dayStart(wd[i + 1]).getTime();
      if (a < k && k < b) return i + (k - a) / (b - a);
    }
    return N - 1;
  }

  /* The names are their own SVG, pinned, and the chart scrolls beside
     it. One SVG for both was simpler to write and useless to read: at
     week scale the programme is wider than any screen, and scrolling
     to today took the task names off the left edge with it. The two
     share a y layout, so the rows still line up. */
  var NAME_W = 322, AV_W = 34, NAMES_W = NAME_W + AV_W, RIGHT = 96;
  var colsTotal = N / cfg.perCol;
  var chartW = colsTotal * cfg.colW;
  var HDR_A = 26, HDR_B = 19, HDR = HDR_A + HDR_B;
  var ROW_H = 40, BAR_H = 15, PLAN_H = 5, PLAN_GAP = 3;

  function X(date) { return (wdIndex(date) / cfg.perCol) * cfg.colW; }
  function Xend(date) { return ((wdIndex(date) + 1) / cfg.perCol) * cfg.colW; }

  // Group rows under their List, the way the workspace nests them.
  var groups = [], seen = {};
  dated.forEach(function (t) {
    var key = t.path.join(" › ");
    if (!seen[key]) { seen[key] = { key: key, path: t.path, items: [] }; groups.push(seen[key]); }
    seen[key].items.push(t);
  });
  groups.forEach(function (g) { g.items.sort(function (a, b) { return a.start - b.start; }); });

  var GRP_H = 27;
  var svgH = HDR + groups.reduce(function (s, g) { return s + GRP_H + g.items.length * ROW_H; }, 0) + 12;
  var svgW = chartW + RIGHT;

  var pn = [];  // names column
  var p = [];   // chart

  p.push('<defs>' +
    '<pattern id="lateHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
    '<rect width="6" height="6" fill="rgba(239,68,68,0.10)"/>' +
    '<line x1="0" y1="0" x2="0" y2="6" stroke="#EF4444" stroke-width="1.1" opacity="0.55"/></pattern>' +
    '<marker id="depHead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">' +
    '<path d="M0,0 L6,3 L0,6 z" fill="#8A7A66"/></marker>' +
    '</defs>');

  // --- Headers ---------------------------------------------------
  pn.push('<rect x="0" y="0" width="' + NAMES_W + '" height="' + HDR + '" fill="#140F0B"/>');
  pn.push('<text x="12" y="' + (HDR - 15) + '" fill="#606060" font-size="9" letter-spacing="0.11em" font-family="' + MONO_SVG + '">TASK</text>');
  pn.push('<line x1="0" y1="' + HDR + '" x2="' + NAMES_W + '" y2="' + HDR + '" stroke="#3A3028"/>');

  p.push('<rect x="0" y="0" width="' + svgW + '" height="' + HDR + '" fill="#140F0B"/>');
  var majorSeen = {};
  for (var c = 0; c < colsTotal; c++) {
    var idx = Math.min(N - 1, Math.round(c * cfg.perCol));
    var dt = wd[idx];
    var x = c * cfg.colW;
    var major, minor;
    if (S.scale === "week") {
      major = (dt.getDay() === 1 || c === 0) ? dt.toLocaleDateString("en-GB", { month: "short" }) + " " + dt.getDate() : "";
      minor = ["M", "T", "W", "T", "F"][dt.getDay() - 1] || "";
    } else if (S.scale === "month") {
      var mk = dt.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
      major = majorSeen[mk] ? "" : (majorSeen[mk] = 1, mk);
      minor = dt.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    } else {
      var qk = "Q" + (Math.floor(dt.getMonth() / 3) + 1) + " " + dt.getFullYear();
      major = majorSeen[qk] ? "" : (majorSeen[qk] = 1, qk);
      minor = dt.toLocaleDateString("en-GB", { month: "short" });
    }
    if (major) {
      p.push('<text x="' + (x + 5) + '" y="' + (HDR_A - 9) + '" fill="#B0B0B0" font-size="10.5" font-family="' + MONO_SVG + '">' + esc(major) + "</text>");
      p.push('<line x1="' + x + '" y1="4" x2="' + x + '" y2="' + svgH + '" stroke="#2A2018" stroke-width="1"/>');
    } else {
      p.push('<line x1="' + x + '" y1="' + HDR_A + '" x2="' + x + '" y2="' + svgH + '" stroke="#1C140E" stroke-width="1"/>');
    }
    p.push('<text x="' + (x + cfg.colW / 2) + '" y="' + (HDR - 6) + '" text-anchor="middle" fill="#606060" font-size="9" font-family="' + MONO_SVG + '">' + esc(minor) + "</text>");
  }
  p.push('<line x1="0" y1="' + HDR + '" x2="' + svgW + '" y2="' + HDR + '" stroke="#3A3028"/>');

  // Today — the one orange moment on the chart.
  var todayX = X(TODAY), todayW = Math.max(2, cfg.colW / cfg.perCol);
  p.push('<rect x="' + todayX + '" y="' + HDR + '" width="' + todayW + '" height="' + (svgH - HDR) + '" fill="rgba(255,99,33,0.05)"/>');
  p.push('<line x1="' + todayX + '" y1="' + HDR_A + '" x2="' + todayX + '" y2="' + svgH + '" stroke="#FF6321" stroke-width="1.2"/>');
  p.push('<text x="' + (todayX + 4) + '" y="' + (HDR_A - 9) + '" fill="#FF6321" font-size="8.5" font-weight="600" font-family="' + MONO_SVG + '">TODAY</text>');

  // --- Rows -------------------------------------------------------
  var y = HDR;
  var barPos = {};
  groups.forEach(function (g) {
    pn.push('<text x="12" y="' + (y + 18) + '" fill="#808080" font-size="10" font-family="' + MONO_SVG + '" letter-spacing="0.06em">' +
      esc(trimPx(g.path.join("  ›  ").toUpperCase(), NAMES_W - 24, 10)) + "</text>");
    pn.push('<line x1="0" y1="' + (y + GRP_H - 1) + '" x2="' + NAMES_W + '" y2="' + (y + GRP_H - 1) + '" stroke="#1C140E"/>');
    p.push('<line x1="0" y1="' + (y + GRP_H - 1) + '" x2="' + svgW + '" y2="' + (y + GRP_H - 1) + '" stroke="#1C140E"/>');
    y += GRP_H;

    g.items.forEach(function (t) {
      var st = STATES[t.state];
      var bx = X(t.start), bw = Math.max(cfg.colW / cfg.perCol, Xend(t.due) - bx);
      var by = y + (ROW_H - BAR_H - PLAN_GAP - PLAN_H) / 2;
      // Dependency arrows leave from under the source bar rather than
      // through its middle: routed at the centre line they drew
      // straight across the due date sitting to its right.
      barPos[t.id] = { x: bx, w: bw, y: by + BAR_H / 2, bottom: y + ROW_H - 5 };

      var tip = esc(t.name + " — " + st.label + (t.overdue ? ", " + t.lateDays + " days past due" : "") +
        " · " + fmt(t.start) + " to " + fmt(t.due));

      // Name side
      pn.push('<g class="row" data-task="' + esc(t.id) + '" style="cursor:pointer">');
      pn.push('<rect x="0" y="' + y + '" width="' + NAMES_W + '" height="' + ROW_H + '" fill="transparent"><title>' + tip + "</title></rect>");
      pn.push('<circle cx="12" cy="' + (y + ROW_H / 2) + '" r="3" fill="' + st.color + '"/>');
      pn.push('<text x="26" y="' + (y + ROW_H / 2 + 4) + '" fill="#E8E0D8" font-size="12" font-family="' + MONO_SVG + '">' +
        esc(trimPx(t.name, NAME_W - 54, 12)) + "</text>");
      pn.push('<circle cx="' + (NAME_W + 15) + '" cy="' + (y + ROW_H / 2) + '" r="10" fill="#221A14" stroke="#3A3028"/>');
      pn.push('<text x="' + (NAME_W + 15) + '" y="' + (y + ROW_H / 2 + 3) + '" text-anchor="middle" fill="#A89888" font-size="8" font-weight="600" font-family="' + MONO_SVG + '">' +
        esc(t.person.initials) + "</text>");
      pn.push("</g>");

      // Chart side
      p.push('<g class="row" data-task="' + esc(t.id) + '" style="cursor:pointer">');
      p.push('<rect x="0" y="' + y + '" width="' + svgW + '" height="' + ROW_H + '" fill="transparent"><title>' + tip + "</title></rect>");

      if (t.overdue) {
        var hx = Xend(t.due), hw = Math.max(3, todayX - hx);
        p.push('<rect x="' + hx + '" y="' + by + '" width="' + hw + '" height="' + BAR_H + '" fill="url(#lateHatch)"/>');
      }

      p.push('<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + BAR_H + '" rx="4" fill="' + st.color + '"/>');
      var lbl = st.label.toLowerCase();
      if (bw > textPx(lbl, 9.5, 600) + 14) {
        p.push('<text x="' + (bx + 7) + '" y="' + (by + BAR_H - 4) + '" fill="#140F0B" font-size="9.5" font-weight="600" font-family="' + MONO_SVG + '">' + esc(lbl) + "</text>");
      }

      // Planned-window lane — drawn ONLY where the plan and the current
      // dates disagree (t.slipped). Set as a dimension line, the way a
      // drawing marks an original extent: two end ticks and a rule.
      if (t.planned && t.slipped) {
        var px = X(t.planned.start), px2 = Math.max(px + 4, Xend(t.planned.due));
        var ly = by + BAR_H + PLAN_GAP + Math.ceil(PLAN_H / 2);
        p.push('<g opacity="0.95"><title>' +
          esc("Originally planned " + fmt(t.planned.start) + " – " + fmt(t.planned.due)) + '</title>' +
          '<path d="M' + px + ',' + (ly - 3) + ' v6 M' + px + ',' + ly + ' H' + px2 +
          ' M' + px2 + ',' + (ly - 3) + ' v6" stroke="#8A7A66" stroke-width="1.2" fill="none"/></g>');
      }

      // On a late row the labels start past the hatch, not on top of
      // it — red text on the red overdue fill was the one thing in
      // the first build nobody could read.
      var rx = t.overdue ? Math.max(bx + bw + 9, todayX + 10) : bx + bw + 9;
      p.push('<text x="' + rx + '" y="' + (by + BAR_H - 3) + '" fill="#808080" font-size="10" font-family="' + MONO_SVG + '">' + esc(fmt(t.due)) + "</text>");
      var rx2 = rx + 46;
      if (t.overdue) {
        p.push('<text x="' + rx2 + '" y="' + (by + BAR_H - 3) + '" fill="#EF4444" font-size="9.5" font-weight="600" font-family="' + MONO_SVG + '">' + t.lateDays + "d late</text>");
        rx2 += 50;
      }
      if (t.analysis) {
        p.push('<text x="' + rx2 + '" y="' + (by + BAR_H - 3) + '" fill="#FF8C5A" font-size="9.5" font-family="' + MONO_SVG + '">why?</text>');
      }
      p.push("</g>");
      y += ROW_H;
    });
  });

  // Dependency arrows last, so they sit above the grid
  dated.forEach(function (t) {
    (t.deps || []).forEach(function (dep) {
      var a = barPos[dep], b = barPos[t.id];
      if (!a || !b) return;
      var x1 = a.x + a.w / 2, y1 = a.bottom, x2 = b.x - 3, y2 = b.y;
      var mx = Math.max(x1 + 8, x2 - 10);
      p.push('<path d="M' + x1 + "," + y1 + " H" + mx + " V" + y2 + " H" + x2 + '" fill="none" stroke="#8A7A66" stroke-width="1" marker-end="url(#depHead)" opacity="0.7"/>');
    });
  });

  host.innerHTML =
    '<div class="pane-head"><h2>' + esc(PERSON[S.person].name) + " · " + dated.length + " dated task" + (dated.length === 1 ? "" : "s") + "</h2>" +
    "<p>Every bar opens the task it stands for. The thin dimension line under a bar marks the window the task was originally planned for, drawn only where the plan and the current dates disagree. Weekends are not columns — a five-day task is five columns wide at every scale.</p></div>" +
    '<div class="gantt-shell">' +
      '<svg class="gantt-names" width="' + NAMES_W + '" height="' + svgH + '" viewBox="0 0 ' + NAMES_W + " " + svgH + '" role="presentation">' + pn.join("") + "</svg>" +
      '<div class="chart-wrap"><svg class="gantt" width="' + svgW + '" height="' + svgH + '" viewBox="0 0 ' + svgW + " " + svgH +
        '" role="img" aria-label="Timeline of ' + esc(PERSON[S.person].name) + "'s dated tasks\">" + p.join("") + "</svg></div>" +
    "</div>";

  renderUndated(host, undated);

  host.querySelectorAll("g.row").forEach(function (g) {
    g.addEventListener("click", function () { openTask(g.getAttribute("data-task")); });
  });

  // Open on today. A timeline that opens on its earliest task shows
  // the month everyone has stopped thinking about, and the first thing
  // every reviewer did was scroll right.
  var wrap = host.querySelector(".chart-wrap");
  if (wrap) wrap.scrollLeft = Math.max(0, todayX - wrap.clientWidth * 0.62);
}

function renderUndated(host, undated) {
  if (!undated.length) return;
  var h = ['<details class="undated"><summary>Tasks without dates (' + undated.length + ')</summary><div class="rows">'];
  undated.forEach(function (t) {
    h.push('<div class="r" data-task="' + esc(t.id) + '" style="cursor:pointer">' +
      '<span class="pill" style="background:' + STATES[t.state].color + '">' + esc(STATES[t.state].label) + '</span>' +
      '<span class="nm mono">' + esc(t.name) + '</span>' +
      '<span class="tpath mono">' + esc(t.path.join(" › ")) + "</span></div>");
  });
  h.push("</div></details>");
  var wrap = document.createElement("div");
  wrap.innerHTML = h.join("");
  host.appendChild(wrap.firstChild);
  host.querySelectorAll(".undated .r").forEach(function (r) {
    r.addEventListener("click", function () { openTask(r.getAttribute("data-task")); });
  });
}

/* ============================================================
   7 — Bandwidth
   The question a lead actually brings to this screen is "when does
   this person come free", not "how loaded are they" — so the view
   answers that: the day after their last active dated task, split
   by in-progress and to-do, plus the gaps in between.

   The decision the case study rests on lives in one column. An
   assignee whose remaining work carries no dates computes as free
   from today, which is almost always wrong — the work exists, the
   dates do not. Those people are not shown as available; they are
   shown as not known, with the count of what is missing.
   ============================================================ */
function weekStart(x) {
  var t = dayStart(x), off = (t.getDay() + 6) % 7;
  return addDays(t, -off);
}

function bandwidthFor(who) {
  var mine = TASKS.filter(function (t) { return t.who === who && stateAllowed(t.state); });
  var active = mine.filter(function (t) { return !STATES[t.state].terminal; });
  var activeDated = active.filter(function (t) { return t.dated; });
  var activeUndated = active.filter(function (t) { return !t.dated; });

  /* Three different answers, and collapsing them was the first bug here.
     Nothing of this kind queued is "none". Work that should already have
     finished and has not is "overdue" — emphatically not free, which is
     what a naive latest-end-date comparison reports. Only a real future
     end date produces a date. */
  function freeFrom(list) {
    if (!list.length) return { date: null, label: "none", kind: "none" };
    var latest = null;
    list.forEach(function (t) { if (!latest || t.due > latest) latest = t.due; });
    if (dayStart(latest) < dayStart(TODAY)) return { date: null, label: "overdue", kind: "late" };
    var next = addDays(latest, 1);
    return { date: next, label: fmt(next), kind: "date" };
  }

  var all = freeFrom(activeDated);
  var prog = freeFrom(activeDated.filter(function (t) { return t.state === "prog"; }));
  var todo = freeFrom(activeDated.filter(function (t) { return t.state === "todo"; }));

  /* Free days are the working days in the next fortnight that no active
     dated task covers — counted forward from today, not only as gaps
     between two tasks. Counting gaps alone reported nothing for anyone
     whose work simply runs out, which is the commonest case there is. */
  var horizon = addDays(TODAY, 14);
  var freeDays = 0, gaps = [], run = null;
  for (var c = dayStart(TODAY); c <= horizon; c = addDays(c, 1)) {
    var dw = c.getDay();
    if (dw === 0 || dw === 6) continue;
    var day = c.getTime();
    var busy = activeDated.some(function (t) {
      return dayStart(t.start).getTime() <= day && day <= dayStart(t.due).getTime();
    });
    if (busy) { if (run) { gaps.push(run); run = null; } continue; }
    freeDays++;
    if (run) run.to = new Date(c);
    else run = { from: new Date(c), to: new Date(c) };
  }
  if (run) gaps.push(run);

  return {
    active: active.length, dated: activeDated.length, undated: activeUndated.length,
    all: all, prog: prog, todo: todo, freeDays: freeDays, gaps: gaps
  };
}

function renderBandwidth(host) {
  var rows = PEOPLE.map(function (p) { return { p: p, b: bandwidthFor(p.id) }; });

  var h = ['<div class="pane-head"><h2>Team bandwidth · who comes free, and when</h2>' +
    '<p>The day after each person’s last active dated task, split by the work in progress and the work not started, ' +
    'with the working days that fall free in between over the next fortnight. Nothing here is a forecast — it reads the dates that exist in the workspace today.</p></div>'];

  h.push('<div class="tbl-wrap"><table class="tbl bw-tbl"><thead><tr>' +
    '<th>Person</th><th>Active</th><th>Dated</th><th>Free from</th>' +
    '<th>In progress until</th><th>To do until</th><th>Free days · next 14</th>' +
    "</tr></thead><tbody>");

  rows.forEach(function (r) {
    var b = r.b;
    // The whole argument, in one cell.
    var unknown = b.undated > 0;
    var freeCell = unknown
      ? '<span class="bw-unknown" title="' +
        esc(b.undated + " active task" + (b.undated === 1 ? "" : "s") +
            " carry no dates, so this person's next free day cannot be computed. Shown as not known rather than as free.") +
        '">not known <span class="bw-why">' + b.undated + ' undated</span></span>'
      : '<span class="bw-free bw-' + b.all.kind + '">' + esc(b.all.label) + "</span>";
    var cell = function (f) { return '<span class="bw-free bw-' + f.kind + '">' + esc(f.label) + "</span>"; };

    h.push("<tr>" +
      '<td><span class="who"><span class="av">' + esc(r.p.initials) + "</span>" +
        '<span><span style="color:var(--ink);font-size:13px;display:block">' + esc(r.p.name) + "</span>" +
        '<span style="font-size:10.5px;color:var(--faint)">' + esc(r.p.role) + "</span></span></span></td>" +
      '<td class="mono">' + b.active + "</td>" +
      '<td class="mono" style="color:' + (b.undated ? "var(--warn)" : "var(--muted)") + '">' +
        b.dated + (b.undated ? " <span style=\"color:var(--faint)\">of " + b.active + "</span>" : "") + "</td>" +
      "<td>" + freeCell + "</td>" +
      "<td>" + cell(b.prog) + "</td>" +
      "<td>" + cell(b.todo) + "</td>" +
      // Free days are as unknowable as the free-from date when work is undated.
      '<td class="mono" style="color:var(--muted)">' + (unknown ? '<span class="bw-unknown">not known</span>' :
        (b.freeDays ? b.freeDays + (b.gaps.length ? ' <span style="color:var(--faint)" title="' +
          esc(b.gaps.map(function (g) { return fmt(g.from) + "–" + fmt(g.to); }).join(" · ")) +
          '">in ' + b.gaps.length + (b.gaps.length === 1 ? " run" : " runs") + "</span>" : "") : "—")) +
        "</td></tr>");
  });
  h.push("</tbody></table></div>");

  /* The rule travels with the number. Two teams once held contradictory
     capacity figures in good faith because the definition lived in a
     metrics note nobody opened; printing it on the sheet is the whole
     fix, and it costs one line. */
  var undatedAll = TASKS.filter(function (t) { return !t.dated && !STATES[t.state].terminal; }).length;
  var withheld = rows.filter(function (r) { return r.b.undated > 0; }).length;
  h.push('<div class="bw-rule"><b>Committed capacity</b> means working days on tasks carrying a start date, a due date ' +
    'and an assignee, excluding weekends. Anything missing one of the three is excluded and counted as undated — ' +
    '<b>' + undatedAll + '</b> active tasks here, across <b>' + withheld + '</b> of the ' + PEOPLE.length + ' people, ' +
    'whose next free day is withheld rather than guessed. ' +
    'Across the real workspace this reads <b>58 task lists</b> and <b>30 engineers</b> in three teams, on one definition instead of three.</div>');

  h.push('<div class="notice"><b>Why “not known” is not “free”.</b> Computed naively, an engineer whose remaining work carries ' +
    'no dates comes out free from today — the work exists, the dates do not. An earlier build read that as spare capacity, ' +
    'which would have put real staffing decisions on top of a data gap. The column now refuses to answer and says how much ' +
    'is missing, which is the only version of this number a lead can act on.</div>');

  host.innerHTML = h.join("");
}

/* ============================================================
   8 — List
   ============================================================ */
function renderList(host) {
  var rows = scopedTasks().slice().sort(function (a, b) {
    if (!a.due) return 1;
    if (!b.due) return -1;
    return a.due - b.due;
  });

  var h = ['<div class="pane-head"><h2>All tasks · ' + rows.length + " row" + (rows.length === 1 ? "" : "s") + "</h2>" +
    "<p>Every person, sorted by due date. Rows open the same panel the timeline opens.</p></div>"];
  h.push('<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
    "<th>Task</th><th>State</th><th>Assignee</th><th>Start</th><th>Due</th><th>Space › list</th>" +
    "</tr></thead><tbody>");
  rows.forEach(function (t) {
    h.push('<tr data-task="' + esc(t.id) + '">' +
      '<td><div class="tname">' + esc(t.name) + "</div></td>" +
      '<td><span class="pill" style="background:' + STATES[t.state].color + '">' + esc(STATES[t.state].label) + "</span>" +
        (t.overdue ? '<span class="badge-late">' + t.lateDays + "d late</span>" : "") + "</td>" +
      '<td><span class="who"><span class="av">' + esc(t.person.initials) + "</span>" + esc(t.person.name) + "</span></td>" +
      '<td class="mono" style="color:var(--muted)">' + esc(fmt(t.start)) + "</td>" +
      '<td class="mono" style="color:' + (t.overdue ? "var(--crit)" : "var(--body)") + '">' + esc(fmt(t.due)) + "</td>" +
      '<td class="tpath mono">' + esc(t.path.join(" › ")) + "</td></tr>");
  });
  h.push("</tbody></table></div>");
  host.innerHTML = h.join("");
  host.querySelectorAll("tbody tr").forEach(function (r) {
    r.addEventListener("click", function () { openTask(r.getAttribute("data-task")); });
  });
}

/* ============================================================
   9 — Status board
   Six tiles, a donut over the five workflow states, and the
   same numbers again as a table beside it. Overdue is a tile,
   never a donut slice: a task can be in progress and overdue at
   once, and a pie that counts it twice is a pie that lies.
   ============================================================ */
function donut(counts, total) {
  var R = 66, r = 42, cx = 78, cy = 78, a = -Math.PI / 2, out = [];
  STATE_ORDER.forEach(function (k) {
    var v = counts[k] || 0;
    if (!v) return;
    var sweep = (v / total) * Math.PI * 2;
    var a2 = a + sweep;
    var large = sweep > Math.PI ? 1 : 0;
    var x1 = cx + R * Math.cos(a), y1 = cy + R * Math.sin(a);
    var x2 = cx + R * Math.cos(a2), y2 = cy + R * Math.sin(a2);
    var x3 = cx + r * Math.cos(a2), y3 = cy + r * Math.sin(a2);
    var x4 = cx + r * Math.cos(a), y4 = cy + r * Math.sin(a);
    out.push('<path d="M' + x1 + "," + y1 + " A" + R + "," + R + " 0 " + large + ",1 " + x2 + "," + y2 +
      " L" + x3 + "," + y3 + " A" + r + "," + r + " 0 " + large + ",0 " + x4 + "," + y4 + ' Z" fill="' +
      STATES[k].color + '" stroke="#1A1410" stroke-width="2"><title>' +
      esc(STATES[k].label + ": " + v + " of " + total) + "</title></path>");
    a = a2;
  });
  return '<svg width="156" height="156" viewBox="0 0 156 156" role="img" aria-label="Task states">' + out.join("") +
    '<text x="78" y="76" text-anchor="middle" fill="#FFFFFF" font-size="25" font-family="' + MONO_SVG + '">' + total + "</text>" +
    '<text x="78" y="93" text-anchor="middle" fill="#606060" font-size="9.5" font-family="' + MONO_SVG + '">tasks</text></svg>';
}

function renderStatus(host) {
  var rows = scopedTasks();
  var counts = {}, total = rows.length;
  STATE_ORDER.forEach(function (k) { counts[k] = 0; });
  rows.forEach(function (t) { counts[t.state]++; });
  var overdue = rows.filter(function (t) { return t.overdue; }).length;
  var pct = function (v) { return total ? Math.round((v / total) * 100) : 0; };

  var h = ['<div class="pane-head"><h2>' + esc(PERSON[S.person].name) + " · status board</h2>" +
    "<p>The view people land on from a link. Counting it as use would measure link-following rather than use of the product, so it is excluded from the weekly-user figure.</p></div>"];

  h.push('<div class="tiles">');
  STATE_ORDER.forEach(function (k) {
    h.push('<div class="tile"><div style="position:absolute;inset:0 auto auto 0;height:2px;width:46px;background:' + STATES[k].color + '"></div>' +
      '<div class="v">' + counts[k] + '</div><div class="l">' + esc(STATES[k].label) + '</div><div class="p">' + pct(counts[k]) + "%</div></div>");
  });
  h.push('<div class="tile"><div style="position:absolute;inset:0 auto auto 0;height:2px;width:46px;background:#EF4444"></div>' +
    '<div class="v" style="color:' + (overdue ? "#EF4444" : "var(--ink)") + '">' + overdue + '</div>' +
    '<div class="l">Overdue</div><div class="p">' + pct(overdue) + "%</div></div>");
  h.push("</div>");

  h.push('<div class="board"><div class="donut-card"><div class="donut-row">' + donut(counts, total) + '<div class="dlegend">');
  STATE_ORDER.forEach(function (k) {
    h.push('<div class="row"><span class="sw" style="background:' + STATES[k].color + '"></span>' +
      '<span class="nm">' + esc(STATES[k].label) + '</span><span class="ct">' + counts[k] + '</span><span class="pc">' + pct(counts[k]) + "%</span></div>");
  });
  h.push("</div></div>" +
    '<p style="margin:14px 0 0;font-size:12px;color:var(--muted)">Overdue is deliberately not a slice. ' +
    "A task can be in progress and overdue at the same time, and a ring that counted it twice would not add up.</p></div>");

  h.push("<div>");
  STATE_ORDER.forEach(function (k) {
    var items = rows.filter(function (t) { return t.state === k; });
    if (!items.length) return;
    h.push('<div class="grp"><div class="h"><span class="sw" style="width:9px;height:9px;border-radius:2px;background:' + STATES[k].color + ';display:inline-block"></span>' +
      esc(STATES[k].label) + '<span class="ct">' + items.length + "</span></div>");
    items.forEach(function (t) {
      h.push('<div class="r" data-task="' + esc(t.id) + '"><span class="nm">' + esc(t.name) + "</span>" +
        (t.overdue ? '<span class="badge-late">' + t.lateDays + "d</span>" : "") +
        '<span class="dt">' + esc(fmt(t.due)) + "</span></div>");
    });
    h.push("</div>");
  });
  h.push("</div></div>");

  host.innerHTML = h.join("");
  host.querySelectorAll(".grp .r").forEach(function (r) {
    r.addEventListener("click", function () { openTask(r.getAttribute("data-task")); });
  });
}

/* ============================================================
   10 — Delay analysis index
   ============================================================ */
function renderDelays(host) {
  var h = ['<div class="pane-head"><h2>Delay analysis · ' + EXPLAINED.length + " open tasks with a written account</h2>" +
    "<p>Each one is produced by reading the comment thread on the task and writing two accounts of it: one for someone who will touch the code, one for someone who will not. " +
    "It explains and never predicts — there is no completion date anywhere on this page, because a forecast people plan against needs evidence this data cannot carry.</p></div>"];

  h.push('<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
    "<th>Task</th><th>Assignee</th><th>State</th><th>Due</th><th>Read from</th><th>Generated</th>" +
    "</tr></thead><tbody>");
  EXPLAINED.forEach(function (t) {
    var used = (t.thread || []).filter(function (c) { return c.used; }).length;
    h.push('<tr data-task="' + esc(t.id) + '">' +
      '<td><div class="tname">' + esc(t.name) + "</div></td>" +
      '<td><span class="who"><span class="av">' + esc(t.person.initials) + "</span>" + esc(t.person.name) + "</span></td>" +
      '<td><span class="pill" style="background:' + STATES[t.state].color + '">' + esc(STATES[t.state].label) + "</span>" +
        (t.overdue ? '<span class="badge-late">' + t.lateDays + "d late</span>" : "") + "</td>" +
      '<td class="mono" style="color:' + (t.overdue ? "var(--crit)" : "var(--body)") + '">' + esc(fmt(t.due)) + "</td>" +
      '<td class="mono" style="color:var(--muted)">' + used + " of " + (t.thread || []).length + " comments</td>" +
      '<td class="mono" style="color:var(--faint)">' + esc(t.analysis.generatedAt) + "</td></tr>");
  });
  h.push("</tbody></table></div>");

  h.push('<div class="notice"><b>The cache is the part I would change.</b> A generated account is held for thirty minutes, ' +
    "set to control generation cost before there was any usage data to set it from. The effect is that two people opening the same slipped task " +
    "ten minutes apart can read different words about it, and that inconsistency has cost more credibility in one meeting than the caching has saved all year.</div>");

  host.innerHTML = h.join("");
  host.querySelectorAll("tbody tr").forEach(function (r) {
    r.addEventListener("click", function () { openTask(r.getAttribute("data-task")); });
  });
}

/* ============================================================
   11 — Task drawer
   ============================================================ */
function openTask(id) {
  var t = BY_ID[id];
  if (!t) return;
  S.task = id;
  writeURL();
  closeDrawer(true);

  var scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.id = "scrim";
  scrim.addEventListener("click", function () { closeDrawer(); });

  var dr = document.createElement("aside");
  dr.className = "drawer";
  dr.id = "drawer";
  dr.setAttribute("role", "dialog");
  dr.setAttribute("aria-label", t.name);

  var st = STATES[t.state];
  var url = "https://app.clickup.com/t/" + t.id;
  var h = [];

  h.push('<div class="dh"><div class="t"><h3>' + esc(t.name) + "</h3>" +
    '<div class="sub">' + esc(t.path.join(" › ")) + " · " + esc(t.id) + "</div></div>" +
    '<button class="x" id="drawerClose" aria-label="Close">✕</button></div>');

  h.push('<div class="dsec"><div class="meta">' +
    '<div><div class="k">State</div><div class="v"><span class="pill" style="background:' + st.color + '">' + esc(st.label) + "</span>" +
      (t.overdue ? '<span class="badge-late">' + t.lateDays + "d late</span>" : "") + "</div></div>" +
    '<div><div class="k">Assignee</div><div class="v">' + esc(t.person.name) + "</div></div>" +
    '<div><div class="k">Start</div><div class="v">' + esc(fmtLong(t.start)) + "</div></div>" +
    '<div><div class="k">Due</div><div class="v" style="color:' + (t.overdue ? "var(--crit)" : "var(--ink)") + '">' + esc(fmtLong(t.due)) + "</div></div>" +
    (t.planned ? '<div><div class="k">Originally planned</div><div class="v" style="color:var(--muted)">' +
      esc(fmt(t.planned.start)) + " – " + esc(fmt(t.planned.due)) + "</div></div>" : "") +
    "</div></div>");

  h.push('<div class="dsec"><h4>Deep link — the concession that replaced write-back</h4>' +
    '<button class="deeplink" id="copyLink"><span class="arrow">↗</span><span>' + esc(url) + '</span><span class="cp">Copy</span></button>' +
    '<p style="margin:10px 0 0;font-size:12.5px;color:var(--muted)">Every element on every view carries one of these. ' +
    "It cost a week of plumbing and it is why 26 of the 31 wrong dates spotted last quarter were corrected within a day, without this dashboard ever holding a write credential.</p></div>");

  if (t.thread && t.thread.length) {
    h.push('<div class="dsec"><h4>Comment thread · ' + t.thread.length + " comments</h4><div class=\"thread\">");
    t.thread.forEach(function (c) {
      h.push('<div class="cmt' + (c.used ? " used" : "") + '"><div class="ch">' +
        '<span class="au">' + esc(c.au) + '</span><span class="wh">' + esc(fmt(c.wh)) + "</span>" +
        (c.used ? '<span class="tag">read by the analysis</span>' : "") + "</div>" +
        '<div class="bd">' + esc(c.tx) + "</div></div>");
    });
    h.push("</div></div>");
  }

  if (t.analysis) {
    h.push('<div class="dsec"><h4>Why it slipped — both accounts, generated together</h4><div class="twoup">' +
      '<div class="acct"><h5>Technical</h5><p>' + esc(t.analysis.technical) + "</p></div>" +
      '<div class="acct"><h5>Plain language</h5><p>' + esc(t.analysis.plain) + "</p></div></div>" +
      '<div class="gen-note">Generated ' + esc(t.analysis.generatedAt) + " from the marked comments · cached for " + esc(t.analysis.cached) +
      " · gpt-4o-mini · no completion date is produced, by design</div></div>");
  } else {
    h.push('<div class="dsec"><h4>Why it slipped</h4>' +
      '<p style="margin:0;font-size:13px;color:var(--muted)">Nothing to explain — this task is not late and its thread carries no blocker. ' +
      "An account is written for open tasks whose comments describe a hold; inventing one for the rest would make the ones that matter harder to find.</p></div>");
  }

  h.push('<div class="dsec"><h4>Edit</h4>' +
    '<button id="tryEdit" style="border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:var(--surface);color:var(--muted);font-size:13px">Change the due date</button>' +
    '<p style="margin:10px 0 0;font-size:12.5px;color:var(--muted)">Try it.</p></div>');

  dr.innerHTML = h.join("");
  document.body.appendChild(scrim);
  document.body.appendChild(dr);

  dr.querySelector("#drawerClose").addEventListener("click", function () { closeDrawer(); });
  dr.querySelector("#tryEdit").addEventListener("click", function () {
    refuse("Changing a due date is the one thing this dashboard will never do.");
  });
  dr.querySelector("#copyLink").addEventListener("click", function () {
    if (navigator.clipboard) navigator.clipboard.writeText(url).catch(function () {});
    var cp = dr.querySelector("#copyLink .cp");
    if (cp) { cp.textContent = "Copied"; setTimeout(function () { cp.textContent = "Copy"; }, 1600); }
  });
  document.addEventListener("keydown", escClose);
}

function escClose(e) { if (e.key === "Escape") closeDrawer(); }
function closeDrawer(silent) {
  var a = document.getElementById("scrim"), b = document.getElementById("drawer");
  if (a) a.remove();
  if (b) b.remove();
  document.removeEventListener("keydown", escClose);
  if (!silent) { S.task = null; writeURL(); }
}

/* ============================================================
   12 — Controls, legend, and the render loop
   ============================================================ */
function renderControls() {
  var c = document.getElementById("controls");
  var h = [];

  if (S.view === "gantt" || S.view === "status") {
    h.push('<div class="field"><label for="who">Assignee</label><select id="who">' +
      PEOPLE.map(function (p) {
        return '<option value="' + p.id + '"' + (p.id === S.person ? " selected" : "") + ">" + esc(p.name) + " · " + esc(p.role) + "</option>";
      }).join("") + "</select></div>");
  }

  if (S.view === "gantt") {
    h.push('<div class="field"><label>Scale</label><div class="seg" id="scaleSeg">' +
      ["week", "month", "quarter"].map(function (k) {
        return '<button data-scale="' + k + '" aria-pressed="' + (S.scale === k) + '">' + SCALE[k].label + "</button>";
      }).join("") + "</div></div>");
  }

  h.push('<div class="field"><label>State</label><div style="display:flex;gap:6px;flex-wrap:wrap">' +
    STATE_ORDER.map(function (k) {
      return '<button class="chip" data-state="' + k + '" aria-pressed="' + stateAllowed(k) + '">' + esc(STATES[k].label) + "</button>";
    }).join("") +
    '<button class="chip" data-late="1" aria-pressed="' + S.lateOnly + '">Late only</button>' +
    "</div></div>");

  h.push('<div class="spacer"></div>');
  h.push('<div class="perf" id="perf"></div>');
  h.push('<button class="chip" id="exportBtn" style="align-self:flex-end">Export SVG</button>');

  c.innerHTML = h.join("");

  var who = document.getElementById("who");
  if (who) who.addEventListener("change", function () { S.person = who.value; render(); });

  c.querySelectorAll("[data-scale]").forEach(function (b) {
    b.addEventListener("click", function () { S.scale = b.getAttribute("data-scale"); render(); });
  });
  c.querySelectorAll("[data-state]").forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.getAttribute("data-state");
      var cur = S.states ? S.states.slice() : STATE_ORDER.slice();
      var i = cur.indexOf(k);
      if (i === -1) cur.push(k); else cur.splice(i, 1);
      S.states = cur.length === STATE_ORDER.length ? null : cur;
      render();
    });
  });
  var lateBtn = c.querySelector("[data-late]");
  if (lateBtn) lateBtn.addEventListener("click", function () { S.lateOnly = !S.lateOnly; render(); });

  document.getElementById("exportBtn").addEventListener("click", function () {
    var svg = document.querySelector("svg.gantt");
    if (!svg) { refuse("There is no timeline on screen to export."); return; }
    var blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>' + svg.outerHTML], { type: "image/svg+xml" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "timeline-" + S.person + "-" + S.scale + ".svg";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
}

function renderLegend() {
  var el = document.getElementById("legend");
  var items = ['<span class="title">Legend</span>'];
  STATE_ORDER.forEach(function (k) {
    items.push('<span class="li"><span class="sw" style="background:' + STATES[k].color + '"></span>' + esc(STATES[k].label) + "</span>");
  });
  items.push('<span class="li"><span class="sw hatch"></span>past due</span>');
  items.push('<span class="li"><svg width="18" height="8" viewBox="0 0 18 8" aria-hidden="true" style="display:block">' +
    '<path d="M1,1 v6 M1,4 H17 M17,1 v6" stroke="#8A7A66" stroke-width="1.2" fill="none"/></svg>originally planned</span>');
  items.push('<span class="li"><span class="sw" style="background:#FF6321;width:2px;height:12px;border-radius:0"></span>today · Wed 26 Aug 2026</span>');
  el.innerHTML = items.join("");
}

var FIRST_PAINT = true;
function render() {
  var t0 = performance.now();
  var host = document.getElementById("panel");

  document.querySelectorAll(".tab").forEach(function (b) {
    b.setAttribute("aria-selected", String(b.getAttribute("data-view") === S.view));
  });
  document.getElementById("delayN").textContent = EXPLAINED.length;

  renderControls();
  renderLegend();

  if (S.view === "bandwidth") renderBandwidth(host);
  else if (S.view === "list") renderList(host);
  else if (S.view === "status") renderStatus(host);
  else if (S.view === "delays") renderDelays(host);
  else renderGantt(host);

  var ms = performance.now() - t0;
  var perf = document.getElementById("perf");
  if (perf) {
    // First paint carries the cost of building the page; a redraw is
    // the number the scale switcher is actually judged on, and
    // labelling both the same made every screenshot show cold start.
    perf.innerHTML = (FIRST_PAINT ? "first paint " : "redrawn in ") + "<b>" + ms.toFixed(1) +
      " ms</b> <span class=\"sep\">·</span> <b>0</b> requests <span class=\"sep\">·</span> <b>0</b> writes";
  }
  FIRST_PAINT = false;
  writeURL();
}

/* Boot */
readURL();
// Warm the text measurer before the first paint is timed. The first
// measureText against a webfont pays for the font, and charging that
// to the renderer made the timing readout a font-loading benchmark.
textPx("warm the measurer", 12);
textPx("warm the measurer", 10);
textPx("warm the measurer", 9.5, 600);
document.querySelectorAll(".tab").forEach(function (b) {
  b.addEventListener("click", function () { S.view = b.getAttribute("data-view"); render(); });
});
render();
if (S.task) openTask(S.task);
</script>
